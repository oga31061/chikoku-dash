*{box-sizing:border-box}
body{
  margin:0;
  background:#141820;
  font-family:"PixelJP",monospace;
  -webkit-font-smoothing:none;
  font-smooth:never;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  color:#f8f8f8;
}
.game-wrap{ position:relative; }
.header{
  padding:4px 8px;
  font-size:16px;
}
.screen{ position:relative; overflow:hidden; }
canvas{
  display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
.heart{ color:#e03838; }
.lifelabel .heart + .heart{ margin-left:calc(var(--dot) * 2); }   /* ハートどうしの間をあける */
.stock{ display:inline-flex; gap:0; margin-left:calc(var(--dot) * 4); align-items:center; }
.can{ display:block; }
/* メダル（はやいな評価のごほうび） */
.medal{ display:block; }
.medaltxt{ white-space:nowrap; }
/* リザルト・記録：文字と同じ行に置き、メダルの下端を文字の下端（基準線の2ドット下）にそろえる */
.medaltxt .medal{ display:inline-block; vertical-align:-.25em; margin-right:.2em; }   /* 大きさはドット等倍（medalSVG が指定） */
.medaltxt.mini .medal{ height:.8em; width:.8em; vertical-align:0; margin-right:.15em; }
.medalstack{
  position:absolute; right:calc(var(--dot) * 5); bottom:calc(var(--dot) * 5);   /* 画面下の地面の帯：右にメダル×数 */
  display:flex; align-items:center; gap:calc(var(--dot) * 2); font-size:calc(var(--dot) * 8); color:#f8f8f8; white-space:nowrap;
  pointer-events:none; z-index:4;
}
.medalstack.new{ animation:medalin .5s steps(5, end); }
@keyframes medalin{ 0%{ transform:translateY(calc(var(--dot) * -6)); } 100%{ transform:none; } }
.medalpop{
  position:absolute; pointer-events:none; z-index:4;   /* クリア画面の文字より奥（文字にかぶらない） */
  transform:translate(-50%, -100%);
  animation:medalpop 2.2s steps(22, end) forwards;
}

@keyframes medalpop{
  0%  { transform:translate(-50%, -100%); opacity:1; }
  20% { transform:translate(-50%, calc(-100% - var(--dot) * 12)); opacity:1; }
  85% { transform:translate(-50%, calc(-100% - var(--dot) * 14)); opacity:1; }
  100%{ transform:translate(-50%, calc(-100% - var(--dot) * 14)); opacity:0; }
}
.medalpop .spark{ position:absolute; width:calc(var(--dot) * 5); height:calc(var(--dot) * 5); animation:spark .5s steps(1, end) infinite; }
@keyframes spark{ 0%{ opacity:1; } 50%{ opacity:0; } }
.screen.paused .medalpop, .screen.paused .medalpop .spark, .screen.paused .medalstack .new{ animation-play-state:paused !important; }
.cangap{ display:block; width:calc(var(--dot) * 3); }

/* 「−♥1」：マイナスは線で描いて高さを中央に、間隔は均等に */
.dmg{ display:inline-flex; align-items:center; gap:.3em; }
.dmg .minus{
  display:inline-block;
  width:.5em;
  height:.14em;
  background:#f8f8f8;
  box-shadow:2px 2px 0 #1c2030, -1px -1px 0 #1c2030, 1px -1px 0 #1c2030, -1px 1px 0 #1c2030;
}
.dmg .neg, .dmg .pos{ display:inline-flex; align-items:center; gap:.15em; }
.dmg .neg{ color:#ff5050; }
.dmg .neg .minus{ background:#ff5050; }
.dmg .pos{ color:#f8d030; }
.dmg .pos .plus::before, .dmg .pos .plus::after{ background:#f8d030; }
.dmg .plus{ position:relative; display:inline-block; width:.62em; height:.62em; }
.dmg .plus::before, .dmg .plus::after{
  content:""; position:absolute; background:#f8f8f8;
  box-shadow:2px 2px 0 #1c2030;
}
.dmg .plus::before{ left:0; top:.24em; width:.62em; height:.14em; }
.dmg .plus::after{ left:.24em; top:0; width:.14em; height:.62em; }
.heart.lost{ color:#5a5c64; }
.meter{
  position:absolute;
  top:50%;
  right:2%;
  transform:translateY(-50%);
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:.2em;
}
.meter .arrow{
  width:1em;
  height:1em;
  fill:#f8f8f8;
  filter:drop-shadow(2px 2px 0 #1c2030) drop-shadow(-1px -1px 0 #1c2030);
}
.daylabel{
  position:absolute;
  top:calc(var(--dot) * 4);
  right:3%;
  white-space:nowrap;
  text-align:right;
}
/* 画面下：ゲームの情報だけ（ライフ・残り時間・スピード） */
.lifelabel{
  position:absolute;
  top:calc(var(--dot) * 4);    /* 左上：ハートとエナドリ（その下にセリフウィンドウ） */
  left:calc(var(--dot) * 5);
  white-space:nowrap;
  display:flex;
  align-items:center;   /* ハートとエナドリの高さをそろえる */
}
.hud{
  position:absolute;
  top:calc(var(--dot) * 16);   /* 右上：日にちの下に今の時刻だけ */
  right:3%;
  white-space:nowrap;
  letter-spacing:.05em;
}
.hurry{ color:#ff6060; }
.meter .num, .num{ color:#f8d030; }
.outline{
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
}
.msgwin{
  position:absolute;
  top:calc(var(--dot) * 16);   /* ハートとエナドリの下 */
  left:calc(var(--dot) * 3);
  /* 一番長いセリフ（10文字）＋顔アイコンが収まる、ぎりぎりの幅 */
  width:calc(var(--dot) * 118);
  height:calc(var(--dot) * 30);
  box-sizing:border-box;
  display:flex;
  align-items:center;
  gap:calc(var(--dot) * 4);
  padding:0 calc(var(--dot) * 4);
  background:transparent;
  border:var(--dot) solid #f8f8f8;
  /* 枠にも1ドットの影 */
  box-shadow:var(--dot) var(--dot) 0 #1c2030, inset var(--dot) var(--dot) 0 #1c2030;
  color:#f8f8f8;
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
  white-space:nowrap;
}
.msgwin .msg{ text-align:left !important; }
/* 「きょうははやいな！」のとき、セリフウィンドウの下に */
.umbstars{ position:absolute; transform:translate(-50%, -100%); font-size:calc(var(--dot) * 8); color:#f8d030; white-space:nowrap; pointer-events:none; opacity:0; z-index:5; }
.umbstars.show{ animation:umbshow 1.1s steps(1, end) forwards; }
@keyframes umbshow{ 0%{ opacity:1; } 90%{ opacity:1; } 100%{ opacity:0; } }
.umbstars .lose{ animation:umblose .5s steps(1, end) forwards; }
@keyframes umblose{ 0%{ opacity:1; } 20%{ opacity:0; } 40%{ opacity:1; } 60%{ opacity:0; } 80%{ opacity:1; } 100%{ opacity:0; } }
.screen.paused .umbstars, .screen.paused .umbstars .lose{ animation-play-state:paused !important; }
.medalmsg{ position:absolute; top:calc(var(--dot) * 49); left:calc(var(--dot) * 4); font-size:calc(var(--dot) * 8); color:#f8d030; white-space:nowrap; z-index:4; }
.daybanner{
  position:absolute;
  top:42%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:calc(var(--dot) * 24);
  color:#f8f8f8;
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  text-shadow:calc(var(--dot) * 2) calc(var(--dot) * 2) 0 #1c2030, calc(var(--dot) * -2) 0 0 #1c2030, calc(var(--dot) * 2) 0 0 #1c2030, 0 calc(var(--dot) * -2) 0 #1c2030, 0 calc(var(--dot) * 2) 0 #1c2030;
}
.daybanner.show{ animation:daybanner 1.8s steps(1, end) forwards; }
@keyframes daybanner{
  0%   { opacity:1; }
  85%  { opacity:1; }
  100% { opacity:0; }
}
.screen.paused .daybanner{ animation-play-state:paused !important; }
.hurrypop{
  position:absolute;
  transform:translate(-50%, -100%);
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
}
.hurrypop.hop{ animation:hop 1s steps(10, end) forwards; }
@keyframes hop{
  0%   { opacity:1; transform:translate(-50%, -100%); }
  15%  { opacity:1; transform:translate(-50%, -190%); }
  30%  { opacity:1; transform:translate(-50%, -150%); }
  75%  { opacity:1; transform:translate(-50%, -170%); }
  100% { opacity:0; transform:translate(-50%, -190%); }
}
.msgwin .face{
  width:calc(var(--dot) * 20);
  height:calc(var(--dot) * 20);
  image-rendering:pixelated;
  flex:none;
  background:#d6e2ea;
  box-shadow:var(--dot) var(--dot) 0 #1c2030;
}
.msgwin .msg{ flex:1; min-width:0; text-align:center; overflow:hidden; }
.msgwin .msg.red{ color:#ff6060; }
.speedo{
  display:none !important;   /* スピード表示はなし */
  position:absolute;
  top:calc(var(--dot) * 24);
  right:3%;
  white-space:nowrap;
  letter-spacing:.08em;
}
.boostlabel{
  display:none !important;   /* ブーストはセリフウィンドウの顔で知らせる */
  position:absolute;
  top:calc(var(--dot) * 24);
  right:3%;
  color:#f8d030;
  white-space:nowrap;
  letter-spacing:.08em;
}
.popup{
  position:absolute;
  top:30%;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
}
.popup.show{ animation:pop 1.8s steps(1,end) forwards; }
@keyframes pop{
  0%   { opacity:1; transform:translate(-50%, 8px); }
  8%   { opacity:1; transform:translate(-50%, 0); }
  85%  { opacity:1; transform:translate(-50%, 0); }
  100% { opacity:0; transform:translate(-50%, 0); }
}
.headpop{
  position:absolute;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%, -100%);
}
.headpop.up{ color:#f8d030; }
.headpop.red{ color:#ff6060; }
.headpop.down{ color:#80c0ff; }
.headpop.talk{ animation:talk 2.4s steps(1,end) forwards; }
@keyframes talk{
  0%   { opacity:1; }
  88%  { opacity:1; }
  100% { opacity:0; }
}
.headpop.show{ animation:headpop 1s steps(6,end) forwards; }
@keyframes headpop{
  0%   { opacity:1; transform:translate(-50%, -100%); }
  80%  { opacity:1; transform:translate(-50%, -180%); }
  100% { opacity:0; transform:translate(-50%, -180%); }
}
.controls{
  position:absolute;
  bottom:calc(var(--dot) * 3);

}
.ctl{

  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
  font-size:calc(var(--dot) * 8) !important;

  animation:none !important;
  line-height:1.2;
}
.ctl.vol{
  width:calc(var(--dot) * 16);
  height:calc(var(--dot) * 16);
  padding:0 !important;
  display:flex;
  align-items:center;
  justify-content:center;
}
.ctl.vol svg{
  width:calc(var(--dot) * 12);
  height:calc(var(--dot) * 12);
  fill:#f8f8f8;
  filter:drop-shadow(var(--dot) var(--dot) 0 #1c2030);
}
.ctl:active{ transform:translate(var(--dot), var(--dot)); }
/* ポーズボタン：ゲーム画面の上の真ん中（ハート列と時計のすきま） */
.pausebtn{
  position:absolute; right:3%; top:calc(var(--dot) * 28);   /* 右上：時刻の下に右寄せ（週があるときは JS で1行下げる） */
  width:calc(var(--dot) * 12); height:calc(var(--dot) * 12);
  padding:0 !important; display:flex; align-items:center; justify-content:center; z-index:10;
}
.pausebtn.on{ background:#f8f8f8 !important; }
.pausebtn.on svg{ fill:#1c2030; filter:none; }
.pausebtn svg, .volopt svg{ width:calc(var(--dot) * 8); height:calc(var(--dot) * 8); fill:#f8f8f8; filter:drop-shadow(var(--dot) var(--dot) 0 #1c2030); display:block; }
.pausemenu{
  position:absolute; inset:0; background:rgba(16,18,28,.86);   /* 後ろのセリフ枠などが透けて見えにくい濃さ */
  display:flex; align-items:center; justify-content:center;
  color:#f8f8f8; z-index:8; padding-top:calc(var(--dot) * 10);
}
.pausemenu.hidden{ display:none; }
/* 交換画面 */
.xchg{
  position:absolute; inset:0; z-index:12; background:rgba(16,18,28,.72);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--dot) * 5);
  color:#f8f8f8; font-size:calc(var(--dot) * 8);
}
.xchg.hidden{ display:none; }
.xrow{ display:flex; align-items:center; gap:calc(var(--dot) * 6); }
.xbox{ position:relative; }
.xbox .hp{ position:absolute; top:calc(var(--dot) * 3); left:0; right:0; text-align:center; color:#f8f8f8; } .xbox .hp b{ color:#ff6a6a; font-weight:400; }
.xbox > svg{ margin-top:0; }
.xbox{
  width:calc(var(--dot) * 54); height:calc(var(--dot) * 54); flex-direction:column; gap:calc(var(--dot) * 2); color:#f8f8f8; font-size:calc(var(--dot) * 8) !important; line-height:1.3; text-shadow:var(--dot) var(--dot) 0 #1c2030; padding:0 !important;
  background:rgba(255,255,255,.08) !important; border:var(--dot) solid #a8b0bc !important;
  box-shadow:var(--dot) var(--dot) 0 #1c2030 !important; animation:none !important;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.xbox.sel{ border-color:#f8d030 !important; background:rgba(248,208,48,.18) !important; outline:var(--dot) solid #f8d030; }
.xbox.off{ opacity:.28; cursor:default; }
.xbox svg, .xpop svg{ display:block; }
.xtext{ display:flex; flex-direction:column; align-items:center; gap:calc(var(--dot) * 4); text-align:center; line-height:1.5; }
.xgot{ min-height:calc(var(--dot) * 10); color:#f8d030; }
.xpop{ position:absolute; pointer-events:none; transform:translate(-50%, -50%); }
.xpop.go{ animation:xpop 1.2s steps(12, end) forwards; }
@keyframes xpop{
  0%  { transform:translate(-50%, -50%) scale(1); opacity:1; }
  40% { transform:translate(-50%, calc(-50% - var(--dot) * 30)) scale(1.3); opacity:1; }
  80% { transform:translate(-50%, calc(-50% - var(--dot) * 34)) scale(1.3); opacity:1; }
  100%{ transform:translate(-50%, calc(-50% - var(--dot) * 34)) scale(1.3); opacity:0; }
}
.pmbox{ display:flex; gap:calc(var(--dot) * 6); align-items:stretch; height:calc(var(--dot) * 96); }
.pmtabs{ display:flex; flex-direction:column; gap:calc(var(--dot) * 4); width:calc(var(--dot) * 56); }
.pmtab, .pmclose{ width:100%; padding:calc(var(--dot) * 3) 0 !important; }
.pmclose{ margin-top:auto; }   /* 項目の下（一番下）に「とじる」 */
.pmtab.on{ background:#f8f8f8 !important; color:#1c2030 !important; text-shadow:none !important; }
.pmbody{
  width:calc(var(--dot) * 150); border:var(--dot) solid #f8f8f8; box-shadow:var(--dot) var(--dot) 0 #1c2030;
  padding:calc(var(--dot) * 6); font-size:calc(var(--dot) * 8); box-sizing:border-box;
}
.pmpane{ display:none; height:100%; }
.pmpane.on{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--dot) * 6); }
.pmpane .reclist{ font-size:calc(var(--dot) * 8); line-height:1.6; margin:0; padding:0; list-style:none; text-align:left; }

.pmsub{ color:#c8ccd8; }
.volopts{ display:flex; align-items:center; gap:calc(var(--dot) * 3); }
.volbar{ display:flex; align-items:flex-end; gap:var(--dot); height:calc(var(--dot) * 14); }
.volseg{
  width:calc(var(--dot) * 5); padding:0 !important; border:var(--dot) solid #f8f8f8 !important;
  background:transparent !important; box-shadow:var(--dot) var(--dot) 0 #1c2030 !important; animation:none !important;
}
.volseg.on{ background:#f8f8f8 !important; }
.volseg:nth-child(1){ height:calc(var(--dot) * 5); } .volseg:nth-child(2){ height:calc(var(--dot) * 6); }
.volseg:nth-child(3){ height:calc(var(--dot) * 7); } .volseg:nth-child(4){ height:calc(var(--dot) * 8); }
.volseg:nth-child(5){ height:calc(var(--dot) * 9); } .volseg:nth-child(6){ height:calc(var(--dot) * 10); }
.volseg:nth-child(7){ height:calc(var(--dot) * 11); } .volseg:nth-child(8){ height:calc(var(--dot) * 12); }
.volseg:nth-child(9){ height:calc(var(--dot) * 13); } .volseg:nth-child(10){ height:calc(var(--dot) * 14); }
.volopt{ width:calc(var(--dot) * 14); height:calc(var(--dot) * 14); padding:0 !important; display:flex; align-items:center; justify-content:center; }
.volopt.on{ background:#f8f8f8 !important; }
.volopt.on svg{ fill:#1c2030; filter:none; }
/* 遊び方：タイトルだけ */

/* 記録（ポーズ中）：半透明の黒の上に上位5件 */
.recpanel{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:calc(var(--dot) * 4);
  color:#f8f8f8;
  z-index:9;   /* ポーズメニューより手前 */
}
.recpanel .rectitle{ font-size:calc(var(--dot) * 16); }
.recpanel .reclist{ font-size:calc(var(--dot) * 8); line-height:1.6; margin:0; padding:0; list-style:none; text-align:left; }
.recpanel .rechint{ font-size:calc(var(--dot) * 8); color:#c8ccd8; }
.recpanel.hidden{ display:none; }
/* ポーズ中は画面内のアニメーションも止める */
.screen.paused .headpop, .screen.paused .hurrypop, .screen.paused .popup{ animation-play-state:paused !important; }
.help{
  text-align:center;
  margin-top:8px;
  color:#a8b0bc;
  font-size:15px;
}
.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
}
.overlay.clear{ background:transparent; }
/* タイトル画面：ウィンドウを使わず、背景の上に文字を直接のせる */
.overlay{ background:transparent !important; pointer-events:none; }
.overlay button{ pointer-events:auto; }
.overlay .card{ background:transparent; border:0; box-shadow:none; width:auto; }
/* 結果画面は左上のセリフウィンドウと重ならないよう少し下げる */
.overlay:not(.menu) .card{ transform:translateY(calc(var(--dot) * 24)); padding:0; }   /* 左上のセリフ枠とハート列の下、道の上あたりに */
.overlay:not(.menu) .card h1{ margin-bottom:calc(var(--dot) * 3) !important; }
.overlay .card p{ margin:calc(var(--dot) * 3) 0 calc(var(--dot) * 4) !important; }
.overlay .card p{
  color:#f8f8f8;
  font-size:calc(var(--dot) * 8) !important;
  line-height:1.6;
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
}
.overlay .card h1{
  font-size:calc(var(--dot) * 24) !important;
  color:#f8f8f8;
  margin:0 0 calc(var(--dot) * 10);
  text-shadow:calc(var(--dot) * 2) calc(var(--dot) * 2) 0 #1c2030, calc(var(--dot) * -2) 0 0 #1c2030, calc(var(--dot) * 2) 0 0 #1c2030, 0 calc(var(--dot) * -2) 0 #1c2030, 0 calc(var(--dot) * 2) 0 #1c2030;
}
.overlay button{
  background:transparent;
  box-shadow:none;
  color:#f8f8f8;
  font-size:calc(var(--dot) * 8) !important;
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
  animation:blink 1.2s steps(1, end) infinite;
}
/* 週クリア：タイトルとボタンを大きく（上のUIに重なってもよい） */
.overlay.weekend .card{ transform:translateY(calc(var(--dot) * 10)) !important; }
.overlay.weekend .card h1{ font-size:calc(var(--dot) * var(--tsize, 40)) !important; white-space:nowrap; }
.overlay.weekend button{ font-size:calc(var(--dot) * 16) !important; }
@keyframes blink{ 0%{ opacity:1; } 60%{ opacity:0; } 100%{ opacity:0; } }
.card{
  width:min(480px,90vw);
  background:#1c2030;
  border:6px solid #f8f8f8;
  box-shadow:0 0 0 6px #1c2030;
  padding:28px;
  text-align:center;
}
.card h1{ margin:0 0 10px; font-size:36px; font-weight:400; }
.card p:empty{ display:none; }
.card p{ line-height:1.8; color:#d0d4dc; }
button{
  font-family:inherit;
  border:0;
  padding:12px 34px;
  font-size:20px;
  background:#f8d030;
  color:#1c2030;
  cursor:pointer;
  box-shadow:4px 4px 0 #806018;
}
button:disabled{ opacity:.4; cursor:default; }
button:active{ transform:translate(4px,4px); box-shadow:none; }

/* ゲーム画面内の文字：8ドット＝1文字 */
.hud, .daylabel, .lifelabel, .hurrypop, .meter, .speedo, .boostlabel, .headpop, .msgwin{ font-size:calc(var(--dot) * 8); line-height:1.2; }
.popup{ font-size:calc(var(--dot) * 16); line-height:1.2; }
.header{ font-size:var(--ui); display:flex; justify-content:space-between; align-items:center; line-height:1.2; gap:1em; }
.header{ overflow:hidden; }
.header .hint{ flex:1; min-width:0; text-align:left; color:#a8b0bc; font-size:.7em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

#bestLabel{ white-space:nowrap; }
.ctl.vol{
  width:calc(var(--dot) * 16);
  height:calc(var(--dot) * 16);
  padding:0 !important;
  display:flex;
  align-items:center;
  justify-content:center;
}
.ctl.vol svg{
  width:calc(var(--dot) * 12);
  height:calc(var(--dot) * 12);
  fill:#f8f8f8;
  filter:drop-shadow(var(--dot) var(--dot) 0 #1c2030);
}
.ctl:active{ transform:translate(var(--dot), var(--dot)); }
/* 記録（ポーズ中）：半透明の黒の上に上位5件 */
.recpanel{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:calc(var(--dot) * 4);
  color:#f8f8f8;
  z-index:9;   /* ポーズメニューより手前 */
}
.recpanel .rectitle{ font-size:calc(var(--dot) * 16); }
.recpanel .reclist{ font-size:calc(var(--dot) * 8); line-height:1.6; margin:0; padding:0; list-style:none; text-align:left; }
.recpanel .rechint{ font-size:calc(var(--dot) * 8); color:#c8ccd8; }
.recpanel.hidden{ display:none; }
/* ポーズ中は画面内のアニメーションも止める */
.screen.paused .headpop, .screen.paused .hurrypop, .screen.paused .popup{ animation-play-state:paused !important; }
.help{ font-size:var(--ui); }
.card p{ font-size:var(--ui); }
.card h1{ font-size:calc(var(--ui) * 2) !important; }
button{ font-size:var(--ui) !important; }
.hidden{display:none}
</style>
</head>

<body>

<div class="game-wrap" id="wrap">
  <div class="header"><span class="hint">Space/タップ ジャンプ</span><span id="bestLabel">Best: -</span></div>
  <div class="screen">
    <canvas id="game" width="264" height="144"></canvas>
    <!-- 画面下中央のポーズボタン（左右どちらの手でも押せる）。ほかの場所はどこをタップしてもジャンプ -->
    <button class="ctl icon pausebtn" id="btnPause" aria-label="メニュー"></button>
    <div class="daylabel outline hidden" id="dayLabel">1日目</div>
    <div class="lifelabel outline hidden" id="lifeLabel"></div>
    <div class="meter outline hidden" id="meter"><svg class="arrow" viewBox="0 0 9 9" shape-rendering="crispEdges"><path d="M0 3h4V0h1v1h1v1h1v1h1v1h1v1H8v1H7v1H6v1H5v1H4V6H0z"/></svg><span><span class="num" id="meterNum">400</span>m</span></div>
    <div class="hud outline hidden" id="hud"></div>
    <div class="popup outline" id="popup"></div>
    <div class="headpop outline" id="headpop"></div>
    <div class="headpop outline" id="teacherpop"></div>
    <div class="medalpop hidden" id="medalpop"></div>
    <div class="medalstack" id="medalStack"></div>
    <div class="headpop outline" id="dmgpop"></div>
    <div class="umbstars outline" id="umbStars"></div>
    <div class="headpop outline" id="usepop"></div>
    <div class="headpop outline" id="healpop"></div>
    <div class="headpop outline" id="elderpop"></div>
    <div class="boostlabel outline hidden" id="boostLabel">BOOST!</div>
    <div class="speedo outline hidden" id="speedo">SPEED ×1.00</div>
    <div class="hurrypop outline" id="hurry">いそげ！</div>
    <div class="daybanner" id="dayBanner"></div>
    <div class="medalmsg outline hidden" id="medalMsg">メダルをもらった！</div>
    <div class="msgwin hidden" id="msgWin"><img class="face" id="faceL" alt=""><span class="msg" id="msgText"></span></div>
    <!-- タイトル・結果（ゲーム画面の中に置くので、スマホの縦画面でも画面に対して中央） -->
    <div class="overlay menu" id="overlay">
      <div class="card">
        <h1 id="title">遅刻ダッシュ！</h1>
        <p id="message"></p>
        <button id="start">スタート</button>
      </div>
    </div>
    <!-- ポーズメニュー（タブ式）：左にタブ、右に中身。開け閉めは上のポーズボタンだけ -->
    <!-- メダル3つの交換画面（クリアのリザルト中、いちばん手前）。アイコンは最下段に横並び -->
    <div class="xchg hidden" id="xchg">
      <div class="xtext outline"><div>メダル3つと こうかんできるよ！</div><div>えらんでね！</div></div>
      <div class="xrow">
        <button class="xbox" data-x="bike" aria-label="自転車"></button>
        <button class="xbox" data-x="umb" aria-label="傘"></button>
        <button class="xbox" data-x="bread" aria-label="食パン"></button>
        <button class="xbox" data-x="skip" aria-label="こうかんしない"></button>
      </div>
      <div class="xgot outline" id="xGot"></div>
      <div class="xpop" id="xPop"></div>
    </div>
    <div class="pausemenu hidden" id="pauseMenu">
      <div class="pmbox">
        <div class="pmtabs">
          <button class="ctl pmtab" data-tab="rec">記録</button>
          <button class="ctl pmtab" data-tab="vol">音量</button>
          <button class="ctl pmtab" data-tab="title" id="tabTitle">タイトルへ</button>
          <button class="ctl pmclose" id="btnClose">とじる</button>
        </div>
        <div class="pmbody outline">
          <div class="pmpane" data-pane="rec"><ol class="reclist" id="recList"></ol></div>
          <div class="pmpane" data-pane="vol"><div class="volopts" id="volOpts"></div></div>
          <div class="pmpane" data-pane="title"><p class="pmq">タイトルにもどる？<br><span class="pmsub">（ここまでの記録はのこります）</span></p><button class="ctl" id="btnTitle">もどる</button></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// =====================================================
//  低解像度（220×120）で描いて整数倍に拡大 → ドットの大きさが全画面で統一
// =====================================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const W = canvas.width;   // 264（少し引いた画：前方が広く見える）
const H = canvas.height;  // 144
// ゲーム内の座標は高さ120基準のまま。増えた24ドットを上（空）と下（道路）に半分ずつ足す
const VIEW_OY = 10;   // 世界を上に寄せて、画面下の地面（ハート・エナドリ・メダルを置く帯）を広くとる
const groundY = 98;
// 道を広くして少し見下ろす感じに：女の子・猫・障害物・門などは、塀の下端（groundY）より LANE だけ手前（下）に描く。
// 当たり判定などの計算はこれまでどおり groundY 基準のまま（見た目だけずらす）
const LANE = 14;

// ===== ゲーム設定（難易度はここで調整） =====
const CONFIG = {
  sectionLen:  640,    // 1区間（=100m）の長さ（ドット）
  sections:    4,      // （表示用の区切り。実際の長さは courseMeters）
  courseMeters: 600,   // 学校までの距離（m）
  baseSpeed:   1.45,   // 初期スピード（ドット/フレーム）
  autoUp:      0.08,   // ノーミスで走っていると 100m ごとに +0.08倍（永続、なめらかに上昇）。1日あたりの伸びは 800m時代と同じ
  drinkBonus:  1.00,   // エナドリ：一定時間 +1.00倍（スピード表示には足さない）
  drinkTime:   150,    // エナドリの効果時間（フレーム、60=1秒）
  puddleDown:  0.20,   // 水たまり1回で −0.20倍（永続）
  minMul:      1.00,   // 下がる下限（×1.0より下げない）
  bananaDown:  0.20,   // バナナ1回で −0.20倍（永続）。ライフは減らない
  rollTime:    48,     // バナナで転がっている時間（フレーム）
  flipTime:    20,     // 空中クルッ：その高さで止まって1回転する時間（フレーム）
  carrySpeed:  true,   // 次の日にスピード倍率を引き継ぐか（false = 毎朝×1.00から）
  timeLimit:   37.5,   // 1日の制限時間（秒）。ゲーム内時計で 7:30 → 7:55（1.5秒＝1分）
  secPerMinute: 1.5,   // 現実の何秒でゲーム内の1分が進むか
  lateDensity: 2.0,    // コース終盤の障害物密度（序盤を1として）。後半ほど難しく
  maxDrinks:   10,     // エナドリのストック上限（日・週をまたいで持ち越し）
  healDrinks:  5,      // ライフが減っているとき、この本数たまったら自動で消費して ♥+1
  starDrinks:  10,     // ライフ満タンでこの本数たまると無敵タイム（全部消費）
  bikeBonus:   0.15,   // 自転車に乗っている間のスピード上乗せ（少し速い）
  starTime:    225,    // 無敵タイムの長さ（フレーム）。条件が厳しいのでエナドリの1.5倍（3日目あたりで無敵になれば「はやいな」メダルに届く）
  starBonus:   3.00,   // 無敵タイム中の上乗せ（トップスピード）
  clockStart:  450,    // 7:30（分）

// 音量：最大 → 無音 → 1 → 2 → 最大 の順に切り替え（全部の音がマスター音量を通る）
const VOL_STEPS = 10;   // 音量バーの目盛り（0＝無音〜10＝最大）
let volStep = VOL_STEPS;
const volGain = () => volStep / VOL_STEPS;
let masterGain = null;
function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = volGain();
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
}
function outNode(){ return masterGain || audioCtx.destination; }

function playNote(freq, type, duration, vol=0.08){
  if(!audioCtx || !freq) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(outNode());
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playNoise(duration, vol=0.03){
  if(!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  noise.connect(gain);
  gain.connect(outNode());
  noise.start();
}

let bgmStep = 0;
function startBGM(fromStart = true){
  initAudio();
  stopBGM();
  if(fromStart) bgmStep = 0;
  // 1ステップのミリ秒：通常 120、無敵中は速く
  isBgmPlaying = true;
  let acc = 120, prev = performance.now();
  bgmInterval = setInterval(() => {
    if(!isBgmPlaying) return;
    const now = performance.now();
    acc += Math.min(now - prev, 200); prev = now;
    const fast = starT > 0;
    const tempo = fast ? 75 : 120;
    if(acc < tempo) return;
    acc = Math.min(acc - tempo, tempo);
    const k = tempo / 120;
    const step = bgmStep;
    const mFreq = bgmMelody[step % bgmMelody.length];
    if(mFreq > 0) playNote(mFreq, "square", 0.11 * k, 0.06);      // メロディ（矩形波）
    const bFreq = bgmBass[step % bgmBass.length];
    if(bFreq > 0) playNote(bFreq, "triangle", 0.15 * k, 0.12);    // ベース（三角波）
    if(step % 2 === 0) playNoise(0.03, 0.02);                 // ハイハット
    if(step % 4 === 2) playNoise(0.08 * k, 0.05);             // スネア風
    bgmStep++;
  }, 10);
}

function stopBGM(){
  isBgmPlaying = false;
  if(bgmInterval){
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

}

const rand = (a,b)=> a + Math.random()*(b-a);
const irand = (a,b)=> Math.floor(rand(a,b+1));

const layers = {
  clouds:    { period:660, factor:.03, items:[] },
  hills:     { period:660, factor:.06, heights:[] },
  farHouses: { period:440, factor:.14, items:[] },
  nearHouses:{ period:440, factor:.3,  items:[] },
  front:     { period:110, factor:.6 },
  verge:     { period:960, factor:1.25, items:[] },   // 手前の植え込み（地面より速く流れる）
};

function fillPeriod(period, makeItem, gapMin, gapMax){
  const items = [];
  let x = irand(0, gapMax);
  while(true){
    const it = makeItem();
    if(x + it.w > period - gapMin) break;
    it.x = x;
    items.push(it);
    x += it.w + irand(gapMin, gapMax);
  }
  return items;
}

function createTown(){
  layers.clouds.items = fillPeriod(660, ()=>({ w:irand(18,32), y:irand(14,34) }), 40, 90);
  const p1 = rand(0,6), p2 = rand(0,6);
  layers.hills.heights = [];
  for(let x=0;x<660;x++){
    const t = x/660*Math.PI*2;
    layers.hills.heights.push(Math.round(66 + Math.sin(t*2+p1)*5 + Math.sin(t*5+p2)*2));
  }
  layers.farHouses.items = fillPeriod(440,
    ()=>({ w:irand(12,20), wall:irand(7,11), roof:irand(4,6) }), 1, 8);
  layers.nearHouses.items = fillPeriod(440,
    ()=>({ w:irand(22,32), wall:irand(14,22), roof:irand(6,9), c:irand(0,2), tree:Math.random()<.5 }), 8, 22);
  // 手前：花壇はたまに、野花はまばらに
  layers.verge.items = fillPeriod(960, ()=>{
    if(Math.random() < .3){
      const w = irand(22, 34), flowers = [];
      for(let fx = 2; fx < w - 3; fx += irand(4, 7)) flowers.push({ dx:fx, dy:irand(0, 1), c:PAL.flowers[irand(0, 2)] });
      return { kind:"bed", w, flowers };
    }
    return { kind:"wild", w:7, c:PAL.flowers[irand(0, 2)] };
  }, 90, 260);
}

// ===== コース配置 =====
// コースを「頭数分のエリア」に分け、各エリアに1つだけ置く。エリア内の位置はランダム。
// s = その物が画面右端に現れるときのスクロール量
function buildCourse(){
  // 正門前の約40mは何も出さない（ゴール演出中に障害物が残らないように）
  const start = 150, end = COURSE - W - 260;
  // エリアに1つずつ、エリア内の位置は完全ランダム（種類をまたいだ調整はしない）
  // 後半ほど密に：密度がコース頭→終わりで 1 → CONFIG.lateDensity 倍に直線的に上がるようにエリアを切る
  // （後半はスピードも上がっているので、同じ間隔だと時間あたりの密度が薄く感じる）
  const rd = CONFIG.lateDensity, tot = 1 + (rd - 1) / 2;
  const edge = q => {   // 累積密度が q（0〜1）になる位置（0〜1）
    if(rd === 1) return q;
    const a = (rd - 1) / 2;   // a x² + x = q*tot を解く
    return (-1 + Math.sqrt(1 + 4 * a * q * tot)) / (2 * a);
  };
  const scatter = (n, make)=>{
    const out = [], N = Math.max(1, n);
    for(let i=0;i<n;i++){
      const a = edge(i / N), b = edge((i + 1) / N);
      out.push(Object.assign({ s: start + (a + Math.random() * (b - a)) * (end - start) }, make()));
    }
    return out;
  };

  // エナドリ：固定の一定間隔（高さはランダム）
  const cans = [];
  // 1日目（やり直し直後）は遅さがつらいので、すぐにエナドリを置く
  for(let s = start + CONFIG.canInterval / 2; s < end; s += CONFIG.canInterval){
    cans.push({ s, y: irand(56, 68) });
  }
  const n = dayIdx(week, day) + 1;   // 通しで何日目か（茶トラは第1週3日目から）
  const tabbyRate = n < CONFIG.tabbyFrom ? 0 : Math.min(CONFIG.tabbyMax, CONFIG.tabbyPerDay * (n - CONFIG.tabbyFrom + 1));
  const makeCat = ()=>{
    const r = Math.random();
    const kind = r < tabbyRate ? "tabby" : (r < tabbyRate + .2 ? "sleep" : "run");
    return { kind, sleeping: kind === "sleep",
      type: kind === "tabby" ? "tabby" : (kind === "sleep" ? "white" : "black") };   // 白猫＝寝てる、黒猫＝走る
  };
  const cats = scatter(countFor("cats"), makeCat);
  // 序盤の緊張感：最初の約150m（2エリア）に猫を1匹ずつ追加
  const OPEN = 960, openL = OPEN / 2;
  for(let i=0;i<2;i++) cats.push(Object.assign({ s: start + 120 + i*openL + Math.random()*(openL - 60) }, makeCat()));
  cats.sort((a, b) => a.s - b.s);
  const bananas = scatter(countFor("bananas"), ()=>({}));
  const crows = scatter(countFor("crows"), ()=>({ phase: Math.random() * Math.PI * 2 }));
  const puddles = scatter(countFor("puddles"), ()=>({ w:irand(16, 24) }));
  return { cats, cans, puddles, bananas, crows };
}

let records = [];        // { idx, medals, speed, at }（ページを開いている間）
let runRecorded = false;
function addRecord(idx, speed){
  if(runRecorded) return;
  runRecorded = true;
  const d = new Date();
  records.push({ idx, medals, speed, at: `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}` });
  records.sort((a, b) => b.idx - a.idx || b.medals - a.medals || b.speed - a.speed);
  records = records.slice(0, 5);
  noteBest(idx);
}
// ベスト：日数が長い回。日数が同じならメダルが多い回
let bestMedals = 0;
function noteBest(idx){
  if(idx > bestIdx || (idx === bestIdx && medals > bestMedals)){ bestIdx = idx; bestMedals = medals; }
  updateBest();
}
const bestText = () => idxLabel(bestIdx) + (bestMedals > 0 ? "　" + medalText(bestMedals) : "");
// 上の帯は簡略版：紐なしの金メダル（丸）だけ
// 字と同じ高さの、縁取りなしの金色の丸だけ

const bestMini = () => idxLabel(bestIdx) + (bestMedals > 0 ? ` <span class="medaltxt mini">${MEDAL_MINI_SVG}×${bestMedals}</span>` : "");
// 上の帯の右側に、いつでも最高記録
function updateBest(){ document.getElementById("bestLabel").innerHTML = "Best: " + (bestIdx >= 0 ? bestMini() : "-"); }

// ポーズメニュー：遊んでいる途中なら時間・BGM・アニメを止める（タイトルや結果画面でも開ける）
function openPause(){
  if(menuOpen || exchangeOpen) return;
  menuOpen = true;
  document.getElementById("tabTitle").style.display = state === "menu" ? "none" : "";
  renderRecords();
  renderVolOpts();
  selectTab("rec");
  document.getElementById("pauseMenu").classList.remove("hidden");
  document.getElementById("overlay").style.visibility = "hidden";   // 結果画面の文字と重ならないように
  if(isActive()){
    paused = true;
    stopBGM();
    document.querySelector(".screen").classList.add("paused");
  }
  renderPauseBtn();
}
function closePause(){
  if(!menuOpen) return;
  menuOpen = false;
  document.getElementById("pauseMenu").classList.add("hidden");
  document.getElementById("overlay").style.visibility = "";
  if(paused){
    paused = false;
    document.querySelector(".screen").classList.remove("paused");
    last = performance.now(); acc = 0;
    if(state === "playing" || state === "goal") startBGM(false);   // 止めたところから
  }
  renderPauseBtn();
}
function togglePause(){ menuOpen ? closePause() : openPause(); }
function selectTab(name){
  document.querySelectorAll(".pmtab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
  document.querySelectorAll(".pmpane").forEach(p => p.classList.toggle("on", p.dataset.pane === name));
}

// 音量ボタン：スピーカーのドット絵（波の数で音量、無音は×）
function speakerSVG(level){
  // 12×12ドット
  let r = "M1 4h2v4H1z M3 4h1v4H3z M4 3h1v6H4z M5 2h1v8H5z M6 1h1v10H6z";
  if(level === 0){
    r += " M8 4h1v1H8z M11 4h1v1h-1z M9 5h1v1H9z M10 5h1v1h-1z M9 6h2v1H9z M9 7h1v1H9z M10 7h1v1h-1z M8 8h1v1H8z M11 8h1v1h-1z";
  } else {
    if(level >= 1) r += " M8 5h1v2H8z";
    if(level >= 2) r += " M9 3h1v1H9z M10 4h1v4h-1z M9 8h1v1H9z";
    if(level >= 3) r += " M10 1h1v1h-1z M11 2h1v8h-1z M10 10h1v1h-1z";
  }
  return `<svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="${r}"/></svg>`;
}
// 音量タブ：［ミュートのアイコン］［■■■■■□□□□□］［最大のアイコン］。目盛りかアイコンを押して決める
function renderVolOpts(){
  const el = document.getElementById("volOpts");
  let bar = "";
  for(let k = 1; k <= VOL_STEPS; k++) bar += `<button class="volseg${k <= volStep ? " on" : ""}" data-step="${k}" aria-label="音量${k}"></button>`;
  el.innerHTML = `<button class="ctl volopt${volStep === 0 ? " on" : ""}" data-step="0" aria-label="ミュート">${speakerSVG(0)}</button>`
    + `<div class="volbar">${bar}</div>`
    + `<button class="ctl volopt${volStep === VOL_STEPS ? " on" : ""}" data-step="${VOL_STEPS}" aria-label="最大">${speakerSVG(3)}</button>`;
  el.querySelectorAll("button").forEach(b => {
    b.addEventListener("mousedown", e => e.preventDefault());
    b.addEventListener("click", () => setVolume(+b.dataset.step));
  });
}
function setVolume(step){
  volStep = step;
  if(masterGain) masterGain.gain.value = volGain();
  renderVolOpts();
}



// 結果画面が出てすぐは入力を受け付けない（誤爆で即再開しないように）
const RESULT_LOCK_MS = 2000;   // 結果画面は2秒間入力を受け付けない（スクショを撮る間に誤って進まないように）
let inputLockUntil = 0;

function proceed(){
  if(menuOpen || exchangeOpen) return;
  if(performance.now() < inputLockUntil) return;
  if(state === "clear") nextDay();
  else if(state === "gameover"){ goTitle(); inputLockUntil = performance.now() + 400; }   // ゲームオーバー → 必ずタイトルへ（連打で即スタートしないよう少し待つ）
  else if(state === "menu") resetGame();
}

// ジャンプ操作（スペース・画面下のボタン共通）
function pressJump(isRepeat){
  if(recordOpen){ if(!isRepeat) closeRecords(); return; }   // 記録表示中はまず閉じる（ジャンプはしない）
  if(menuOpen) return;   // ポーズ中は何もしない（開け閉めはポーズボタン・Esc・P）
  if(state === "playing" || state === "goal") jump();
  else if(!isRepeat) proceed();   // 押しっぱなしの連打では進まない
}
window.addEventListener("keydown", e=>{
  if(exchangeOpen){
    e.preventDefault();
    if(e.code === "ArrowLeft" || e.code === "KeyA") moveExchange(-1);
    else if(e.code === "ArrowRight" || e.code === "KeyD") moveExchange(1);
    else if(e.code === "Space" && !e.repeat && xCursor) chooseExchange(xCursor);
    return;
  }
  if(e.code === "Space"){
    e.preventDefault();
    pressJump(e.repeat);
  } else if(e.code === "Escape" || e.code === "KeyP"){
    togglePause();
  }
});
// 画面のどこをタップしてもジャンプ（ボタンとメニューの上は除く）
document.querySelector(".screen").addEventListener("pointerdown", e=>{
  if(menuOpen || exchangeOpen || e.target.closest("button, #pauseMenu")) return;
  if(state === "playing" || state === "goal") jump();
  else if(state === "menu" || state === "gameover") proceed();   // ゲームオーバーは画面タップでタイトルへ（クリア画面はボタンかスペースで）
});
document.getElementById("start").addEventListener("click", proceed);

function jump(){
  if(rolling > 0) return;
  if(player.jumping){
    // 空中でもう一度：その場でクルッと1回転しながら少しだけ空中に止まる（1ジャンプ1回）
    if(!player.flipped && (state === "playing" || state === "goal")){
      player.flipped = true;
      player.flip = CONFIG.flipTime;
      player.vy = 0;
      playFlipSE();
    }
    return;
  }
  playJumpSE();
  player.vy = player.jumpPower;
  player.jumping = true;
  updateHUD();
  for(let i=0;i<4;i++){
    particles.push({ x:player.x+4, y:groundY-1, vx:-rand(0,.5), vy:-rand(0,.5), life:18, c:"#a8a296" });
  }
}

}
// ライフが減ったときの「−♡1」
function showDamagePop(){
  popAt("dmgpop", "", "", player.x + 20, player.y - 12);
  document.getElementById("dmgpop").innerHTML = `<span class="dmg"><i class="minus"></i><span class="heart">♥</span><span>1</span></span>`;
}
// ライフが減っていて、エナドリが healDrinks 本以上あれば自動で消費して ♥+1
function tryHeal(afterDamage){
  if(lives >= CONFIG.lives || drinkStock < CONFIG.healDrinks) return false;
  drinkStock -= CONFIG.healDrinks;
  lives++;
  updateHUD();
  // ダメージ直後は「−♡1」を見せてから。まず「缶−5」、それが上がりきるころに「♥+1」
  healPopT = afterDamage ? 27 : 1;
  return true;
}
let healPopT = 0;   // >0：「缶−5」を出すまでのフレーム、<0：「♥+1」を出すまでのフレーム

function faceURL(rows, pal){
  const c = document.createElement("canvas");
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext("2d");
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if(pal[ch]){ g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
  }));
  return c.toDataURL();
}
// ブースト中の女の子の顔：20×20ドットで、オレンジの顔＋十字に光る目＋上に「BOOST」
const MINI_FONT = {   // 3×5 の小さい文字
  B:["110","101","110","101","110"], O:["010","101","101","101","010"],
  S:["011","100","010","001","110"], T:["111","010","010","010","010"],
};
function boostFaceURL(frame){
  const c = document.createElement("canvas");
  c.width = 20; c.height = 20;
  const g = c.getContext("2d");
  const pal = GIRL_PAL_BOOST;
  FACE_GIRL.forEach((row, y) => [...row].forEach((ch, x) => {
    let col = pal[ch];
    if(y === 4 && (x === 2 || x === 7)) col = pal.S;   // 目はあとで十字の光にする
    if(col){ g.fillStyle = col; g.fillRect(x * 2, y * 2, 2, 2); }
  }));
  // 目：十字に光る（2コマで大きさが変わってキラキラ）
  const arm = frame ? 3 : 2;
  [[4, 8], [14, 8]].forEach(([ex, ey]) => {
    g.fillStyle = frame ? "#ffffff" : "#fff4a0";
    g.fillRect(ex - arm, ey, 2 + arm * 2, 2);
    g.fillRect(ex, ey - arm, 2, 2 + arm * 2);
    g.fillStyle = "#ffffff";
    g.fillRect(ex, ey, 2, 2);
  });
  // 上側に「BOOST」（影つき）
  [..."BOOST"].forEach((ch, i) => {
    MINI_FONT[ch].forEach((r, yy) => [...r].forEach((b, xx) => {
      if(b !== "1") return;
      const x = i * 4 + xx, y = 1 + yy;
      g.fillStyle = "#5a1808"; g.fillRect(x + 1, y + 1, 1, 1);
    }));
  });
  [..."BOOST"].forEach((ch, i) => {
    MINI_FONT[ch].forEach((r, yy) => [...r].forEach((b, xx) => {
      if(b === "1"){ g.fillStyle = "#f8d030"; g.fillRect(i * 4 + xx, 1 + yy, 1, 1); }
    }));
  });
  return c.toDataURL();
}

// R 紐の赤 / T 紐の白い線 / S 銀の金具 / Y,W,D メダルの縁（明・ハイライト・影） / E,G 大メダルの中心（控えめなへこみ）
const MEDAL_PAL = { R:"#e03030", T:"#ffffff", S:"#d0d0dc", Y:"#f8d030", W:"#fff0a8", D:"#d09828", E:"#d8a828", G:"#ecc030", O:"#1c2030" };
function medalSVG(big, cls = "medal"){
  const core = Array.isArray(big) ? big : (big ? MEDAL_L : MEDAL_S), h = core.length + 2, w = core[0].length + 2;
  const at = (x, y) => y >= 0 && y < core.length && x >= 0 && x < core[0].length && core[y][x] !== ".";
  let r = "";
  for(let y = -1; y <= core.length; y++) for(let x = -1; x <= core[0].length; x++){
    let c = null;
    if(at(x, y)) c = MEDAL_PAL[core[y][x]];
    else if(at(x-1, y) || at(x+1, y) || at(x, y-1) || at(x, y+1)) c = MEDAL_PAL.O;
    if(c) r += `<rect x="${x+1}" y="${y+1}" width="1" height="1" fill="${c}"/>`;
  }
  const size = cls === "medal" ? ` style="width:calc(var(--dot) * ${w});height:calc(var(--dot) * ${h})"` : "";
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}"${size} shape-rendering="crispEdges">${r}</svg>`;
}

// ライフの右：エナドリのストック（starDrinks 本で無敵）
function canIcon(full){
  // ゲーム中の缶スプライト（CAN）をそのまま 1ドット＝1px で描く＋右下に影。空は中身を灰色1色に
  const sh = "#1c2030", gray = "#6a6c74";
  let shadow = "", body = "";
  CAN.forEach((row, y) => [...row].forEach((ch, x) => {
    if(ch === ".") return;
    shadow += `<rect x="${x+1}" y="${y+1}" width="1" height="1" fill="${sh}"/>`;
    const c = ch === "O" ? CAN_PAL.O : (full ? CAN_PAL[ch] : gray);
    body += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`;
  }));
  shadow = "";   // 影なし
  const w = CAN[0].length, h = CAN.length;
  return `<svg class="can" viewBox="0 0 ${w} ${h}" style="width:calc(var(--dot) * ${w});height:calc(var(--dot) * ${h})" shape-rendering="crispEdges">${shadow}${body}</svg>`;
}

// 当たり判定は見た目より内側（かんたん目）
// 女の子の当たり判定。自転車のときは自転車の大きさ
function playerBox(p = player){
  if(onBike) return { x:p.x-3, y:p.y-4, w:19, h:p.h+3 };
  return { x:p.x+3, y:p.y+2, w:6, h:p.h-2 };
}
function hitPlayer(p, c){
  const a = playerBox(p);
  const b = { x:c.x+2, y:c.y+2, w:c.w-4, h:c.h-2 };
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function gateScreenX(){ return Math.round(COURSE - worldOffset); }
function doorLeft(){ return gateScreenX() + 9 - Math.round(22 * doorT); }

function spawnFromPlan(){
  const X = W + 10;
  while(planIdx.cats < plan.cats.length && worldOffset >= plan.cats[planIdx.cats].s){
    const c = plan.cats[planIdx.cats];
    const extra = c.sleeping ? 0 : (c.kind === "tabby" ? TABBY_EXTRA : RUN_CAT_EXTRA);
    // 唯一の制約：猫どうしが物理的によけられないほど詰まる時だけ少し待つ
    const arr = (X - player.x) / (speed + extra);
    if(cats.some(k => Math.abs((k.x - player.x) / (speed + (k.isStationary ? 0 : k.extra)) - arr) < 60)) break;
    planIdx.cats++;
    const h = c.sleeping ? 7 : 9;
    cats.push({ x:X, y:groundY - h, w:14, h, type:c.type, kind:c.kind, isStationary:c.sleeping, extra, age:0,
      hopT: irand(0, TABBY_HOP.air + TABBY_HOP.rest - 1) });
  }
  while(planIdx.cans < plan.cans.length && worldOffset >= plan.cans[planIdx.cans].s){
    const c = plan.cans[planIdx.cans++];
    cans.push({ x:X, y:c.y, age:0 });
  }
  while(planIdx.crows < plan.crows.length && worldOffset >= plan.crows[planIdx.crows].s){
    const c = plan.crows[planIdx.crows++];
    crows.push({ x:X, y:CROW_FLY.center, phase:c.phase, age:0 });
  }
  while(planIdx.bananas < plan.bananas.length && worldOffset >= plan.bananas[planIdx.bananas].s){
    planIdx.bananas++;
    bananas.push({ x:X, hit:false });
  }
  while(planIdx.puddles < plan.puddles.length && worldOffset >= plan.puddles[planIdx.puddles].s){
    const p = plan.puddles[planIdx.puddles++];
    puddles.push({ x:X, w:p.w, hit:false });
  }
}

    }
    // 先生に近づいたら
    if(!teacherSaid && !gateClosing && gateScreenX() < W + 12 && player.x + 12 >= gateScreenX() - 16 - 24){
      teacherSaid = true;
      // 今の時刻（7:30 からの経過分）でセリフを変える
      const min = Math.floor((CONFIG.timeLimit * 60 - timeLeft) / 60 / CONFIG.secPerMinute);
      const line = min >= 15 ? "ギリギリだぞ！" : (min >= 10 ? "おはよう" : "きょうははやいな！");
      npcSay("teacher", line, 1e9);   // ゴール後もずっと残す（次の日の始まりで消える）
      if(min < 10 && lives > 0) awardMedal();   // 「きょうははやいな！」でメダル
    }
    if(!passedGate && !gateClosing){
      timeLeft--;
      if(timeLeft <= 0) timeUp();
      if(state === "gameover") return;
    }
  }
  if(gateClosing && doorT < 1) doorT = Math.min(1, doorT + 1/12);   // すぐさま閉まる
  if(blink > 0) blink--;
  if(invulT > 0) invulT--;

  if(state === "playing"){
    // エナドリ効果（空中で切れそうなら着地まで維持）
    if(boostLeft > 0){
      boostLeft--;
      if(boostLeft === 0 && player.jumping) boostLeft = 1;
    }
    if(starT > 0){
      starT--;
      if(starT === 0 && player.jumping) starT = 1;   // 空中では切らさない
      if(starT === 0) updateHUD();
      if(animTick % 3 === 0){
        particles.push({ x:player.x + rand(0, 12), y:player.y + rand(0, 15), vx:-rand(.3, 1.2), vy:-rand(0, .5), life:16, c:["#ffffff","#f8d030","#ff9030"][irand(0,2)] });
      }
    }
    if(rolling > 0){
      rolling--;
      if(rolling === 0 && lives <= 0){ lifeGameOver("banana"); return; }
    }
    // ノーミスで走り続けると永続倍率がじわじわ上がる
    else mul += CONFIG.autoUp * speed / CONFIG.sectionLen;
    setSpeed();
    worldOffset += speed;
    if(worldOffset >= COURSE - CONFIG.gateStopX){
      worldOffset = COURSE - CONFIG.gateStopX;
      state = "goal";
    }
    const sec = Math.floor(worldOffset / CONFIG.sectionLen);
    if(sec > sectionShown && sec < CONFIG.sections){
      sectionShown = sec;
      const left = Math.round((COURSE - sec * CONFIG.sectionLen) / pxPerMeter);
    }
    spawnFromPlan();
  }

  const scroll = state === "playing" ? speed : 0;

  // おじいさんは地面と一緒に流れる（セリフも一緒に動く）
  if(elder){
    elder.x -= scroll * ELDER_FACTOR;   // 奥にいるぶんゆっくり流れる
    // セリフはおじいさんの頭上に固定
    if(elder.x < -16){
      elder = null;
      document.getElementById("elderpop").className = "headpop outline";
    }
  }

  // プレイヤー
  if(active){
    if(player.flip > 0){
      player.flip--;          // 空中クルッ中はその高さで静止
      player.vy = 0;
    } else {
      player.vy += .115;
      player.y += player.vy;
    }
    if(player.y >= groundY - player.h){
      player.y = groundY - player.h;
      player.vy = 0;
      player.jumping = false;
      player.flipped = false;
      player.flip = 0;
    }
  }
  if(state === "goal"){
    // バナナで転がっている途中に正門前まで来た場合も、転がり終わりで判定する（最後のライフならゲームオーバー）
    if(rolling > 0){
      rolling--;
      if(rolling === 0 && lives <= 0){ lifeGameOver("banana"); return; }
    }
    if(lives > 0){   // やられた状態では進まない（ゴールさせない）
      player.x += Math.max(1.2, speed);
      if(!gateClosing && !passedGate && player.x + 6 > gateScreenX() + 3) passedGate = true;
      if(player.x > W + 4) gameClear();
    }
  }
  // 閉まった門扉に激突
  if(active && gateClosing && !passedGate){
    const gx = gateScreenX();
    if(gx < W + 12 && player.x + 9 >= doorLeft()) crash();
  }
  if(state === "crash") updateCrash();

  // 水たまり
  for(let i=puddles.length-1;i>=0;i--){
    const p = puddles[i];
    p.x -= scroll;
    if(active && !p.hit && !player.jumping && rolling === 0 && starT === 0 && playerBox().x + playerBox().w > p.x + 2 && playerBox().x < p.x + p.w - 2){
      stepPuddle(p);
      if(state === "gameover") return;
    }
    if(p.x + p.w < -4) puddles.splice(i,1);
  }

  // バナナの皮
  for(let i=bananas.length-1;i>=0;i--){
    const b = bananas[i];
    b.x -= scroll;
    if(active && !b.hit && !player.jumping && rolling === 0 && starT === 0 && playerBox().x + playerBox().w > b.x + 1 && playerBox().x < b.x + 6){
      slipBanana(b);
    }
    if(b.x < -10) bananas.splice(i,1);
  }

  // エナドリ
  for(let i=cans.length-1;i>=0;i--){
    const can = cans[i];
    can.x -= scroll;
    can.age++;
    const bob = Math.floor(can.age / 16) % 2;
    const px = onBike ? player.x - 4 : player.x + 1, py = onBike ? player.y - 6 : player.y;
    const pw = onBike ? 20 : 10, ph = onBike ? 21 : 15;   // 自転車のときは自転車の大きさで拾う
    if(active && px < can.x + 7 && px + pw > can.x && py < can.y + bob + 9 && py + ph > can.y + bob){
      drinkCan(can);
      cans.splice(i,1);
      continue;
    }
    if(can.x < -12) cans.splice(i,1);
  }

  // カラス（波型に飛んでくる）
  if(active){
    for(let i=crows.length-1;i>=0;i--){
      const c = crows[i];
      c.age++;
      if(c.knock){
        // 傘ではじかれたカラス：勢いよく吹っ飛ぶ
        c.x += c.kvx; c.y += c.kvy; c.kvy += 0.12;
        if(c.x > W + 30 || c.y < -VIEW_OY - LANE - 30 || c.y > H) crows.splice(i, 1);
        continue;
      }
      c.x -= scroll + CROW_FLY.extra;
      c.y = Math.round(CROW_FLY.center + Math.sin(c.phase + c.age * Math.PI * 2 / CROW_FLY.period) * CROW_FLY.amp);
      const a = playerBox();
      const b = { x:c.x+1, y:c.y+3, w:10, h:3 };
      const ov = (p, q) => p.x < q.x+q.w && p.x+p.w > q.x && p.y < q.y+q.h && p.y+p.h > q.y;
      // 傘を持っていれば、傘（宙返り中は回っている体全体）でもカラスを受けて吹っ飛ばす
      let umbHit = false;
      if(umbrella > 0 && rolling === 0){
        if(player.flip > 0) umbHit = ov(flipBox(), b);
        else { const u = umbrellaPos(); umbHit = ov({ x:u.cx, y:u.cy, w:UMB_CANOPY[0].length, h:UMB_CANOPY.length }, b) || ov(a, b); }
      }
      if(!c.hit && invulT === 0 && starT === 0 && umbHit){
        c.hit = true;
        umbrellaBlock();
        knockCrow(c);
      } else if(!c.hit && rolling === 0 && invulT === 0 && starT === 0 && ov(a, b)){
        c.hit = true;
        if(hitBy("crow", "カァー！じゃまだ！")) return;
      }
      if(c.x < -16) crows.splice(i,1);
    }
  }

  // 猫
  if(active){
    for(let i=cats.length-1;i>=0;i--){
      const cat = cats[i];
      cat.age++;
      cat.x -= cat.isStationary ? scroll : scroll + cat.extra;
      if(cat.kind === "tabby"){
        cat.hopT++;
        cat.y = groundY - cat.h - Math.round(tabbyLift(cat.hopT));
      }
      if(!cat.hit && rolling === 0 && invulT === 0 && starT === 0 && hitPlayer(player, cat)){
        cat.hit = true;
        const who = cat.kind === "tabby" ? "tabby" : cat.type;
        const line = who === "tabby" ? "どこみてんの！" : who === "white" ? "ふまないでよ！" : "……いたいんだけど";
        if(hitBy(who, line)) return;
      }
      if(cat.x < -20) cats.splice(i,1);
    }
  }

  updateParticles();
  updateGhosts();
  updateFlyUmbs();
  // クリアのリザルトを2秒見せてから、交換できるなら交換画面（リザルト中1回だけ）
  if(state === "clear" && !exchangeDone && !menuOpen && ++resultT === 120 && canExchange()) openExchange();
  updateConfetti();
  updateFireworks();
  updateHealPop();
  if(active) updateHUD();
  renderHurry();
}

function drinkCan(can){
  boostLeft = CONFIG.drinkTime; drinks++;
  if(starT === 0){
    drinkStock = Math.min(CONFIG.maxDrinks, drinkStock + 1);
    tryHeal();
    if(lives >= CONFIG.lives && drinkStock >= CONFIG.starDrinks){
      // ライフ満タンで10本：無敵タイム（キラキラ点滅しながらトップスピード）
      drinkStock = 0;
      starT = CONFIG.starTime;
    }
    updateHUD();
  }
  setSpeed();
  for(let i=0;i<10;i++){
    particles.push({ x:can.x+3, y:can.y+4, vx:(Math.random()-.5)*1.6, vy:-rand(0,1.4), life:26, c:i%2 ? "#f8d030" : "#ffffff" });
  }
}

// ===== 傘 =====
const UMB_CANOPY = [   // 赤い傘（横21ドット）。ドットの曲線：外側は下から2段ずつ縦→1段ずつ→上で横に開く。ふちの線は使わず、上のふちと骨をハイライトで
  "..........M..........",
  ".......WPPPPPP.......",
  ".....WWPWPPPWPPP.....",
  "....WPPWPPPPPWPPP....",
  "...WPPWPPPPPPPWPPP...",
  "..PPPPWPPPPPPPWPPPP..",
  "..PPPWPPPPPPPPPWPPP..",
  ".PPPPWPPPPPPPPPWPPPP.",
  ".PPPPWPPPPPPPPPWPPPP.",
  ".P...P....P....P...P.",
];
const UMB_PAL = { P:"#e03030", p:"#9c1c1c", W:"#f26a6a", M:"#d0d0dc", H:"#5a3a28" };
const UMB_SHAFT = "#c8c8d4";   // 棒は銀色、手で持つところ（取っ手）は茶色
// 傘を持っている位置（キャンバス座標）：キャノピーの左上と、持ち手の下端
function umbrellaPos(){
  const x = Math.round(player.x), y = Math.round(player.y);
  if(onBike) return { cx:x - 3, cy:y - 18, hx:x + 7, hy:y + 1 };
  return { cx:x - 2, cy:y - 12, hx:x + 8, hy:y + 7 };
}
// 宙返り用：女の子（または自転車）と傘をひとつの絵にまとめて、90°ずつ回したもの
// 傘の色は女の子・自転車の色記号とぶつからないよう U,V,Z,Y,X に置きかえる
const UMB_FLIP_PAL = { U:"#e03030", V:"#f26a6a", Z:"#d0d0dc", Y:"#c8c8d4", X:"#5a3a28" };
const _flipCache = {};
function flipComposite(withBike){
  const key = withBike ? "b" : "g";
  if(_flipCache[key]) return _flipCache[key];
  const base = withBike ? { rows:BIKE_FRAMES[0], ox:-5, oy:-6 } : { rows:GIRL_FULL, ox:0, oy:0 };
  const u = withBike ? { cx:-3, cy:-18, hx:7, hy:1 } : { cx:-2, cy:-12, hx:8, hy:7 };
  const pivot = withBike ? { x:7, y:4 } : { x:6, y:8 };
  const cw = UMB_CANOPY[0].length, ch = UMB_CANOPY.length;
  const minX = Math.min(base.ox, u.cx), maxX = Math.max(base.ox + base.rows[0].length - 1, u.cx + cw - 1);
  const minY = Math.min(base.oy, u.cy), maxY = Math.max(base.oy + base.rows.length - 1, u.hy);
  const W2 = maxX - minX + 1, H2 = maxY - minY + 1;
  const g = []; for(let y=0;y<H2;y++) g.push(new Array(W2).fill("."));
  const put = (x, y, c) => { if(c !== ".") g[y - minY][x - minX] = c; };
  base.rows.forEach((r, y) => [...r].forEach((c, x) => put(base.ox + x, base.oy + y, c)));
  for(let y = u.cy + ch - 1; y <= u.hy; y++) put(u.hx, y, y >= u.hy - 2 ? "X" : "Y");
  const map = { P:"U", W:"V", M:"Z" };
  UMB_CANOPY.forEach((r, y) => [...r].forEach((c, x) => { if(c !== ".") put(u.cx + x, u.cy + y, map[c] || c); }));
  let rows = g.map(r => r.join("")), p = { x:pivot.x - minX, y:pivot.y - minY };
  const out = [];
  for(let k=0;k<4;k++){
    out.push({ rows, dx:pivot.x - p.x, dy:pivot.y - p.y });
    const h = rows.length;
    rows = rotate90(rows);
    p = { x:h - 1 - p.y, y:p.x };   // 時計回りに90°回したときの回転の中心
  }
  return (_flipCache[key] = out);
}
function flipFrameIndex(){ return Math.min(3, Math.floor((CONFIG.flipTime - player.flip) / (CONFIG.flipTime / 4))); }
// 宙返り中（傘あり）のカラス用の当たり判定：回っている絵全体
function flipBox(){
  const fr = flipComposite(onBike)[flipFrameIndex()];
  return { x:Math.round(player.x) + fr.dx + 1, y:Math.round(player.y) + fr.dy + 1, w:fr.rows[0].length - 2, h:fr.rows.length - 2 };
}
function drawFlipWithUmbrella(pal){
  const fr = flipComposite(onBike)[flipFrameIndex()];
  drawSprite(fr.rows, Math.round(player.x) + fr.dx, Math.round(player.y) + fr.dy, Object.assign({}, pal, UMB_FLIP_PAL));
}
function drawUmbrellaAt(cx, cy, hx, hy){
  const top = cy + UMB_CANOPY.length;
  ctx.fillStyle = UMB_SHAFT;                    // 棒（銀）
  ctx.fillRect(hx, top - 1, 1, Math.max(0, hy - 2 - (top - 1)));
  ctx.fillStyle = UMB_PAL.H;                    // 取っ手（茶）
  ctx.fillRect(hx, hy - 2, 1, 3);
  drawSprite(UMB_CANOPY, cx, cy, UMB_PAL);
}
function drawHeldUmbrella(){
  if(umbrella <= 0 || rolling > 0 || player.flip > 0 || state === "crash" || state === "clear") return;   // 宙返り中は女の子と一緒に回して描く
  if(blink > 0 && Math.floor(blink / 4) % 2) return;
  const u = umbrellaPos();
  drawUmbrellaAt(u.cx, u.cy, u.hx, u.hy);
}
// 耐久を★で表示（減った★だけチカチカして消える）
function showUmbStars(before, after){
  const el = document.getElementById("umbStars");
  let h = "";
  for(let i = 0; i < before; i++) h += `<span class="${i >= after ? "lose" : ""}">★</span>`;
  el.innerHTML = h;
  const u = umbrellaPos();
  el.style.left = ((u.cx + 10) / W * 100) + "%";
  el.style.top = ((u.cy - 2 + VIEW_OY + LANE) / H * 100) + "%";
  el.className = "umbstars outline"; void el.offsetWidth; el.className = "umbstars outline show";
}
// カラスを傘で防ぐ。防いだら true
function umbrellaBlock(){
  if(umbrella <= 0) return false;
  const before = umbrella;
  umbrella--;
  invulT = 30;
  showUmbStars(before, umbrella);
  if(umbrella === 0){
    // 耐久がなくなった：その場で壊れて消える
    const u = umbrellaPos();
    for(let i=0;i<18;i++) particles.push({ x:u.cx + rand(0, 21), y:u.cy + rand(0, 9), vx:rand(-1.2, 1.2), vy:-rand(.2, 1.4), life:30, c:[UMB_PAL.P, UMB_PAL.p, UMB_PAL.W][i % 3] });
    girlSay("傘がこわれた！", 90);
  }
  return true;
}
// カラスを吹っ飛ばす：勢いよく飛ばして、パッと光る＋画面が少しゆれる＋「カーッ！」
let shakeT = 0;
function knockCrow(c){
  c.knock = true; c.kvx = 4.2; c.kvy = -3.6;
  const cx = c.x + 6, cy = c.y + 4;
  for(let k=0;k<12;k++){   // 白と黄色の光が放射状に
    const ang = k / 12 * Math.PI * 2;
    particles.push({ x:cx, y:cy, vx:Math.cos(ang) * 2.2, vy:Math.sin(ang) * 2.2, life:12, c:k % 2 ? "#ffffff" : "#f8d030" });
  }
  for(let k=0;k<10;k++) particles.push({ x:cx, y:cy, vx:rand(-1.4, 2.2), vy:-rand(.2, 1.8), life:28, c:k % 2 ? "#202028" : "#585860" });   // 羽
  shakeT = 8;
  playKnockSE();
  npcSay("crow", "カーッ！", 80);
}

// 地上の障害物に当たった：傘を手放して、上にスーッと飛んでいく
function dropUmbrella(){
  if(umbrella <= 0) return;
  const u = umbrellaPos();
  flyUmbs.push({ cx:u.cx, cy:u.cy, hx:u.hx, hy:u.hy, age:0 });
  umbrella = 0;
}
function updateFlyUmbs(){
  for(let i = flyUmbs.length - 1; i >= 0; i--){
    const f = flyUmbs[i];
    f.age++;
    const dy = 1.1, dx = -0.6;
    f.cy -= dy; f.hy -= dy; f.cx += dx; f.hx += dx;
    if(f.cy < -VIEW_OY - LANE - 30) flyUmbs.splice(i, 1);
  }
}
function drawFlyUmbs(){
  flyUmbs.forEach(f => drawUmbrellaAt(Math.round(f.cx), Math.round(f.cy), Math.round(f.hx), Math.round(f.hy)));
}

// 自転車がダメージを1回肩代わりして壊れる。肩代わりしたら true
function bikeAbsorb(){
  if(!onBike) return false;
  onBike = false;
  invulT = 60;
  setSpeed();
  playDamageSE();
  girlSay("自転車がこわれた！", 90);
  const cols = ["#38a0c8", "#24769c", "#b0b0bc", "#202028", "#c4c4ce"];
  for(let i=0;i<16;i++){
    particles.push({ x:player.x + rand(-4, 16), y:player.y + rand(4, 14), vx:rand(-1.4, 1.4), vy:-rand(.6, 1.8), life:34, c:cols[i % cols.length] });
  }
  updateHUD();
  return true;
}

// バナナ：ライフは減らない。スピードが落ちて転がる（転がっている間は何にも当たらない）。
// 自転車のときは転ばず、スピードが落ちるだけ（自転車も壊れない）
function slipBanana(b){
  b.hit = true;
  dropUmbrella();
  mul -= CONFIG.bananaDown;
  setSpeed();
  if(!onBike) rolling = CONFIG.rollTime;
  updateHUD();
  playFlipSE();
  showHeadPop("ツルッ！", "down");
  for(let i=0;i<8;i++){
    particles.push({ x:player.x+6, y:groundY-2, vx:(Math.random()-.5)*1.6, vy:-rand(.3,1.2), life:20, c:i%2 ? "#f8d030" : "#ffffff" });
  }
}

function stepPuddle(p){
  p.hit = true;
  dropUmbrella();
  if(bikeAbsorb()) return;
  runT = 0; hurryArmed = true;   // 水たまりで足を取られたのもアクション扱い
  mul -= CONFIG.puddleDown; setSpeed();
  blink = 60;
  lives--;
  tryHeal(true);
  updateHUD();
  playDamageSE();
  showDamagePop();
  showHeadPop("バシャッ！", "down");
  for(let i=0;i<10;i++){
    particles.push({ x:player.x+6, y:groundY-1, vx:(Math.random()-.5)*1.4, vy:-rand(.4,1.4), life:22, c:i%2 ? "#7ea6c4" : "#c4e2f2" });
  }
  if(lives <= 0) lifeGameOver("puddle");
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += .04;
    if(--p.life <= 0) particles.splice(i,1);
  }
}

// ===== 紙吹雪 =====
const CONFETTI_COLORS = ["#f8d030", "#e03030", "#3070e0", "#30c070", "#f870b0", "#ffffff"];
function updateConfetti(){
  if(confettiSpawn > 0){
    confettiSpawn--;
    const n = confettiSpawn > 120 ? 3 : 1;
    for(let i=0;i<n;i++){
      confetti.push({
        x: rand(0, W), y: -2 - VIEW_OY,
        vy: rand(.25, .6), phase: rand(0, 6), amp: rand(.2, .5),
        c: CONFETTI_COLORS[irand(0, CONFETTI_COLORS.length-1)], t:0
      });
    }
  }
  for(let i=confetti.length-1;i>=0;i--){
    const c = confetti[i];
    c.t++;
    c.y += c.vy;
    c.x += Math.sin(c.phase + c.t * .06) * c.amp;
    if(c.y > H + 2) confetti.splice(i,1);
  }
}

// ===== 花火（週クリア） =====
function launchFirework(){
  // 狙った高さ（画面の上半分）でちょうど頂点になる初速で打ち上げる
  const ty = rand(-VIEW_OY + 12, 44), y0 = H + 2;
  fireworks.push({ kind:"rocket", x:rand(30, W - 30), y:y0, vy:-Math.sqrt(2 * .035 * (y0 - ty)),
    c:CONFETTI_COLORS[irand(0, CONFETTI_COLORS.length-2)], t:0 });
  playLaunchSE();
}
function burstFirework(r){
  const n = irand(44, 56), sp = rand(1.5, 1.9);
  const c2 = Math.random() < .5 ? "#ffffff" : r.c;
  for(let i=0;i<n;i++){
    const a = i / n * Math.PI * 2 + rand(-.08, .08), v = sp * rand(.85, 1.05);
    fireworks.push({ kind:"spark", x:r.x, y:r.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      c: i % 3 ? r.c : c2, life:irand(55, 75), t:0 });
  }
  playBurstSE();
}
function updateFireworks(){
  if(fwSpawn > 0){
    fwSpawn--;
    if(--fwNext <= 0){
      launchFirework();
      if(Math.random() < .3) launchFirework();   // たまに2発同時
      fwNext = irand(24, 48);
    }
  }
  for(let i=fireworks.length-1;i>=0;i--){
    const f = fireworks[i];
    f.t++;
    if(f.kind === "rocket"){
      f.y += f.vy; f.vy += .035;
      if(f.t % 2 === 0) fireworks.push({ kind:"spark", x:f.x + rand(-.5, .5), y:f.y + 2, vx:0, vy:.2, c:"#f8d030", life:10, t:0 });
      if(f.vy >= 0){ burstFirework(f); fireworks.splice(i, 1); }
    } else {
      f.x += f.vx; f.y += f.vy; f.vx *= .965; f.vy = f.vy * .965 + .012;
      if(--f.life <= 0) fireworks.splice(i, 1);
    }
  }
}
function drawFireworks(){
  fireworks.forEach(f=>{
    if(f.kind === "spark" && f.life < 18 && f.t % 4 < 2) return;   // 消える前にチカチカ
    ctx.fillStyle = f.c;
    // 火花は 2×2、尾を引く光は 1×1、玉は 2×3
    const big = f.kind === "rocket" || f.vx !== 0;
    ctx.fillRect(Math.round(f.x), Math.round(f.y), big ? 2 : 1, f.kind === "rocket" ? 3 : (big ? 2 : 1));
  });
}

function showResult(title, message, clear){
  document.getElementById("overlay").classList.remove("menu");
  stopBGM();
  // クリア時も先生のセリフを残す（ゲームオーバー時も最後のセリフを残す）
  if(!clear) playGameOverSE();
  document.getElementById("boostLabel").classList.add("hidden");
  const ov = document.getElementById("overlay");
  ov.classList.remove("hidden");
  ov.classList.toggle("clear", !!clear);
  ov.classList.toggle("weekend", !!clear && day >= CONFIG.daysPerWeek);   // 週クリアは大きく
  document.getElementById("title").textContent = title;
  // 週クリアの見出し：画面幅（264ドット）に収まる範囲で最大 40ドット
  document.getElementById("title").style.setProperty("--tsize", Math.min(40, Math.floor(256 / [...title].length)));
  document.getElementById("message").innerHTML = message;
  inputLockUntil = performance.now() + RESULT_LOCK_MS;
  const btn = document.getElementById("start");
  btn.disabled = true;
  setTimeout(() => { btn.disabled = false; }, RESULT_LOCK_MS);
  if(clear){
    document.getElementById("start").textContent = day >= CONFIG.daysPerWeek ? "次の週へ" : "次の日へ";
  } else {
    addRecord(dayIdx(week, day), mul);
    document.getElementById("message").innerHTML = `${weekDayLabel()}、遅刻しちゃった…<br>最高記録：${bestText()}`;
    document.getElementById("start").textContent = "タイトルへ";
  }
}

function crash(){
  state = "crash";
  crashTimer = 0;
  bounced = false;
  player.vx = -1.6;
  player.vy = -2.6;
  player.jumping = true;
  const dx = doorLeft();
  for(let i=0;i<12;i++){
    particles.push({ x:dx, y:player.y + rand(0, 12), vx:-rand(.2, 1.6), vy:-rand(0, 1.4), life:30, c:i%2 ? "#f8d030" : "#ffffff" });
  }
}

function updateCrash(){
  crashTimer++;
  if(player.jumping){
    player.x += player.vx;
    player.vy += .115;
    player.y += player.vy;
    if(player.y >= groundY - player.h && player.vy > 0){
      player.y = groundY - player.h;
      if(!bounced){
        bounced = true;
        player.vy = -1.3;
        player.vx *= .5;
      } else {
        player.vy = 0;
        player.jumping = false;
      }
    }
  }
  if(crashTimer === 100){
    state = "gameover";
    showResult("タイムアップ", "");
  }
}

function gameClear(){
  state = "clear";
  resultT = 0; exchangeDone = false;
  confettiSpawn = 240;
  noteBest(dayIdx(week, day) + 1);   // 次の日まで到達
  playClearMusic();
  const weekEnd = day >= CONFIG.daysPerWeek;
  if(weekEnd){ fwSpawn = 480; fwNext = 1; }   // 週クリア：下から花火を打ち上げる（約8秒）
  showResult(weekEnd ? (week === 1 ? "クリア！" : `第${week}週 クリア！`) : "セーフ！！",
    `${weekDayLabel()}　到着 ${clockText()}<br>最高記録：${bestText()}`, true);
}

// ===== 描画：背景 =====
function layerOffset(layer){
  return Math.round(worldOffset * layer.factor) % layer.period;
}
function eachVisible(layer, fn){
  const off = layerOffset(layer);
  layer.items.forEach(it=>{
    for(let k=0;k<3;k++){
      const sx = it.x - off + k*layer.period;
      if(sx + it.w > -12 && sx < W + 12) fn(it, sx);
    }
  });
}

function drawSky(){
  ctx.fillStyle = PAL.sky;
  ctx.fillRect(0,0,W,H);
}

function drawClouds(){
  ctx.fillStyle = PAL.cloud;
  eachVisible(layers.clouds, (c,x)=>{
    ctx.fillRect(x, c.y+3, c.w, 4);
    ctx.fillRect(x+3, c.y+1, Math.round(c.w*.45), 2);
    ctx.fillRect(x+Math.round(c.w*.4), c.y, Math.round(c.w*.35), 3);
  });
}

function drawHills(){
  const L = layers.hills, off = layerOffset(L);
  ctx.fillStyle = PAL.hill;
  for(let x=0;x<W;x++){
    const h = L.heights[(x + off) % L.period];
    ctx.fillRect(x, h, 1, groundY - h);
  }
}

function drawHouse(x, base, w, wall, roof, wallCol, roofCol){
  const top = base - wall;
  ctx.fillStyle = wallCol;
  ctx.fillRect(x, top, w, wall);
  ctx.fillStyle = roofCol;
  for(let i=0;i<roof;i++){
    const inset = Math.round(i * (w/2 + 2) / roof);
    ctx.fillRect(x - 2 + inset, top - 1 - i, w + 4 - inset*2, 1);
  }
}

function drawFarHouses(){
  eachVisible(layers.farHouses, (h,x)=>{
    drawHouse(x, 90, h.w, h.wall, h.roof, PAL.farHouse, PAL.farHouse);
  });
}

function drawNearHouses(){
  eachVisible(layers.nearHouses, (h,x)=>{
    const base = 88;
    drawHouse(x, base, h.w, h.wall, h.roof, PAL.wall[h.c], PAL.roof[h.c]);
    ctx.fillStyle = PAL.window;
    const top = base - h.wall;
    ctx.fillRect(x+4, top+3, 5, 4);
    ctx.fillRect(x+h.w-9, top+3, 5, 4);
    if(h.wall >= 18) ctx.fillRect(x+4, top+10, 5, 4);
    if(h.tree){
      ctx.fillStyle = PAL.tree;

function drawFront(gx){
  const L = layers.front;
  const off = layerOffset(L);
  const wireEnd = Math.min(W, gx);
  if(wireEnd > 0){
    ctx.fillStyle = PAL.wire;
    ctx.fillRect(0, 38, wireEnd, 1);
    ctx.fillRect(0, 42, wireEnd, 1);
  }
  ctx.fillStyle = PAL.pole;
  for(let k=0;k<4;k++){
    const x = 50 - off + k*L.period;
    if(x < -12 || x > W + 12 || x > gx - 8) continue;
    ctx.fillRect(x, 32, 3, 58);
    ctx.fillRect(x-4, 37, 11, 2);
  }
  const fTop = 84, fBot = groundY;
  ctx.fillStyle = PAL.fence;
  ctx.fillRect(0, fTop, W, fBot - fTop);
  ctx.fillStyle = PAL.fenceLn;
  ctx.fillRect(0, fTop, W, 1);
  ctx.fillRect(0, fTop + 5, W, 1);
  const seamOff = Math.round(worldOffset * L.factor) % 16;
  for(let x = -seamOff; x < W; x += 16){
    ctx.fillRect(x, fTop+1, 1, 4);
    ctx.fillRect(x+8, fTop+6, 1, fBot - fTop - 6);
  }
}

const VERGE_Y = groundY + LANE + 12;   // 走る位置より少し下まで道。植え込みは画面の下にわずかだけ
function drawVerge(){
  eachVisible(layers.verge, (it, x) => {
    if(it.kind === "bed"){
      // レンガの花壇
      ctx.fillStyle = PAL.brick;
      ctx.fillRect(x, VERGE_Y + 1, it.w, 5);

      ctx.fillRect(x, VERGE_Y + 1, it.w, 1);

      ctx.fillStyle = PAL.leaf;
      ctx.fillRect(x + 1, VERGE_Y - 2, it.w - 2, 3);
      it.flowers.forEach(f => {
        ctx.fillStyle = f.c;
        ctx.fillRect(x + f.dx, VERGE_Y - 3 + f.dy, 2, 2);
      });

      ctx.fillRect(x + 1, VERGE_Y + 2, 1, 3);
      ctx.fillRect(x + 3, VERGE_Y + 1, 1, 4);
      ctx.fillRect(x + 5, VERGE_Y + 2, 1, 3);
      ctx.fillStyle = it.c;
      ctx.fillRect(x + 1, VERGE_Y + 1, 1, 1);
      ctx.fillRect(x + 3, VERGE_Y, 1, 1);
      ctx.fillRect(x + 5, VERGE_Y + 1, 1, 1);
    }
  });
}

const BIKE_BASE_PAL = { F:"#38a0c8", f:"#24769c", G:"#b0b0bc", H:"#d0d0dc", C:"#c4c4ce", c:"#8c8c98" };
function bikePal(){
  const gp = girlPal();
  return Object.assign({}, BIKE_BASE_PAL, gp, { s: gp === GIRL_PAL ? "#d0a084" : gp.S });
}
// 宙返り用：自転車ごと90°ずつ回した4コマ
const BIKE_ROT = [BIKE_FRAMES[0]];
for(let i=0;i<3;i++) BIKE_ROT.push(rotate90(BIKE_ROT[i]));
function bikeFrame(){
  const moving = state === "playing" || state === "goal";
  return BIKE_FRAMES[moving ? Math.floor(animTick / 5) % 2 : 0];
}

// ===== メダル3つの交換画面 =====
// 自転車・ハートのアイコン（ドット絵を SVG に）
function pixSVG(rows, pal, scale, outline){
  const h = rows.length, w = rows[0].length, o = outline ? 1 : 0;
  let r = "";
  const at = (x, y) => y >= 0 && y < h && x >= 0 && x < w && rows[y][x] !== ".";
  for(let y = -o; y < h + o; y++) for(let x = -o; x < w + o; x++){
    let c = null;
    if(at(x, y)) c = pal[rows[y][x]];
    else if(outline && (at(x-1, y) || at(x+1, y) || at(x, y-1) || at(x, y+1))) c = "#1c2030";
    if(c) r += `<rect x="${x+o}" y="${y+o}" width="1" height="1" fill="${c}"/>`;
  }
  return `<svg viewBox="0 0 ${w+o*2} ${h+o*2}" style="width:calc(var(--dot) * ${(w+o*2)*scale});height:calc(var(--dot) * ${(h+o*2)*scale})" shape-rendering="crispEdges">${r}</svg>`;
}
// 食パン：切っていない1斤をななめから。左が断面、右に側面（上は焼き色）
const BREAD_ICON = [   // 上がふんわりはみ出した、よくある食パンの形
  "..BBBBBBB.LL...",
  ".BCCCCCCCBLLL..",
  "BCCCCCCCCCBLLL.",
  "BCCCCCCCCCBLLL.",
  ".BCCCCCCCBbbbb.",
  ".BCCCCCCCBbbbb.",
  ".BCCCCCCCBbbbb.",
  ".BCCCCCCCBbbbb.",
  ".BCCCCCCCBbbbb.",
  ".BBBBBBBBBbbbb.",
];
const UMB_ICON = UMB_CANOPY.concat(["", "", "", "", "", "", "", ""].map((_, k) => {
  // 棒（銀）→ 取っ手（茶）→ 曲がった持ち手
  const row = [...".".repeat(UMB_CANOPY[0].length)];
  if(k < 5) row[10] = "S"; else if(k < 7) row[10] = "H";
  if(k === 6) row[8] = "H";
  if(k === 7){ row[9] = "H"; }
  if(k === 5) row[7] = ".";
  return row.join("");
}));
const bikeIconSVG  = () => pixSVG(BIKE_FRAMES[0], Object.assign({}, BIKE_BASE_PAL, GIRL_PAL, { s:"#d0a084" }), 2, false);
const umbIconSVG   = () => pixSVG(UMB_ICON, Object.assign({ S:UMB_SHAFT }, UMB_PAL), 2, false);   // アイコンは全部 2倍（ドットの大きさをそろえる）
const breadIconSVG = () => pixSVG(BREAD_ICON, { B:"#c8823c", b:"#a0602c", L:"#dea050", C:"#fff0c8" }, 2, false);   // 縁取りなし（ほかの絵と同じ）
// 交換できるもの（左から）
const XITEMS = [
  { id:"bike",  ok:() => !onBike,               icon:() => bikeIconSVG(), got:"自転車をもらった！" },
  { id:"umb",   ok:() => umbrella <= 0,          icon:() => umbIconSVG(),  got:"傘をもらった！" },
  { id:"bread", ok:() => lives < CONFIG.lives,   icon:() => `<span class="hp"><b>♡</b>+1</span>` + breadIconSVG(), got:"食パンをもらった！" },
  { id:"skip",  ok:() => true,                   icon:() => `<span>こうかん<br>しない</span>`, got:"" },
];
let exchangeOpen = false, exchangeChosen = false, exchangeDone = false, xCursor = null, resultT = 0;
function canExchange(){ return exchangeCredits > 0 && XITEMS.some(it => it.id !== "skip" && it.ok()); }
function xBox(id){ return document.querySelector(`.xbox[data-x="${id}"]`); }
function openExchange(){
  exchangeOpen = true; exchangeChosen = false; exchangeDone = true; xCursor = null;
  XITEMS.forEach(it => { xBox(it.id).innerHTML = it.icon(); });
  document.getElementById("xGot").textContent = "";
  document.getElementById("xPop").className = "xpop";
  document.getElementById("xPop").innerHTML = "";
  renderExchange();
  document.getElementById("xchg").classList.remove("hidden");
}
function renderExchange(){
  XITEMS.forEach(it => {
    xBox(it.id).classList.toggle("off", !it.ok());
    xBox(it.id).classList.toggle("sel", xCursor === it.id);
  });
}
function moveExchange(dir){
  if(!exchangeOpen || exchangeChosen) return;
  const en = XITEMS.filter(it => it.ok()).map(it => it.id);
  if(!en.length) return;
  let k = en.indexOf(xCursor);
  if(k < 0) k = dir > 0 ? 0 : en.length - 1;   // 最初の一押しで、押した側の端に
  else k = Math.max(0, Math.min(en.length - 1, k + dir));
  xCursor = en[k]; renderExchange();
}
function chooseExchange(which){
  if(!exchangeOpen || exchangeChosen) return;
  const it = XITEMS.find(t => t.id === which);
  if(!it || !it.ok()) return;
  exchangeChosen = true; xCursor = which; renderExchange();
  if(which === "skip"){ setTimeout(closeExchange, 200); return; }   // 交換しない（交換権はそのまま）
  exchangeCredits--;
  if(which === "bread"){ lives = Math.min(CONFIG.lives, lives + 1); playHealSE(); }
  else if(which === "bike"){ onBike = true; playMedalSE(); }
  else if(which === "umb"){ umbrella = UMBRELLA_HP; playMedalSE(); }
  updateHUD();
  document.getElementById("xGot").textContent = it.got;
  // 選んだ枠からアイコンがポンと出る
  const box = xBox(which).getBoundingClientRect();
  const scr = document.querySelector(".screen").getBoundingClientRect();
  const pop = document.getElementById("xPop");
  pop.innerHTML = it.icon();
  pop.style.left = (box.left + box.width / 2 - scr.left) + "px";
  pop.style.top = (box.top + box.height / 2 - scr.top) + "px";
  pop.className = "xpop"; void pop.offsetWidth; pop.className = "xpop go";
  setTimeout(closeExchange, 1800);
}
function closeExchange(){
  exchangeOpen = false;
  document.getElementById("xchg").classList.add("hidden");
  inputLockUntil = performance.now() + 400;   // リザルトにもどる。進むのはボタン（かSPACE）を押してから
}
document.querySelectorAll(".xbox").forEach(b => {
  b.addEventListener("mousedown", e => e.preventDefault());
  b.addEventListener("click", () => chooseExchange(b.dataset.x));
});

// ===== ブースト中の残像 =====
// いまの女の子の絵（パーツと位置）を返す。残像用
function girlParts(){
  const x = Math.round(player.x), y = Math.round(player.y);
  if(onBike){
    if(player.flip > 0){
      const f = Math.min(3, Math.floor((CONFIG.flipTime - player.flip) / (CONFIG.flipTime / 4)));
      const spr = BIKE_ROT[f];
      return [[spr, x + 7 - Math.floor(spr[0].length/2), y + 4 - Math.floor(spr.length/2)]];
    }
    return [[bikeFrame(), x - 5, y - 6]];
  }
  if(player.flip > 0){
    const f = Math.min(3, Math.floor((CONFIG.flipTime - player.flip) / (CONFIG.flipTime / 4)));
    const spr = GIRL_ROT[f];
    return [[spr, x + 6 - Math.floor(spr[0].length/2), y + 8 - Math.floor(spr.length/2)]];
  }
  if(rolling > 0){
    const f = Math.floor((CONFIG.rollTime - rolling) / 4) % 4;
    const spr = GIRL_ROT[f];
    return [[spr, x + 6 - Math.floor(spr[0].length/2), groundY - spr.length]];
  }
  const legs = (!player.jumping && Math.floor(animTick / 6) % 2) ? GIRL_LEGS_B : GIRL_LEGS_A;
  return [[GIRL_TOP, x, y], [legs, x, y + 12]];
}
let ghosts = [];
const GHOST_LIFE = 14;
function updateGhosts(){
  const live = state === "playing" || state === "goal";
  if(live && (boostLeft > 0 || starT > 0) && animTick % 3 === 0){
    ghosts.push({ parts: girlParts(), pal: onBike ? bikePal() : girlPal(), dx: 0, life: GHOST_LIFE });
  }
  for(let i = ghosts.length - 1; i >= 0; i--){
    const g = ghosts[i];
    g.dx -= 1.6;   // 後ろへ流れていく
    if(--g.life <= 0) ghosts.splice(i, 1);
  }
}
function drawGhosts(){
  ghosts.forEach(g => {
    if(g.bike) g.pal = bikePal();
    ctx.globalAlpha = 0.45 * g.life / GHOST_LIFE;
    g.parts.forEach(([spr, x, y]) => drawSprite(spr, Math.round(x + g.dx), y, g.pal));
  });
  ctx.globalAlpha = 1;
}

function drawPlayer(){
  if(state === "clear") return;
  const x = Math.round(player.x);
  const y = Math.round(player.y);

  if(state === "crash"){
    // 吹っ飛んでひっくり返る
    drawSprite(GIRL_LEGS_A, x, y, GIRL_PAL, true);
    drawSprite(GIRL_TOP, x, y + 3, GIRL_PAL, true);
    return;
  }

  if(onBike){
    // 自転車に乗っている
    if(blink > 0 && Math.floor(blink / 4) % 2) return;
    if(player.flip > 0 && umbrella > 0){ drawFlipWithUmbrella(bikePal()); return; }   // 自転車＋傘ごと回る
    if(player.flip > 0){
      // 空中クルッ：自転車ごと前回り1回転（中心は自転車の真ん中）
      const f = Math.min(3, Math.floor((CONFIG.flipTime - player.flip) / (CONFIG.flipTime / 4)));
      const spr = BIKE_ROT[f], w = spr[0].length, h = spr.length;
      drawSprite(spr, x + 7 - Math.floor(w/2), y + 4 - Math.floor(h/2), bikePal());
      return;
    }
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.fillRect(x - 1, groundY, player.jumping ? 14 : 20, 1);
    drawSprite(bikeFrame(), x - 5, y - 6, bikePal());
    return;
  }

  if(player.flip > 0 && umbrella > 0){ drawFlipWithUmbrella(girlPal()); return; }   // 傘ごと回る
  if(player.flip > 0){
    // 空中クルッ（前回り1回転）
    const f = Math.min(3, Math.floor((CONFIG.flipTime - player.flip) / (CONFIG.flipTime / 4)));
    const spr = GIRL_ROT[f];
    const w = spr[0].length, h = spr.length;
    drawSprite(spr, x + 6 - Math.floor(w/2), y + 8 - Math.floor(h/2), girlPal());
    return;
  }

  if(rolling > 0){
    // 体ごと転がる（90°ずつ回転）
    const f = Math.floor((CONFIG.rollTime - rolling) / 4) % 4;
    const spr = GIRL_ROT[f];
    const w = spr[0].length, h = spr.length;
    drawSprite(spr, x + 6 - Math.floor(w/2), groundY - h, girlPal());
    return;
  }

  // 水たまりを踏んだら点滅
  if(blink > 0 && Math.floor(blink / 4) % 2) return;

  ctx.fillStyle = "rgba(0,0,0,.18)";
  const sw = player.jumping ? 6 : 10;
  ctx.fillRect(x + 6 - sw/2, groundY, sw, 1);
  drawSprite(GIRL_TOP, x, y, girlPal());
  let legs = GIRL_LEGS_A;
  const running = state === "playing" || state === "goal";
  if(running && !player.jumping && Math.floor(animTick / 6) % 2) legs = GIRL_LEGS_B;
  drawSprite(legs, x, y + 12, girlPal());
}

function drawBanana(b){
  drawSprite(BANANA, b.x, groundY - 4, BANANA_PAL);
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
  });
}

function drawConfetti(){
  confetti.forEach(c=>{
    ctx.fillStyle = c.c;
    if(Math.floor(c.t / 14) % 2) ctx.fillRect(Math.round(c.x), Math.round(c.y), 2, 1);
    else ctx.fillRect(Math.round(c.x), Math.round(c.y), 1, 2);
  });
}

function draw(){
  const gx = gateScreenX();
  drawSky();
  ctx.save();
  // 吹っ飛ばしたときに画面を少しゆらす
  let sx = 0, sy = 0;
  if(shakeT > 0){ sx = (shakeT % 2 ? 1 : -1); sy = (shakeT % 4 < 2 ? 1 : 0); if(!paused) shakeT--; }
  ctx.translate(sx, VIEW_OY + sy);
  drawClouds();
  drawHills();
  drawFarHouses();
  drawNearHouses();
  drawSchool(gx);
  drawElder();
  drawFront(gx);
  drawRoad();
  ctx.save();
  ctx.translate(0, LANE);   // ここから道の上（手前）のもの
  puddles.forEach(drawPuddle);
  bananas.forEach(drawBanana);
  drawGate(gx);
  drawTeacher(gx);
  cans.forEach(drawCan);
  cats.forEach(drawCat);
  crows.forEach(c => drawSprite(c.knock ? CROW_A : (Math.floor(c.age / 8) % 2 ? CROW_B : CROW_A), Math.round(c.x), Math.round(c.y), CROW_PAL, !!c.knock));   // はじかれたカラスはひっくり返る
  drawGhosts();
  drawPlayer();
  drawHeldUmbrella();
  drawFlyUmbs();
  drawParticles();
  ctx.restore();
  drawFireworks();
  drawConfetti();
  ctx.restore();
}

player = createPlayer();
createTown();

// 固定タイムステップ（60Hz）
const STEP = 1000/60;
let last = performance.now();
let acc = 0;
function loop(now){
  if(paused){
    // ポーズ中は時間を進めない（再開時にまとめて進まないよう、経過時間も捨てる）
    last = now; acc = 0;
    draw();
    requestAnimationFrame(loop);
    return;
  }
  acc += Math.min(100, now - last);
  last = now;
  while(acc >= STEP){
    update();
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
