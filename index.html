*{box-sizing:border-box}
body{
  margin:0;
  background:#141820;
  font-family:"PixelJP",monospace;
  -webkit-font-smoothing:none;
  font-smooth:never;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  color:#f8f8f8;
}
.game-wrap{ position:relative; }
.header{
  padding:4px 8px;
  font-size:16px;
}
.screen{ position:relative; overflow:hidden; }
canvas{
  display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
.heart{ color:#e03838; }
.stock{ display:inline-flex; gap:0; margin-left:calc(var(--dot) * 4); align-items:center; }
.can{ display:block; }
.cangap{ display:block; width:calc(var(--dot) * 3); }

/* 「−♥1」：マイナスは線で描いて高さを中央に、間隔は均等に */
.dmg{ display:inline-flex; align-items:center; gap:.3em; }
.dmg .minus{
  display:inline-block;
  width:.5em;
  height:.14em;
  background:#f8f8f8;
  box-shadow:2px 2px 0 #1c2030, -1px -1px 0 #1c2030, 1px -1px 0 #1c2030, -1px 1px 0 #1c2030;
}
.dmg .neg, .dmg .pos{ display:inline-flex; align-items:center; gap:.15em; }
.dmg .neg{ color:#ff5050; }
.dmg .neg .minus{ background:#ff5050; }
.dmg .pos{ color:#f8d030; }
.dmg .pos .plus::before, .dmg .pos .plus::after{ background:#f8d030; }
.dmg .plus{ position:relative; display:inline-block; width:.62em; height:.62em; }
.dmg .plus::before, .dmg .plus::after{
  content:""; position:absolute; background:#f8f8f8;
  box-shadow:2px 2px 0 #1c2030;
}
.dmg .plus::before{ left:0; top:.24em; width:.62em; height:.14em; }
.dmg .plus::after{ left:.24em; top:0; width:.14em; height:.62em; }
.heart.lost{ color:#5a5c64; }
.meter{
  position:absolute;
  top:50%;
  right:2%;
  transform:translateY(-50%);
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:.2em;
}
.meter .arrow{
  width:1em;
  height:1em;
  fill:#f8f8f8;
  filter:drop-shadow(2px 2px 0 #1c2030) drop-shadow(-1px -1px 0 #1c2030);
}
.daylabel{
  position:absolute;
  top:calc(var(--dot) * 4);
  right:3%;
  white-space:nowrap;
}
/* 画面下：ゲームの情報だけ（ライフ・残り時間・スピード） */
.lifelabel{
  position:absolute;
  top:calc(var(--dot) * 4);
  left:3%;
  white-space:nowrap;
  display:flex;
  align-items:center;   /* ハートとエナドリの高さをそろえる */
}
.hud{
  position:absolute;
  top:calc(var(--dot) * 14);
  right:3%;
  white-space:nowrap;
  letter-spacing:.05em;
}
.hurry{ color:#ff6060; }
.meter .num, .num{ color:#f8d030; }
.outline{
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
}
.msgwin{
  position:absolute;
  top:calc(var(--dot) * 15);   /* ハートの下 */
  left:3%;
  /* 一番長いセリフ（10文字）＋顔アイコンが収まる、ぎりぎりの幅 */
  width:calc(var(--dot) * 118);
  height:calc(var(--dot) * 30);
  box-sizing:border-box;
  display:flex;
  align-items:center;
  gap:calc(var(--dot) * 4);
  padding:0 calc(var(--dot) * 4);
  background:transparent;
  border:var(--dot) solid #f8f8f8;
  /* 枠にも1ドットの影 */
  box-shadow:var(--dot) var(--dot) 0 #1c2030, inset var(--dot) var(--dot) 0 #1c2030;
  color:#f8f8f8;
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
  white-space:nowrap;
}
.msgwin .msg{ text-align:left !important; }
.daybanner{
  position:absolute;
  top:42%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:calc(var(--dot) * 24);
  color:#f8f8f8;
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  text-shadow:calc(var(--dot) * 2) calc(var(--dot) * 2) 0 #1c2030, calc(var(--dot) * -2) 0 0 #1c2030, calc(var(--dot) * 2) 0 0 #1c2030, 0 calc(var(--dot) * -2) 0 #1c2030, 0 calc(var(--dot) * 2) 0 #1c2030;
}
.daybanner.show{ animation:daybanner 1.8s steps(1, end) forwards; }
@keyframes daybanner{
  0%   { opacity:1; }
  85%  { opacity:1; }
  100% { opacity:0; }
}
.screen.paused .daybanner{ animation-play-state:paused !important; }
.hurrypop{
  position:absolute;
  transform:translate(-50%, -100%);
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
}
.hurrypop.hop{ animation:hop 1s steps(10, end) forwards; }
@keyframes hop{
  0%   { opacity:1; transform:translate(-50%, -100%); }
  15%  { opacity:1; transform:translate(-50%, -190%); }
  30%  { opacity:1; transform:translate(-50%, -150%); }
  75%  { opacity:1; transform:translate(-50%, -170%); }
  100% { opacity:0; transform:translate(-50%, -190%); }
}
.msgwin .face{
  width:calc(var(--dot) * 20);
  height:calc(var(--dot) * 20);
  image-rendering:pixelated;
  flex:none;
  background:#d6e2ea;
  box-shadow:var(--dot) var(--dot) 0 #1c2030;
}
.msgwin .msg{ flex:1; min-width:0; text-align:center; overflow:hidden; }
.msgwin .msg.red{ color:#ff6060; }
.speedo{
  position:absolute;
  top:calc(var(--dot) * 24);
  right:3%;
  white-space:nowrap;
  letter-spacing:.08em;
}
.boostlabel{
  position:absolute;
  top:calc(var(--dot) * 34);
  right:3%;
  color:#f8d030;
  white-space:nowrap;
  letter-spacing:.08em;
}
.popup{
  position:absolute;
  top:30%;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
}
.popup.show{ animation:pop 1.8s steps(1,end) forwards; }
@keyframes pop{
  0%   { opacity:1; transform:translate(-50%, 8px); }
  8%   { opacity:1; transform:translate(-50%, 0); }
  85%  { opacity:1; transform:translate(-50%, 0); }
  100% { opacity:0; transform:translate(-50%, 0); }
}
.headpop{
  position:absolute;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%, -100%);
}
.headpop.up{ color:#f8d030; }
.headpop.red{ color:#ff6060; }
.headpop.down{ color:#80c0ff; }
.headpop.talk{ animation:talk 2.4s steps(1,end) forwards; }
@keyframes talk{
  0%   { opacity:1; }
  88%  { opacity:1; }
  100% { opacity:0; }
}
.headpop.show{ animation:headpop 1s steps(6,end) forwards; }
@keyframes headpop{
  0%   { opacity:1; transform:translate(-50%, -100%); }
  80%  { opacity:1; transform:translate(-50%, -180%); }
  100% { opacity:0; transform:translate(-50%, -180%); }
}
.controls{
  position:absolute;
  bottom:calc(var(--dot) * 3);
  left:0; right:0;
  display:flex;
  justify-content:center;
  gap:calc(var(--dot) * 6);
  z-index:7;
}
.ctl{
  background:transparent !important;
  color:#f8f8f8 !important;
  border:var(--dot) solid #f8f8f8 !important;
  box-shadow:var(--dot) var(--dot) 0 #1c2030, inset var(--dot) var(--dot) 0 #1c2030 !important;
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
  font-size:calc(var(--dot) * 8) !important;
  padding:calc(var(--dot) * 2) calc(var(--dot) * 6) !important;
  animation:none !important;
  line-height:1.2;
}
.ctl.vol{
  width:calc(var(--dot) * 16);
  height:calc(var(--dot) * 16);
  padding:0 !important;
  display:flex;
  align-items:center;
  justify-content:center;
}
.ctl.vol svg{
  width:calc(var(--dot) * 12);
  height:calc(var(--dot) * 12);
  fill:#f8f8f8;
  filter:drop-shadow(var(--dot) var(--dot) 0 #1c2030);
}
.ctl:active{ transform:translate(var(--dot), var(--dot)); }
/* 記録（ポーズ中）：半透明の黒の上に上位5件 */
.recpanel{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:calc(var(--dot) * 4);
  color:#f8f8f8;
  z-index:6;   /* 結果画面の文字より手前 */
}
.recpanel .rectitle{ font-size:calc(var(--dot) * 16); }
.recpanel .reclist{ font-size:calc(var(--dot) * 8); line-height:1.6; margin:0; padding:0; list-style:none; text-align:left; }
.recpanel .rechint{ font-size:calc(var(--dot) * 8); color:#c8ccd8; }
.recpanel.hidden{ display:none; }
/* ポーズ中は画面内のアニメーションも止める */
.screen.paused .headpop, .screen.paused .hurrypop, .screen.paused .popup{ animation-play-state:paused !important; }
.help{
  text-align:center;
  margin-top:8px;
  color:#a8b0bc;
  font-size:15px;
}
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
}
.overlay.clear{ background:transparent; }
/* タイトル画面：ウィンドウを使わず、背景の上に文字を直接のせる */
.overlay{ background:transparent !important; pointer-events:none; }
.overlay button{ pointer-events:auto; }
.overlay .card{ background:transparent; border:0; box-shadow:none; width:auto; }
/* 結果画面は左上のセリフウィンドウと重ならないよう少し下げる */
.overlay:not(.menu) .card{ transform:translateY(calc(var(--dot) * 12)); padding:0; }
.overlay:not(.menu) .card h1{ margin-bottom:calc(var(--dot) * 3) !important; }
.overlay .card p{ margin:calc(var(--dot) * 3) 0 calc(var(--dot) * 4) !important; }
.overlay .card p{
  color:#f8f8f8;
  font-size:calc(var(--dot) * 8) !important;
  line-height:1.6;

<script>
// =====================================================
//  低解像度（220×120）で描いて整数倍に拡大 → ドットの大きさが全画面で統一
// =====================================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const W = canvas.width;   // 264（少し引いた画：前方が広く見える）
const H = canvas.height;  // 144
// ゲーム内の座標は高さ120基準のまま。増えた24ドットを上（空）と下（道路）に半分ずつ足す
const VIEW_OY = 24;   // 増えた分はすべて空に（下に別枠のような帯を作らない）
const groundY = 98;

// ===== ゲーム設定（難易度はここで調整） =====
const CONFIG = {
  sectionLen:  640,    // 1区間（=100m）の長さ（ドット）
  sections:    4,      // （表示用の区切り。実際の長さは courseMeters）
  courseMeters: 600,   // 学校までの距離（m）
  baseSpeed:   1.45,   // 初期スピード（ドット/フレーム）
  autoUp:      0.08,   // ノーミスで走っていると 100m ごとに +0.08倍（永続、なめらかに上昇）。1日あたりの伸びは 800m時代と同じ
  drinkBonus:  1.00,   // エナドリ：一定時間 +1.00倍（スピード表示には足さない）
  drinkTime:   150,    // エナドリの効果時間（フレーム、60=1秒）
  puddleDown:  0.20,   // 水たまり1回で −0.20倍（永続）
  minMul:      1.00,   // 下がる下限（×1.0より下げない）
  bananaDown:  0.20,   // バナナ1回で −0.20倍（永続）
  rollTime:    48,     // バナナで転がっている時間（フレーム）
  flipTime:    20,     // 空中クルッ：その高さで止まって1回転する時間（フレーム）
  carrySpeed:  true,   // 次の日にスピード倍率を引き継ぐか（false = 毎朝×1.00から）
  timeLimit:   37.5,   // 1日の制限時間（秒）。ゲーム内時計で 7:30 → 7:55（1.5秒＝1分）
  secPerMinute: 1.5,   // 現実の何秒でゲーム内の1分が進むか
  lateDensity: 2.0,    // コース終盤の障害物密度（序盤を1として）。後半ほど難しく
  maxDrinks:   10,     // エナドリのストック上限（日・週をまたいで持ち越し）
  healDrinks:  5,      // ライフが減っているとき、この本数たまったら自動で消費して ♥+1
  starDrinks:  10,     // ライフ満タンでこの本数たまると無敵タイム（全部消費）
  starTime:    180,    // 無敵タイムの長さ（フレーム）。条件が厳しいのでエナドリの1.2倍
  starBonus:   2.00,   // 無敵タイム中の上乗せ（トップスピード）
  clockStart:  450,    // 7:30（分）
  daysPerWeek: 5,      // 月〜金の5日で1週
  lives:       2,      // ライフ（0でゲームオーバー。日・週をまたいで持ち越し、回復はエナドリで）
  tabbyFrom:   3,      // 茶トラが出はじめる日
  tabbyPerDay: 0.08,   // 出はじめてから1日ごとに増える割合（3日目8%、4日目16%…）
  tabbyMax:    0.3,    // 茶トラの割合の上限
  canInterval: 900,    // エナドリの出現間隔（ドット、固定。640=100m → 約140mごと）
  gateStopX:   150,    // 正門が画面のこの位置に来たらスクロール停止
};
// 日ごとの障害物の数：[1日目の数, 1日ごとの増加]（エリア分割でランダム配置）
// 障害物の数：[第1週1日目の数, 1日ごとの増加, 1週ごとの増加]
// 週が変わるとスピードはリセットされる代わりに、障害物の総数が毎週およそ2つずつ増える
const DAY_COUNTS = {
  // コース 800m → 600m に合わせて、密度が変わらないよう 0.71倍（障害物を置ける区間の長さの比）
  cats:    [3.2, 0.53, 1.07],
  crows:   [1.07, 0.32, 0.36],
  puddles: [1.07, 0.32, 0.36],
  bananas: [1.07, 0.27, 0.36],
};
function countFor(key){
  const [b, incDay, incWeek] = DAY_COUNTS[key];
  return Math.floor(b + incDay * (day - 1) + incWeek * (week - 1));
}
const COURSE = Math.round(CONFIG.courseMeters * CONFIG.sectionLen / 100);
const pxPerMeter = CONFIG.sectionLen / 100;
const RUN_CAT_EXTRA = 0.36;   // 走る猫の追加スピード
const TABBY_EXTRA = 0;        // 茶トラはその場でぴょんぴょん跳ねる（地面と一緒に流れてくる）
// 茶トラのジャンプ（ぴょんぴょん跳ね続ける）
const TABBY_HOP = { v0:3.1, g:0.09, air:69, rest:10 };   // 大きく高く跳ぶ（最高で約53ドット、女の子の頭よりずっと上）
function tabbyLift(t){
  const k = t % (TABBY_HOP.air + TABBY_HOP.rest);
  if(k >= TABBY_HOP.air) return 0;
  return Math.max(0, TABBY_HOP.v0 * k - TABBY_HOP.g / 2 * k * k);
}

// 拡大率を「デバイスピクセル単位の整数」にする（ドット幅が1つ1つズレないように）
let cssH = 600;
function fitScreen(){
  // 画面いっぱいに表示（縦横比は固定なので、どの環境でもUIの比率は同じ）
  const root = document.documentElement.style;
  root.setProperty("--ui", "16px");
  const headerH = document.querySelector(".header").offsetHeight;
  const maxW = window.innerWidth;
  const maxH = window.innerHeight - headerH;
  const scale = Math.min(maxW / W, maxH / H);
  const cssW = Math.floor(W * scale);
  cssH = Math.floor(H * scale);
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  document.getElementById("wrap").style.width = cssW + "px";
  // 1ドットの大きさ（CSS px）。文字は 8ドット＝1文字 で表示してゲームのドットとそろえる
  root.setProperty("--dot", (cssH / H) + "px");
}
window.addEventListener("resize", fitScreen);
fitScreen();


// =====================================================
//  8bit BGM & SE（Web Audio API）
// =====================================================
let audioCtx = null;
let bgmInterval = null;
let isBgmPlaying = false;

// 音階テーブル (Hz)
const N = {
  C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77,
  C6:1046.50, D6:1174.66, E6:1318.51,
  _:0
};

const bgmMelody = [
  // Aメロ：焦りつつ元気なフレーズ
  N.E5, N.G5, N.A5, N.G5,  N.E5, N.D5, N.C4, N.D4,
  N.E5, N.E5, N.D5, N.C4,  N.D5, N._,  N.G4, N._,
  N.E5, N.G5, N.A5, N.G5,  N.C5, N.D5, N.E5, N.D5,
  N.C5, N.A4, N.G4, N.A4,  N.C5, N._,  N._,  N._,
  // Bメロ：コード展開で躍動感
  N.A5, N.A5, N.G5, N.F5,  N.E5, N.F5, N.G5, N.E5,
  N.D5, N.D5, N.C5, N.D5,  N.E5, N.D5, N.C5, N.G4,
  N.A5, N.A5, N.G5, N.F5,  N.E5, N.G5, N.C6, N.B5,
  N.A5, N.G5, N.F5, N.D5,  N.C5, N._,  N._,  N._
];

const bgmBass = [
  N.C3, N._, N.C3, N._,  N.G3, N._, N.G3, N._,
  N.A3, N._, N.A3, N._,  N.F3, N._, N.F3, N._,
  N.C3, N._, N.C3, N._,  N.G3, N._, N.G3, N._,
  N.F3, N._, N.G3, N._,  N.C3, N._, N.C3, N._,
  N.F3, N._, N.F3, N._,  N.C3, N._, N.C3, N._,
  N.G3, N._, N.G3, N._,  N.A3, N._, N.A3, N._,
  N.F3, N._, N.F3, N._,  N.E3, N._, N.A3, N._,
  N.D3, N._, N.G3, N._,  N.C3, N._, N.C3, N._
];

// 音量：最大 → 無音 → 1 → 2 → 最大 の順に切り替え（全部の音がマスター音量を通る）
const VOLUME_LEVELS = [1, 0, 0.35, 0.65];   // 3(最大), 0(無音), 1, 2
let volumeIdx = 0;
let masterGain = null;
function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = VOLUME_LEVELS[volumeIdx];
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
}
function outNode(){ return masterGain || audioCtx.destination; }

function playNote(freq, type, duration, vol=0.08){
  if(!audioCtx || !freq) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(outNode());
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playNoise(duration, vol=0.03){
  if(!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  noise.connect(gain);
  gain.connect(outNode());
  noise.start();
}

let bgmStep = 0;
function startBGM(fromStart = true){
  initAudio();
  stopBGM();
  if(fromStart) bgmStep = 0;
  // 1ステップのミリ秒：通常 120、無敵中は速く
  isBgmPlaying = true;
  let acc = 120, prev = performance.now();
  bgmInterval = setInterval(() => {
    if(!isBgmPlaying) return;
    const now = performance.now();
    acc += Math.min(now - prev, 200); prev = now;
    const fast = starT > 0;
    const tempo = fast ? 75 : 120;
    if(acc < tempo) return;
    acc = Math.min(acc - tempo, tempo);
    const k = tempo / 120;
    const step = bgmStep;
    const mFreq = bgmMelody[step % bgmMelody.length];
    if(mFreq > 0) playNote(mFreq, "square", 0.11 * k, 0.06);      // メロディ（矩形波）
    const bFreq = bgmBass[step % bgmBass.length];
    if(bFreq > 0) playNote(bFreq, "triangle", 0.15 * k, 0.12);    // ベース（三角波）
    if(step % 2 === 0) playNoise(0.03, 0.02);                 // ハイハット
    if(step % 4 === 2) playNoise(0.08 * k, 0.05);             // スネア風
    bgmStep++;
  }, 10);
}

function stopBGM(){
  isBgmPlaying = false;
  if(bgmInterval){
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

// ジャンプ効果音
function playJumpSE(){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(180, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(780, audioCtx.currentTime + 0.12);
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
  osc.connect(gain);
  gain.connect(outNode());
  osc.start();
  osc.stop(audioCtx.currentTime + 0.12);
}

// クリア用ファンファーレ
function playClearMusic(){
  if(!audioCtx) return;
  // [周波数, 再生タイミング(秒), 音長(秒), タイプ]
  const fanfare = [
    [N.C5, 0.00, 0.12, "square"],
    [N.E5, 0.12, 0.12, "square"],
    [N.G5, 0.24, 0.12, "square"],
    [N.C6, 0.36, 0.40, "square"],
    [N.G5, 0.76, 0.12, "square"],
    [N.C6, 0.88, 0.60, "square"],
    // ハーモニー（ベース音）
    [N.C4, 0.00, 0.48, "triangle"],
    [N.G3, 0.36, 0.35, "triangle"],
    [N.C4, 0.76, 0.70, "triangle"],
  ];
  fanfare.forEach(([freq, delay, dur, type]) => {
    setTimeout(() => playNote(freq, type, dur, 0.12), delay * 1000);
  });
}

// ダメージ音（ファミコンっぽい「ビビッ」＋ノイズ）
function playDamageSE(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  // 高低を細かく行き来させながら下がっていく
  const steps = [620, 310, 560, 280, 480, 240, 400, 200];
  steps.forEach((f, i) => osc.frequency.setValueAtTime(f, t + i * 0.03));
  gain.gain.setValueAtTime(0.09, t);
  gain.gain.linearRampToValueAtTime(0.01, t + steps.length * 0.03);
  osc.connect(gain);
  gain.connect(outNode());
  osc.start(t);
  osc.stop(t + steps.length * 0.03);
  playNoise(0.1, 0.06);
}

// 回復音（ドミソド↑のキラッとしたアルペジオ）
function playHealSE(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  [523, 659, 784, 1047, 1319].forEach((f, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(f, t + i * 0.06);
    gain.gain.setValueAtTime(0, t);
    gain.gain.setValueAtTime(0.06, t + i * 0.06);
    gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.14);
    osc.connect(gain); gain.connect(outNode());
    osc.start(t + i * 0.06); osc.stop(t + i * 0.06 + 0.15);
  });
}

// 花火：打ち上げ（ヒュ〜）と破裂（ドン）
function playLaunchSE(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = "triangle";

function fillPeriod(period, makeItem, gapMin, gapMax){
  const items = [];
  let x = irand(0, gapMax);
  while(true){
    const it = makeItem();
    if(x + it.w > period - gapMin) break;
    it.x = x;
    items.push(it);
    x += it.w + irand(gapMin, gapMax);
  }
  return items;
}

// ===== コース配置 =====
// コースを「頭数分のエリア」に分け、各エリアに1つだけ置く。エリア内の位置はランダム。
// s = その物が画面右端に現れるときのスクロール量
function buildCourse(){
  // 正門前の約40mは何も出さない（ゴール演出中に障害物が残らないように）
  const start = 150, end = COURSE - W - 260;
  // エリアに1つずつ、エリア内の位置は完全ランダム（種類をまたいだ調整はしない）
  // 後半ほど密に：密度がコース頭→終わりで 1 → CONFIG.lateDensity 倍に直線的に上がるようにエリアを切る
  // （後半はスピードも上がっているので、同じ間隔だと時間あたりの密度が薄く感じる）
  const rd = CONFIG.lateDensity, tot = 1 + (rd - 1) / 2;
  const edge = q => {   // 累積密度が q（0〜1）になる位置（0〜1）
    if(rd === 1) return q;
    const a = (rd - 1) / 2;   // a x² + x = q*tot を解く
    return (-1 + Math.sqrt(1 + 4 * a * q * tot)) / (2 * a);
  };
  const scatter = (n, make)=>{
    const out = [], N = Math.max(1, n);
    for(let i=0;i<n;i++){
      const a = edge(i / N), b = edge((i + 1) / N);
      out.push(Object.assign({ s: start + (a + Math.random() * (b - a)) * (end - start) }, make()));
    }
    return out;
  };

  // エナドリ：固定の一定間隔（高さはランダム）
  const cans = [];
  // 1日目（やり直し直後）は遅さがつらいので、すぐにエナドリを置く
  for(let s = start + CONFIG.canInterval / 2; s < end; s += CONFIG.canInterval){
    cans.push({ s, y: irand(56, 68) });
  }
  const n = dayIdx(week, day) + 1;   // 通しで何日目か（茶トラは第1週3日目から）
  const tabbyRate = n < CONFIG.tabbyFrom ? 0 : Math.min(CONFIG.tabbyMax, CONFIG.tabbyPerDay * (n - CONFIG.tabbyFrom + 1));
  const makeCat = ()=>{
    const r = Math.random();
    const kind = r < tabbyRate ? "tabby" : (r < tabbyRate + .2 ? "sleep" : "run");
    return { kind, sleeping: kind === "sleep",
      type: kind === "tabby" ? "tabby" : (kind === "sleep" ? "white" : "black") };   // 白猫＝寝てる、黒猫＝走る
  };
  const cats = scatter(countFor("cats"), makeCat);
  // 序盤の緊張感：最初の約150m（2エリア）に猫を1匹ずつ追加
  const OPEN = 960, openL = OPEN / 2;
  for(let i=0;i<2;i++) cats.push(Object.assign({ s: start + 120 + i*openL + Math.random()*(openL - 60) }, makeCat()));
  cats.sort((a, b) => a.s - b.s);
  const bananas = scatter(countFor("bananas"), ()=>({}));
  const crows = scatter(countFor("crows"), ()=>({ phase: Math.random() * Math.PI * 2 }));
  const puddles = scatter(countFor("puddles"), ()=>({ w:irand(16, 24) }));
  return { cats, cans, puddles, bananas, crows };
}

function speakerSVG(level){
  // 12×12ドット
  let r = "M1 4h2v4H1z M3 4h1v4H3z M4 3h1v6H4z M5 2h1v8H5z M6 1h1v10H6z";
  if(level === 0){
    r += " M8 4h1v1H8z M11 4h1v1h-1z M9 5h1v1H9z M10 5h1v1h-1z M9 6h2v1H9z M9 7h1v1H9z M10 7h1v1h-1z M8 8h1v1H8z M11 8h1v1h-1z";
  } else {
    if(level >= 1) r += " M8 5h1v2H8z";
    if(level >= 2) r += " M9 3h1v1H9z M10 4h1v4h-1z M9 8h1v1H9z";
    if(level >= 3) r += " M10 1h1v1h-1z M11 2h1v8h-1z M10 10h1v1h-1z";
  }
  return `<svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="${r}"/></svg>`;
}

// 結果画面が出てすぐは入力を受け付けない（誤爆で即再開しないように）
const RESULT_LOCK_MS = 2000;   // 結果画面は2秒間入力を受け付けない（スクショを撮る間に誤って進まないように）
let inputLockUntil = 0;

function proceed(){
  if(recordOpen) return;
  if(performance.now() < inputLockUntil) return;
  if(state === "clear") nextDay();
  else if(state === "gameover"){ goTitle(); inputLockUntil = performance.now() + 400; }   // ゲームオーバー → 必ずタイトルへ（連打で即スタートしないよう少し待つ）
  else if(state === "menu") resetGame();
}

// ジャンプ操作（スペース・画面下のボタン共通）
function pressJump(isRepeat){
  if(recordOpen){ if(!isRepeat) closeRecords(); return; }   // 記録表示中はまず閉じる（ジャンプはしない）
  if(state === "playing" || state === "goal") jump();
  else if(!isRepeat) proceed();   // 押しっぱなしの連打では進まない
}
window.addEventListener("keydown", e=>{
  if(e.code === "Space"){
    e.preventDefault();
    pressJump(e.repeat);
  } else if(e.code === "Escape" && recordOpen){
    closeRecords();
  }
});
canvas.addEventListener("pointerdown",()=>{
  if(recordOpen){ closeRecords(); return; }
  if(state === "playing" || state === "goal") jump();
  else if(state === "menu" || state === "gameover") proceed();   // ゲームオーバーは画面タップでタイトルへ（クリア画面はボタンかスペースで）
});
document.getElementById("start").addEventListener("click", proceed);

function jump(){
  if(rolling > 0) return;
  if(player.jumping){
    // 空中でもう一度：その場でクルッと1回転しながら少しだけ空中に止まる（1ジャンプ1回）
    if(!player.flipped && (state === "playing" || state === "goal")){
      player.flipped = true;
      player.flip = CONFIG.flipTime;
      player.vy = 0;
      playFlipSE();
    }
    return;
  }
  playJumpSE();
  player.vy = player.jumpPower;
  player.jumping = true;
  updateHUD();
  for(let i=0;i<4;i++){
    particles.push({ x:player.x+4, y:groundY-1, vx:-rand(0,.5), vy:-rand(0,.5), life:18, c:"#a8a296" });
  }
}

function tryHeal(afterDamage){
  if(lives >= CONFIG.lives || drinkStock < CONFIG.healDrinks) return false;
  drinkStock -= CONFIG.healDrinks;
  lives++;
  updateHUD();
  // ダメージ直後は「−♡1」を見せてから。まず「缶−5」、それが上がりきるころに「♥+1」
  healPopT = afterDamage ? 27 : 1;
  return true;
}

}

function faceURL(rows, pal){
  const c = document.createElement("canvas");
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext("2d");
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if(pal[ch]){ g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
  }));
  return c.toDataURL();
}
let FACES = null;
function faces(){
  if(!FACES) FACES = {
    girl:    faceURL(FACE_GIRL, GIRL_PAL),
    elder:   faceURL(FACE_ELDER, ELDER_PAL),
    teacher: faceURL(FACE_TEACHER, TEACHER_PAL),
    white:   faceURL(FACE_CAT, CAT_PAL.white),
    black:   faceURL(FACE_CAT, CAT_PAL.black),
    tabby:   faceURL(FACE_TABBY, CAT_PAL.tabby),
    crow:    faceURL(FACE_CROW, CROW_PAL),
  };
  return FACES;
}

// ゲーム内時計：1秒＝1分。7:30 スタート、7:55 閉門
function clockText(elapsedMin){
  if(elapsedMin === undefined) elapsedMin = Math.floor((CONFIG.timeLimit * 60 - timeLeft) / 60 / CONFIG.secPerMinute);
  const t = CONFIG.clockStart + elapsedMin;
  return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;
}
// ライフの右：エナドリのストック（starDrinks 本で無敵）
function canIcon(full){
  // ゲーム中の缶スプライト（CAN）をそのまま 1ドット＝1px で描く＋右下に影。空は中身を灰色1色に
  const sh = "#1c2030", gray = "#6a6c74";
  let shadow = "", body = "";
  CAN.forEach((row, y) => [...row].forEach((ch, x) => {
    if(ch === ".") return;
    shadow += `<rect x="${x+1}" y="${y+1}" width="1" height="1" fill="${sh}"/>`;
    const c = ch === "O" ? CAN_PAL.O : (full ? CAN_PAL[ch] : gray);
    body += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`;
  }));
  shadow = "";   // 影なし
  const w = CAN[0].length, h = CAN.length;
  return `<svg class="can" viewBox="0 0 ${w} ${h}" style="width:calc(var(--dot) * ${w});height:calc(var(--dot) * ${h})" shape-rendering="crispEdges">${shadow}${body}</svg>`;
}
function updateHUD(){
  const hud = document.getElementById("hud");
  const m = Math.max(0, Math.ceil((COURSE - worldOffset - player.x - 6) / pxPerMeter));
  const sec = Math.max(0, Math.ceil(timeLeft / 60));
  if(gateClosing){
    hud.innerHTML = `<span class="hurry">正門が閉まった！</span>`;
  } else {
    const late = CONFIG.timeLimit * 60 - timeLeft >= 15 * CONFIG.secPerMinute * 60;   // 7:45 から赤
    hud.innerHTML = `<span class="${late ? "hurry" : ""}">${clockText()}</span>（閉門まで <span class="num">${clockText(CONFIG.timeLimit / CONFIG.secPerMinute)}</span>）`;
  }
  const meter = document.getElementById("meter");
  document.getElementById("meterNum").textContent = m;
  meter.classList.toggle("hidden", gateScreenX() < W + 20 || !(state === "playing" || state === "goal"));   // 正門が見えたら消す
  let hearts = "";
  for(let i=0;i<CONFIG.lives;i++) hearts += `<span class="${i < lives ? "heart" : "heart lost"}">♥</span>`;
  document.getElementById("dayLabel").innerHTML = (week === 1 ? "" : `第<span class="num">${week}</span>週 `) + `<span class="num">${day}</span>日目`;
  let stock = "";
  for(let i=0;i<CONFIG.maxDrinks;i++){
    if(i === CONFIG.healDrinks) stock += `<i class="cangap"></i>`;   // 5本ずつ区切る
    stock += canIcon(i < drinkStock || starT > 0);
  }
  document.getElementById("lifeLabel").innerHTML = hearts + `<span class="stock">${stock}</span>`;
  document.getElementById("speedo").innerHTML = `SPEED <span class="num">×${mul.toFixed(2)}</span>`;
  document.getElementById("boostLabel").classList.toggle("hidden", !(boostLeft > 0 && (state === "playing" || state === "goal")));
}

// 当たり判定は見た目より内側（かんたん目）
function hitPlayer(p, c){
  const a = { x:p.x+3, y:p.y+2, w:6, h:p.h-2 };
  const b = { x:c.x+2, y:c.y+2, w:c.w-4, h:c.h-2 };
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function gateScreenX(){ return Math.round(COURSE - worldOffset); }
function doorLeft(){ return gateScreenX() + 9 - Math.round(22 * doorT); }

function spawnFromPlan(){
  const X = W + 10;
  while(planIdx.cats < plan.cats.length && worldOffset >= plan.cats[planIdx.cats].s){
    const c = plan.cats[planIdx.cats];
    const extra = c.sleeping ? 0 : (c.kind === "tabby" ? TABBY_EXTRA : RUN_CAT_EXTRA);
    // 唯一の制約：猫どうしが物理的によけられないほど詰まる時だけ少し待つ
    const arr = (X - player.x) / (speed + extra);
    if(cats.some(k => Math.abs((k.x - player.x) / (speed + (k.isStationary ? 0 : k.extra)) - arr) < 60)) break;
    planIdx.cats++;
    const h = c.sleeping ? 7 : 9;
    cats.push({ x:X, y:groundY - h, w:14, h, type:c.type, kind:c.kind, isStationary:c.sleeping, extra, age:0,
      hopT: irand(0, TABBY_HOP.air + TABBY_HOP.rest - 1) });
  }
  while(planIdx.cans < plan.cans.length && worldOffset >= plan.cans[planIdx.cans].s){
    const c = plan.cans[planIdx.cans++];
    cans.push({ x:X, y:c.y, age:0 });
  }
  while(planIdx.crows < plan.crows.length && worldOffset >= plan.crows[planIdx.crows].s){
    const c = plan.crows[planIdx.crows++];
    crows.push({ x:X, y:CROW_FLY.center, phase:c.phase, age:0 });
  }
  while(planIdx.bananas < plan.bananas.length && worldOffset >= plan.bananas[planIdx.bananas].s){
    planIdx.bananas++;
    bananas.push({ x:X, hit:false });
  }
  while(planIdx.puddles < plan.puddles.length && worldOffset >= plan.puddles[planIdx.puddles].s){
    const p = plan.puddles[planIdx.puddles++];
    puddles.push({ x:X, w:p.w, hit:false });
  }
}

function update(){
  const active = state === "playing" || state === "goal";

  if(active){
    animTick++;
    // 朝のひとこと
    if(animTick === 1) girlSay("ねぼうした！", 80);
    if(animTick === 80) girlSay("ちこくしちゃう！", 90);
    updateMessages();
    // おじいさんとのあいさつ
    if(elder){
      // おじいさんは奥の庭にいて流れがゆっくりなので、速く走っていても読める
      // おじいさんが先に声をかけ、女の子が「おはよー！」と返す
      if(elderTalk === 0 && animTick >= ELDER_QUIET_TICK && elder.x - player.x < 80 && elder.x > player.x - 4){
        elderTalk = 1;
        npcSay("elder", "きょうもねぼうかい？", 100);
      } else if(elderTalk >= 1 && elderTalk < 100){
        elderTalk++;
      } else if(elderTalk === 100){
        elderTalk = 1000;
        girlSay("おはよー！", 90);
      }
    }
    // 先生に近づいたら
    if(!teacherSaid && !gateClosing && gateScreenX() < W + 12 && player.x + 12 >= gateScreenX() - 16 - 24){
      teacherSaid = true;
      // 今の時刻（7:30 からの経過分）でセリフを変える
      const min = Math.floor((CONFIG.timeLimit * 60 - timeLeft) / 60 / CONFIG.secPerMinute);
      const line = min >= 15 ? "ギリギリだぞ！" : (min >= 10 ? "おはよう" : "きょうははやいな！");
      npcSay("teacher", line, 150);
    }
    if(!passedGate && !gateClosing){
      timeLeft--;
      if(timeLeft <= 0) timeUp();
      if(state === "gameover") return;
    }
  }
  if(gateClosing && doorT < 1) doorT = Math.min(1, doorT + 1/12);   // すぐさま閉まる
  if(blink > 0) blink--;
  if(invulT > 0) invulT--;

  if(state === "playing"){
    // エナドリ効果（空中で切れそうなら着地まで維持）
    if(boostLeft > 0){
      boostLeft--;
      if(boostLeft === 0 && player.jumping) boostLeft = 1;
    }
    if(starT > 0){
      starT--;
      if(starT === 0 && player.jumping) starT = 1;   // 空中では切らさない
      if(starT === 0) updateHUD();
      if(animTick % 3 === 0){
        particles.push({ x:player.x + rand(0, 12), y:player.y + rand(0, 15), vx:-rand(.3, 1.2), vy:-rand(0, .5), life:16, c:["#ffffff","#f8d030","#ff9030"][irand(0,2)] });
      }
    }
    if(rolling > 0){
      rolling--;
      if(rolling === 0 && lives <= 0){ lifeGameOver("banana"); return; }
    }
    // ノーミスで走り続けると永続倍率がじわじわ上がる
    else mul += CONFIG.autoUp * speed / CONFIG.sectionLen;
    setSpeed();
    worldOffset += speed;
    if(worldOffset >= COURSE - CONFIG.gateStopX){
      worldOffset = COURSE - CONFIG.gateStopX;
      state = "goal";
    }
    const sec = Math.floor(worldOffset / CONFIG.sectionLen);
    if(sec > sectionShown && sec < CONFIG.sections){
      sectionShown = sec;
      const left = Math.round((COURSE - sec * CONFIG.sectionLen) / pxPerMeter);
    }
    spawnFromPlan();
  }

  const scroll = state === "playing" ? speed : 0;

  // おじいさんは地面と一緒に流れる（セリフも一緒に動く）
  if(elder){
    elder.x -= scroll * ELDER_FACTOR;   // 奥にいるぶんゆっくり流れる
    // セリフはおじいさんの頭上に固定
    if(elder.x < -16){
      elder = null;
      document.getElementById("elderpop").className = "headpop outline";
    }
  }

  // プレイヤー
  if(active){
    if(player.flip > 0){
      player.flip--;          // 空中クルッ中はその高さで静止
      player.vy = 0;
    } else {
      player.vy += .115;
      player.y += player.vy;
    }
    if(player.y >= groundY - player.h){
      player.y = groundY - player.h;
      player.vy = 0;
      player.jumping = false;
      player.flipped = false;
      player.flip = 0;
    }
  }
  if(state === "goal"){
    // バナナで転がっている途中に正門前まで来た場合も、転がり終わりで判定する（最後のライフならゲームオーバー）
    if(rolling > 0){
      rolling--;
      if(rolling === 0 && lives <= 0){ lifeGameOver("banana"); return; }
    }
    if(lives > 0){   // やられた状態では進まない（ゴールさせない）
      player.x += Math.max(1.2, speed);
      if(!gateClosing && !passedGate && player.x + 6 > gateScreenX() + 3) passedGate = true;
      if(player.x > W + 4) gameClear();
    }
  }
  // 閉まった門扉に激突
  if(active && gateClosing && !passedGate){
    const gx = gateScreenX();
    if(gx < W + 12 && player.x + 9 >= doorLeft()) crash();
  }
  if(state === "crash") updateCrash();

  // 水たまり
  for(let i=puddles.length-1;i>=0;i--){
    const p = puddles[i];
    p.x -= scroll;
    if(active && !p.hit && !player.jumping && rolling === 0 && starT === 0 && player.x + 9 > p.x + 2 && player.x + 3 < p.x + p.w - 2){
      stepPuddle(p);
      if(state === "gameover") return;
    }
    if(p.x + p.w < -4) puddles.splice(i,1);
  }

  // バナナの皮
  for(let i=bananas.length-1;i>=0;i--){
    const b = bananas[i];
    b.x -= scroll;
    if(active && !b.hit && !player.jumping && rolling === 0 && starT === 0 && player.x + 9 > b.x + 1 && player.x + 3 < b.x + 6){
      slipBanana(b);
    }
    if(b.x < -10) bananas.splice(i,1);
  }

  // エナドリ
  for(let i=cans.length-1;i>=0;i--){
    const can = cans[i];
    can.x -= scroll;
    can.age++;
    const bob = Math.floor(can.age / 16) % 2;
    const px = player.x + 1, py = player.y;
    if(active && px < can.x + 7 && px + 10 > can.x && py < can.y + bob + 9 && py + 15 > can.y + bob){
      drinkCan(can);
      cans.splice(i,1);
      continue;
    }
    if(can.x < -12) cans.splice(i,1);
  }

  // カラス（波型に飛んでくる）
  if(active){
    for(let i=crows.length-1;i>=0;i--){
      const c = crows[i];
      c.age++;
      c.x -= scroll + CROW_FLY.extra;
      c.y = Math.round(CROW_FLY.center + Math.sin(c.phase + c.age * Math.PI * 2 / CROW_FLY.period) * CROW_FLY.amp);
      const a = { x:player.x+3, y:player.y+2, w:6, h:player.h-2 };
      const b = { x:c.x+1, y:c.y+3, w:10, h:3 };
      if(!c.hit && invulT === 0 && starT === 0 && a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y){
        c.hit = true;
        if(hitBy("crow", "カァー！じゃまだ！")) return;
      }
      if(c.x < -16) crows.splice(i,1);
    }
  }

  // 猫
  if(active){
    for(let i=cats.length-1;i>=0;i--){
      const cat = cats[i];
      cat.age++;
      cat.x -= cat.isStationary ? scroll : scroll + cat.extra;
      if(cat.kind === "tabby"){
        cat.hopT++;
        cat.y = groundY - cat.h - Math.round(tabbyLift(cat.hopT));
      }
      if(!cat.hit && rolling === 0 && invulT === 0 && starT === 0 && hitPlayer(player, cat)){
        cat.hit = true;
        const who = cat.kind === "tabby" ? "tabby" : cat.type;
        const line = who === "tabby" ? "どこみてんの！" : who === "white" ? "ふまないでよ！" : "……いたいんだけど";
        if(hitBy(who, line)) return;
      }
      if(cat.x < -20) cats.splice(i,1);
    }
  }

  updateParticles();
  updateConfetti();
  updateFireworks();
  updateHealPop();
  if(active) updateHUD();
  renderHurry();
}

function drinkCan(can){
  boostLeft = CONFIG.drinkTime; drinks++;
  if(starT === 0){
    drinkStock = Math.min(CONFIG.maxDrinks, drinkStock + 1);
    tryHeal();
    if(lives >= CONFIG.lives && drinkStock >= CONFIG.starDrinks){
      // ライフ満タンで10本：無敵タイム（キラキラ点滅しながらトップスピード）
      drinkStock = 0;
      starT = CONFIG.starTime;
    }
    updateHUD();
  }
  setSpeed();
  for(let i=0;i<10;i++){
    particles.push({ x:can.x+3, y:can.y+4, vx:(Math.random()-.5)*1.6, vy:-rand(0,1.4), life:26, c:i%2 ? "#f8d030" : "#ffffff" });
  }
}

function slipBanana(b){
  b.hit = true;
  rolling = CONFIG.rollTime;
  mul -= CONFIG.bananaDown;

  lives--;

  showHeadPop("ツルッ！", "down");

function stepPuddle(p){
  p.hit = true;
  runT = 0; hurryArmed = true;   // 水たまりで足を取られたのもアクション扱い
  mul -= CONFIG.puddleDown; setSpeed();

  tryHeal(true);
  updateHUD();

  showDamagePop();
  showHeadPop("バシャッ！", "down");

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += .04;
    if(--p.life <= 0) particles.splice(i,1);
  }
}

// ===== 紙吹雪 =====
const CONFETTI_COLORS = ["#f8d030", "#e03030", "#3070e0", "#30c070", "#f870b0", "#ffffff"];
function updateConfetti(){
  if(confettiSpawn > 0){
    confettiSpawn--;
    const n = confettiSpawn > 120 ? 3 : 1;
    for(let i=0;i<n;i++){
      confetti.push({
        x: rand(0, W), y: -2 - VIEW_OY,
        vy: rand(.25, .6), phase: rand(0, 6), amp: rand(.2, .5),
        c: CONFETTI_COLORS[irand(0, CONFETTI_COLORS.length-1)], t:0
      });
    }
  }
  for(let i=confetti.length-1;i>=0;i--){
    const c = confetti[i];
    c.t++;
    c.y += c.vy;
    c.x += Math.sin(c.phase + c.t * .06) * c.amp;
    if(c.y > H + 2) confetti.splice(i,1);
  }
}

// ===== 花火（週クリア） =====
function launchFirework(){
  // 狙った高さ（画面の上半分）でちょうど頂点になる初速で打ち上げる
  const ty = rand(-VIEW_OY + 12, 44), y0 = H + 2;
  fireworks.push({ kind:"rocket", x:rand(30, W - 30), y:y0, vy:-Math.sqrt(2 * .035 * (y0 - ty)),
    c:CONFETTI_COLORS[irand(0, CONFETTI_COLORS.length-2)], t:0 });
  playLaunchSE();
}
function burstFirework(r){
  const n = irand(44, 56), sp = rand(1.5, 1.9);
  const c2 = Math.random() < .5 ? "#ffffff" : r.c;
  for(let i=0;i<n;i++){
    const a = i / n * Math.PI * 2 + rand(-.08, .08), v = sp * rand(.85, 1.05);
    fireworks.push({ kind:"spark", x:r.x, y:r.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      c: i % 3 ? r.c : c2, life:irand(55, 75), t:0 });
  }
  playBurstSE();
}
function updateFireworks(){
  if(fwSpawn > 0){
    fwSpawn--;
    if(--fwNext <= 0){
      launchFirework();
      if(Math.random() < .3) launchFirework();   // たまに2発同時
      fwNext = irand(24, 48);
    }
  }
  for(let i=fireworks.length-1;i>=0;i--){
    const f = fireworks[i];
    f.t++;
    if(f.kind === "rocket"){
      f.y += f.vy; f.vy += .035;
      if(f.t % 2 === 0) fireworks.push({ kind:"spark", x:f.x + rand(-.5, .5), y:f.y + 2, vx:0, vy:.2, c:"#f8d030", life:10, t:0 });
      if(f.vy >= 0){ burstFirework(f); fireworks.splice(i, 1); }
    } else {
      f.x += f.vx; f.y += f.vy; f.vx *= .965; f.vy = f.vy * .965 + .012;
      if(--f.life <= 0) fireworks.splice(i, 1);
    }
  }
}
function drawFireworks(){
  fireworks.forEach(f=>{
    if(f.kind === "spark" && f.life < 18 && f.t % 4 < 2) return;   // 消える前にチカチカ
    ctx.fillStyle = f.c;
    // 火花は 2×2、尾を引く光は 1×1、玉は 2×3
    const big = f.kind === "rocket" || f.vx !== 0;
    ctx.fillRect(Math.round(f.x), Math.round(f.y), big ? 2 : 1, f.kind === "rocket" ? 3 : (big ? 2 : 1));
  });
}

// ===== 結果 =====
function showResult(title, message, clear){
  document.getElementById("overlay").classList.remove("menu");
  stopBGM();
  if(clear) showMessageWindows(false);   // ゲームオーバー時は最後のセリフを残す
  if(!clear) playGameOverSE();
  document.getElementById("boostLabel").classList.add("hidden");
  const ov = document.getElementById("overlay");
  ov.classList.remove("hidden");
  ov.classList.toggle("clear", !!clear);
  ov.classList.toggle("weekend", !!clear && day >= CONFIG.daysPerWeek);   // 週クリアは大きく
  document.getElementById("title").textContent = title;
  // 週クリアの見出し：画面幅（264ドット）に収まる範囲で最大 40ドット
  document.getElementById("title").style.setProperty("--tsize", Math.min(40, Math.floor(256 / [...title].length)));
  document.getElementById("message").innerHTML = message;
  inputLockUntil = performance.now() + RESULT_LOCK_MS;
  const btn = document.getElementById("start");
  btn.disabled = true;
  setTimeout(() => { btn.disabled = false; }, RESULT_LOCK_MS);
  if(clear){
    document.getElementById("start").textContent = day >= CONFIG.daysPerWeek ? "次の週へ" : "次の日へ";
  } else {
    addRecord(dayIdx(week, day), mul);
    document.getElementById("message").innerHTML = `${weekDayLabel()}、遅刻しちゃった…<br>最高記録：${idxLabel(bestIdx)}`;
    document.getElementById("start").textContent = "タイトルへ";
  }
}

function remainingMeters(){
  return Math.max(0, Math.round((COURSE - worldOffset - player.x) / pxPerMeter));
}

function crash(){
  state = "crash";
  crashTimer = 0;
  bounced = false;
  player.vx = -1.6;
  player.vy = -2.6;
  player.jumping = true;
  const dx = doorLeft();
  for(let i=0;i<12;i++){
    particles.push({ x:dx, y:player.y + rand(0, 12), vx:-rand(.2, 1.6), vy:-rand(0, 1.4), life:30, c:i%2 ? "#f8d030" : "#ffffff" });
  }
}

function updateCrash(){
  crashTimer++;
  if(player.jumping){
    player.x += player.vx;
    player.vy += .115;
    player.y += player.vy;
    if(player.y >= groundY - player.h && player.vy > 0){
      player.y = groundY - player.h;
      if(!bounced){
        bounced = true;
        player.vy = -1.3;
        player.vx *= .5;
      } else {
        player.vy = 0;
        player.jumping = false;
      }
    }
  }
  if(crashTimer === 100){
    state = "gameover";
    showResult("タイムアップ", "");
  }
}

function gameClear(){
  state = "clear";
  confettiSpawn = 240;
  noteBest(dayIdx(week, day) + 1);   // 次の日まで到達
  playClearMusic();
  const weekEnd = day >= CONFIG.daysPerWeek;
  if(weekEnd){ fwSpawn = 480; fwNext = 1; }   // 週クリア：下から花火を打ち上げる（約8秒）
  showResult(weekEnd ? (week === 1 ? "クリア！" : `第${week}週 クリア！`) : "セーフ！！",
    `${weekDayLabel()}　到着 ${clockText()}<br>最高記録：${idxLabel(bestIdx)}`, true);
}

// ===== 描画：背景 =====
function layerOffset(layer){
  return Math.round(worldOffset * layer.factor) % layer.period;
}
function eachVisible(layer, fn){
  const off = layerOffset(layer);
  layer.items.forEach(it=>{
    for(let k=0;k<3;k++){
      const sx = it.x - off + k*layer.period;
      if(sx + it.w > -12 && sx < W + 12) fn(it, sx);
    }
  });
}

function drawSky(){
  ctx.fillStyle = PAL.sky;
  ctx.fillRect(0,0,W,H);
}

function drawClouds(){
  ctx.fillStyle = PAL.cloud;
  eachVisible(layers.clouds, (c,x)=>{
    ctx.fillRect(x, c.y+3, c.w, 4);
    ctx.fillRect(x+3, c.y+1, Math.round(c.w*.45), 2);
    ctx.fillRect(x+Math.round(c.w*.4), c.y, Math.round(c.w*.35), 3);
  });
}

function drawHills(){
  const L = layers.hills, off = layerOffset(L);
  ctx.fillStyle = PAL.hill;
  for(let x=0;x<W;x++){
    const h = L.heights[(x + off) % L.period];
    ctx.fillRect(x, h, 1, groundY - h);
  }
}

function drawHouse(x, base, w, wall, roof, wallCol, roofCol){
  const top = base - wall;
  ctx.fillStyle = wallCol;
  ctx.fillRect(x, top, w, wall);
  ctx.fillStyle = roofCol;
  for(let i=0;i<roof;i++){
    const inset = Math.round(i * (w/2 + 2) / roof);
    ctx.fillRect(x - 2 + inset, top - 1 - i, w + 4 - inset*2, 1);
  }
}

function drawFarHouses(){
  eachVisible(layers.farHouses, (h,x)=>{
    drawHouse(x, 90, h.w, h.wall, h.roof, PAL.farHouse, PAL.farHouse);
  });
}

function drawNearHouses(){
  eachVisible(layers.nearHouses, (h,x)=>{
    const base = 88;
    drawHouse(x, base, h.w, h.wall, h.roof, PAL.wall[h.c], PAL.roof[h.c]);
    ctx.fillStyle = PAL.window;
    const top = base - h.wall;
    ctx.fillRect(x+4, top+3, 5, 4);
    ctx.fillRect(x+h.w-9, top+3, 5, 4);
    if(h.wall >= 18) ctx.fillRect(x+4, top+10, 5, 4);
    if(h.tree){
      ctx.fillStyle = PAL.tree;
      pixelCircle(x + h.w + 3, base - 9, 5);
    }
  });
}

function drawSchool(gx){
  if(gx > W + 10) return;
  const left = gx + 10;
  ctx.fillStyle = PAL.school;
  ctx.fillRect(left, 48, W - left + 200, 42);
  ctx.fillStyle = PAL.schoolLn;
  ctx.fillRect(left, 48, W - left + 200, 2);
  const tx = left + 44;
  ctx.fillStyle = PAL.school;
  ctx.fillRect(tx, 32, 18, 17);
  ctx.fillStyle = PAL.schoolLn;
  ctx.fillRect(tx, 32, 18, 2);
  ctx.fillStyle = "#f8f8f8";
  pixelCircle(tx + 9, 41, 4);
  ctx.fillStyle = "#5a5c64";
  ctx.fillRect(tx + 9, 38, 1, 4);
  ctx.fillRect(tx + 9, 41, 3, 1);
  ctx.fillStyle = PAL.window;
  for(let row=0; row<3; row++){
    for(let x = left + 6; x < W + 10; x += 11){
      ctx.fillRect(x, 54 + row*10, 7, 5);
    }
  }
}

function drawFront(gx){
  const L = layers.front;
  const off = layerOffset(L);
  const wireEnd = Math.min(W, gx);
  if(wireEnd > 0){
    ctx.fillStyle = PAL.wire;
    ctx.fillRect(0, 38, wireEnd, 1);
    ctx.fillRect(0, 42, wireEnd, 1);
  }
  ctx.fillStyle = PAL.pole;
  for(let k=0;k<4;k++){
    const x = 50 - off + k*L.period;
    if(x < -12 || x > W + 12 || x > gx - 8) continue;
    ctx.fillRect(x, 32, 3, 58);
    ctx.fillRect(x-4, 37, 11, 2);
  }
  const fTop = 84, fBot = groundY;
  ctx.fillStyle = PAL.fence;
  ctx.fillRect(0, fTop, W, fBot - fTop);
  ctx.fillStyle = PAL.fenceLn;
  ctx.fillRect(0, fTop, W, 1);
  ctx.fillRect(0, fTop + 5, W, 1);
  const seamOff = Math.round(worldOffset * L.factor) % 16;
  for(let x = -seamOff; x < W; x += 16){
    ctx.fillRect(x, fTop+1, 1, 4);
    ctx.fillRect(x+8, fTop+6, 1, fBot - fTop - 6);
  }
}

function drawRoad(){
  // 足が乗る面（路側帯）は groundY から下。キャラの足元がちょうど上端に乗る
  ctx.fillStyle = PAL.path;
  ctx.fillRect(0, groundY, W, 4);
  ctx.fillStyle = PAL.line;
  ctx.fillRect(0, groundY + 4, W, 1);
  ctx.fillStyle = PAL.road;
  ctx.fillRect(0, groundY + 5, W, 8);
  // 手前の植え込み（芝）。ここに画面下のボタンが重なる
  ctx.fillStyle = PAL.curbFar;
  ctx.fillRect(0, VERGE_Y - 1, W, 1);
  ctx.fillStyle = PAL.verge;
  ctx.fillRect(0, VERGE_Y, W, H - VERGE_Y);
  drawVerge();
}

// 手前をたまに流れていく花壇・野花（さりげなく、まばらに）
const VERGE_Y = groundY + 14;
function drawVerge(){
  eachVisible(layers.verge, (it, x) => {
    if(it.kind === "bed"){
      // レンガの花壇
      ctx.fillStyle = PAL.brick;
      ctx.fillRect(x, VERGE_Y + 1, it.w, 5);
      ctx.fillStyle = PAL.brickHi;
      ctx.fillRect(x, VERGE_Y + 1, it.w, 1);
      for(let bx = x + 3; bx < x + it.w; bx += 6) ctx.fillRect(bx, VERGE_Y + 3, 1, 3);
      // 植わっている草花
      ctx.fillStyle = PAL.leaf;
      ctx.fillRect(x + 1, VERGE_Y - 2, it.w - 2, 3);
      it.flowers.forEach(f => {
        ctx.fillStyle = f.c;
        ctx.fillRect(x + f.dx, VERGE_Y - 3 + f.dy, 2, 2);
      });
    } else {
      // 野花のひとむら
      ctx.fillStyle = PAL.leaf;
      ctx.fillRect(x + 1, VERGE_Y + 2, 1, 3);
      ctx.fillRect(x + 3, VERGE_Y + 1, 1, 4);
      ctx.fillRect(x + 5, VERGE_Y + 2, 1, 3);
      ctx.fillStyle = it.c;
      ctx.fillRect(x + 1, VERGE_Y + 1, 1, 1);
      ctx.fillRect(x + 3, VERGE_Y, 1, 1);
      ctx.fillRect(x + 5, VERGE_Y + 1, 1, 1);
    }
  });
}

function drawPuddle(p){
  const x = Math.round(p.x), w = p.w;
  ctx.fillStyle = PAL.puddle;
  ctx.fillRect(x + 3, groundY, w - 6, 1);
  ctx.fillRect(x, groundY + 1, w, 2);
  ctx.fillRect(x + 2, groundY + 3, w - 4, 1);
  ctx.fillStyle = PAL.puddleHi;
  ctx.fillRect(x + 4, groundY + 1, Math.round(w * .35), 1);
}

  "..GGGGGG....",
  "..GGGGGG....",
  "..PPPPPP....",
];
const ELDER_PAL = { C:"#9a8a66", S:"#e8b890", K:"#2a2030", H:"#ececec", G:"#8a9a7a", W:"#f0f0e0", P:"#5c5650", D:"#3a3430" };

// おじいさんは塀の奥（自宅の庭）で庭木を剪定していて、塀から上半身が見えている。
// 奥にいるので、地面よりゆっくり流れる（＝画面に長くいる）
const ELDER_FACTOR = 0.3;    // 手前の家並みと同じ流れ
const ELDER_Y = 70;
const ELDER_QUIET_TICK = 260;   // 朝のひとことの直後はセリフを続けない（この間はあいさつしない）
function drawElder(){
  if(!elder) return;
  const x = Math.round(elder.x);
  if(x < -14 || x > W + 24) return;
  // 庭木（下は塀に隠れる）
  ctx.fillStyle = PAL.tree;
  pixelCircle(x + 21, ELDER_Y + 4, 7);
  ctx.fillRect(x + 16, ELDER_Y + 8, 11, 6);
  // おじいさん
  drawSprite(ELDER, x, ELDER_Y, ELDER_PAL);
  // 剪定ばさみ（チョキチョキ）
  ctx.fillStyle = "#a0a4ac";
  if(Math.floor(animTick / 10) % 2){
    ctx.fillRect(x + 10, ELDER_Y + 7, 4, 1);
  } else {
    ctx.fillRect(x + 10, ELDER_Y + 7, 3, 1);
    ctx.fillRect(x + 13, ELDER_Y + 6, 1, 1);
    ctx.fillRect(x + 13, ELDER_Y + 8, 1, 1);
  }
}

function drawTeacher(gx){
  const x = gx - 16;
  if(x < -14 || x > W + 2) return;
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.fillRect(x + 1, groundY, 10, 1);
  drawSprite(Math.floor(animTick / 18) % 2 ? TEACHER_B : TEACHER_A, x, groundY - 18, TEACHER_PAL);
}

function drawGate(gx){
  if(gx < -30 || gx > W + 30) return;
  ctx.fillStyle = PAL.pillar;
  ctx.fillRect(gx, 64, 8, groundY - 64);
  ctx.fillStyle = PAL.pillarLn;
  ctx.fillRect(gx, 64, 8, 2);
  ctx.fillRect(gx - 1, 62, 10, 2);
  ctx.fillStyle = "#f0ece0";
  ctx.fillRect(gx + 2, 69, 4, 16);
  ctx.fillStyle = "#6a6458";
  for(let y = 71; y < 84; y += 3) ctx.fillRect(gx + 3, y, 2, 1);

  const dx = doorLeft();
  ctx.fillStyle = PAL.gate;
  ctx.fillRect(dx, 70, 11, 1);
  ctx.fillRect(dx, 97, 11, 1);
  for(let x = dx; x < dx + 11; x += 3) ctx.fillRect(x, 70, 1, 28);
}

// ===== 描画：キャラクター =====
function drawCan(can){
  const bob = Math.floor(can.age / 16) % 2;
  const x = Math.round(can.x), y = can.y + bob;
  drawSprite(CAN, x, y, CAN_PAL);
  if(Math.floor(can.age / 20) % 2){
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x+7, y-1, 1, 1);
    ctx.fillRect(x+6, y-2, 1, 1);
    ctx.fillRect(x+8, y-2, 1, 1);
    ctx.fillRect(x+7, y-3, 1, 1);
  }
}

function drawCat(cat){
  const pal = CAT_PAL[cat.type];
  const x = Math.round(cat.x);
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.fillRect(x+1, groundY, 12, 1);
  if(cat.isStationary){
    drawSprite(CAT_SLEEP, x, groundY - 7, pal);
  } else if(cat.kind === "tabby"){
    const y = Math.round(cat.y);
    const inAir = y < groundY - 9;
    drawSprite(TABBY_TOP, x, y, pal);
    drawSprite(inAir ? CAT_LEGS_B : CAT_LEGS_A, x, y + 7, pal);
  } else {
    const f = Math.floor(cat.age / 5) % 2;
    const y = groundY - 9 - f;
    drawSprite(CAT_RUN_TOP, x, y, pal);
    drawSprite(f ? CAT_LEGS_B : CAT_LEGS_A, x, y + 7, pal);
  }
}

// エナドリのブースト中は体がオレンジ色に
const GIRL_PAL_BOOST = { K:"#a04818", S:"#ffc890", W:"#ffb050", N:"#e86a18", R:"#ff4818", B:"#b85818", D:"#783010" };
// 無敵タイム中はキラキラ点滅
const GIRL_PAL_STAR = [
  { K:"#fff4c0", S:"#ffffff", W:"#ffffff", N:"#ffe070", R:"#ffffff", B:"#ffe070", D:"#f8d030" },
  { K:"#f8d030", S:"#ffe8a0", W:"#ffd060", N:"#ff9030", R:"#ff6030", B:"#f8a040", D:"#c06020" },
];
function girlPal(){
  const live = state === "playing" || state === "goal";
  if(live && starT > 0) return GIRL_PAL_STAR[Math.floor(animTick / 3) % 2];
  return boostLeft > 0 && live ? GIRL_PAL_BOOST : GIRL_PAL;
}

function drawPlayer(){
  if(state === "clear") return;
  const x = Math.round(player.x);
  const y = Math.round(player.y);

  if(state === "crash"){
    // 吹っ飛んでひっくり返る
    drawSprite(GIRL_LEGS_A, x, y, GIRL_PAL, true);
    drawSprite(GIRL_TOP, x, y + 3, GIRL_PAL, true);
    return;
  }

  if(player.flip > 0){
    // 空中クルッ（前回り1回転）
    const f = Math.min(3, Math.floor((CONFIG.flipTime - player.flip) / (CONFIG.flipTime / 4)));
    const spr = GIRL_ROT[f];
    const w = spr[0].length, h = spr.length;
    drawSprite(spr, x + 6 - Math.floor(w/2), y + 8 - Math.floor(h/2), girlPal());
    return;
  }

  if(rolling > 0){
    // 体ごと転がる（90°ずつ回転）
    const f = Math.floor((CONFIG.rollTime - rolling) / 4) % 4;
    const spr = GIRL_ROT[f];
    const w = spr[0].length, h = spr.length;
    drawSprite(spr, x + 6 - Math.floor(w/2), groundY - h, girlPal());
    return;
  }

  // 水たまりを踏んだら点滅
  if(blink > 0 && Math.floor(blink / 4) % 2) return;

  ctx.fillStyle = "rgba(0,0,0,.18)";
  const sw = player.jumping ? 6 : 10;
  ctx.fillRect(x + 6 - sw/2, groundY, sw, 1);
  drawSprite(GIRL_TOP, x, y, girlPal());
  let legs = GIRL_LEGS_A;
  const running = state === "playing" || state === "goal";
  if(running && !player.jumping && Math.floor(animTick / 6) % 2) legs = GIRL_LEGS_B;
  drawSprite(legs, x, y + 12, girlPal());
}

function drawBanana(b){
  drawSprite(BANANA, b.x, groundY - 4, BANANA_PAL);
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
  });
}

function drawConfetti(){
  confetti.forEach(c=>{
    ctx.fillStyle = c.c;
    if(Math.floor(c.t / 14) % 2) ctx.fillRect(Math.round(c.x), Math.round(c.y), 2, 1);
    else ctx.fillRect(Math.round(c.x), Math.round(c.y), 1, 2);
  });
}

function draw(){
  const gx = gateScreenX();
  drawSky();
  ctx.save();
  ctx.translate(0, VIEW_OY);
  drawClouds();
  drawHills();
  drawFarHouses();
  drawNearHouses();
  drawSchool(gx);
  drawElder();
  drawFront(gx);
  drawRoad();
  puddles.forEach(drawPuddle);
  bananas.forEach(drawBanana);
  drawGate(gx);
  drawTeacher(gx);
  cans.forEach(drawCan);
  cats.forEach(drawCat);
  crows.forEach(c => drawSprite(Math.floor(c.age / 8) % 2 ? CROW_B : CROW_A, c.x, c.y, CROW_PAL));
  drawPlayer();
  drawParticles();
  drawFireworks();
  drawConfetti();
  ctx.restore();
}

player = createPlayer();
createTown();

// 固定タイムステップ（60Hz）
const STEP = 1000/60;
let last = performance.now();
let acc = 0;
function loop(now){
  if(paused){
    // ポーズ中は時間を進めない（再開時にまとめて進まないよう、経過時間も捨てる）
    last = now; acc = 0;
    draw();
    requestAnimationFrame(loop);
    return;
  }
  acc += Math.min(100, now - last);
  last = now;
  while(acc >= STEP){
    update();
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
