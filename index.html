// ===== 描画：背景 =====
function layerOffset(layer){
  return Math.round(worldOffset * layer.factor) % layer.period;
}
function eachVisible(layer, fn){
  const off = layerOffset(layer);
  layer.items.forEach(it=>{
    for(let k=0;k<3;k++){
      const sx = it.x - off + k*layer.period;
      if(sx + it.w > -12 && sx < W + 12) fn(it, sx);
    }
  });
}

function drawSky(){
  ctx.fillStyle = PAL.sky;
  ctx.fillRect(0,0,W,H);
}

function drawClouds(){
  ctx.fillStyle = PAL.cloud;
  eachVisible(layers.clouds, (c,x)=>{
    ctx.fillRect(x, c.y+3, c.w, 4);
    ctx.fillRect(x+3, c.y+1, Math.round(c.w*.45), 2);
    ctx.fillRect(x+Math.round(c.w*.4), c.y, Math.round(c.w*.35), 3);
  });
}

function drawHills(){
  const L = layers.hills, off = layerOffset(L);
  ctx.fillStyle = PAL.hill;
  for(let x=0;x<W;x++){
    const h = L.heights[(x + off) % L.period];
    ctx.fillRect(x, h, 1, groundY - h);
  }
}

function drawHouse(x, base, w, wall, roof, wallCol, roofCol){
  const top = base - wall;
  ctx.fillStyle = wallCol;
  ctx.fillRect(x, top, w, wall);
  ctx.fillStyle = roofCol;
  for(let i=0;i<roof;i++){
    const inset = Math.round(i * (w/2 + 2) / roof);
    ctx.fillRect(x - 2 + inset, top - 1 - i, w + 4 - inset*2, 1);
  }
}

function drawFarHouses(){
  eachVisible(layers.farHouses, (h,x)=>{
    drawHouse(x, 90, h.w, h.wall, h.roof, PAL.farHouse, PAL.farHouse);
  });
}

function drawNearHouses(){
  eachVisible(layers.nearHouses, (h,x)=>{
    const base = 88;
    drawHouse(x, base, h.w, h.wall, h.roof, PAL.wall[h.c], PAL.roof[h.c]);
    ctx.fillStyle = PAL.window;
    const top = base - h.wall;
    ctx.fillRect(x+4, top+3, 5, 4);
    ctx.fillRect(x+h.w-9, top+3, 5, 4);
    if(h.wall >= 18) ctx.fillRect(x+4, top+10, 5, 4);
    if(h.tree){
      ctx.fillStyle = PAL.tree;
      pixelCircle(x + h.w + 3, base - 9, 5);

function drawFront(gx){
  const L = layers.front;
  const off = layerOffset(L);
  const wireEnd = Math.min(W, gx);
  if(wireEnd > 0){
    ctx.fillStyle = PAL.wire;
    ctx.fillRect(0, 38, wireEnd, 1);
    ctx.fillRect(0, 42, wireEnd, 1);
  }
  ctx.fillStyle = PAL.pole;
  for(let k=0;k<4;k++){
    const x = 50 - off + k*L.period;
    if(x < -12 || x > W + 12 || x > gx - 8) continue;
    ctx.fillRect(x, 32, 3, 58);
    ctx.fillRect(x-4, 37, 11, 2);
  }
  const fTop = 84, fBot = groundY;
  ctx.fillStyle = PAL.fence;
  ctx.fillRect(0, fTop, W, fBot - fTop);
  ctx.fillStyle = PAL.fenceLn;
  ctx.fillRect(0, fTop, W, 1);
  ctx.fillRect(0, fTop + 5, W, 1);
  const seamOff = Math.round(worldOffset * L.factor) % 16;
  for(let x = -seamOff; x < W; x += 16){
    ctx.fillRect(x, fTop+1, 1, 4);
    ctx.fillRect(x+8, fTop+6, 1, fBot - fTop - 6);
  }
}

function drawRoad(){
  // 塀の下に細い路側帯 → 広いアスファルト（この上を走る）→ 縁石 → わずかな植え込み
  ctx.fillStyle = PAL.path;
  ctx.fillRect(0, groundY, W, 3);
  ctx.fillStyle = PAL.line;
  ctx.fillRect(0, groundY + 3, W, 1);

// 自転車・ハートのアイコン（ドット絵を SVG に）
function pixSVG(rows, pal, scale, outline){
  const h = rows.length, w = rows[0].length, o = outline ? 1 : 0;
  let r = "";
  const at = (x, y) => y >= 0 && y < h && x >= 0 && x < w && rows[y][x] !== ".";
  for(let y = -o; y < h + o; y++) for(let x = -o; x < w + o; x++){
    let c = null;
    if(at(x, y)) c = pal[rows[y][x]];
    else if(outline && (at(x-1, y) || at(x+1, y) || at(x, y-1) || at(x, y+1))) c = "#1c2030";
    if(c) r += `<rect x="${x+o}" y="${y+o}" width="1" height="1" fill="${c}"/>`;
  }
  return `<svg viewBox="0 0 ${w+o*2} ${h+o*2}" style="width:calc(var(--dot) * ${(w+o*2)*scale});height:calc(var(--dot) * ${(h+o*2)*scale})" shape-rendering="crispEdges">${r}</svg>`;
}

const XITEMS = [

const canBuy = it => it.ok() && medalWallet >= it.cost;
let exchangeOpen = false, exchangeChosen = false, exchangeDone = false, xCursor = null, resultT = 0;
function canExchange(){ return XITEMS.some(it => it.id !== "skip" && canBuy(it)); }
function xBox(id){ return document.querySelector(`.xbox[data-x="${id}"]`); }
function openExchange(){
  exchangeOpen = true; exchangeChosen = false; exchangeDone = true; xCursor = null;

function renderExchange(){
  document.getElementById("xWallet").innerHTML = `つかえるメダル ${medalText(medalWallet) || "×0"}`;
  XITEMS.forEach(it => {
    xBox(it.id).classList.toggle("off", !canBuy(it));

  });

// ←→：選べるものを順に（上段→下段）。↑↓：上下の段へ
function moveExchange(dir){
  if(!exchangeOpen || exchangeChosen) return;
  const en = XROWS.flat().filter(id => canBuy(XITEMS.find(t => t.id === id)));
  if(!en.length) return;
  let k = en.indexOf(xCursor);
  if(k < 0) k = dir > 0 ? 0 : en.length - 1;   // 最初の一押しで、押した側の端に
  else k = Math.max(0, Math.min(en.length - 1, k + dir));
  xCursor = en[k]; renderExchange();
}
function moveExchangeRow(dir){
  if(!exchangeOpen || exchangeChosen) return;
  if(!xCursor){ moveExchange(1); return; }
  const r = XROWS.findIndex(row => row.includes(xCursor)), c = XROWS[r].indexOf(xCursor);
  const nr = r + dir;
  if(nr < 0 || nr >= XROWS.length) return;
  // 真上・真下が選べなければ、その段で近いものへ
  const cand = XROWS[nr].map((id, i) => [id, Math.abs(i - c)]).filter(([id]) => canBuy(XITEMS.find(t => t.id === id))).sort((p, q) => p[1] - q[1]);
  if(cand.length){ xCursor = cand[0][0]; renderExchange(); }
}
function chooseExchange(which){
  if(!exchangeOpen || exchangeChosen) return;
  const it = XITEMS.find(t => t.id === which);
  if(!it || !canBuy(it)) return;
  exchangeChosen = true; xCursor = which; renderExchange();
  if(which === "skip"){ setTimeout(closeExchange, 200); return; }   // 交換しない（メダルはそのまま持ち越し）
  medalWallet -= it.cost;
  if(which === "bread"){ lives = Math.min(maxLives, lives + 1); playHealSE(); }
  else if(which === "bike"){ onBike = true; bikeHP = BIKE_HP; playMedalSE(); }   // 乗っているあいだは買い替えできない（ok で選べない）
  else if(which === "umb"){ umbrella = UMBRELLA_HP; playMedalSE(); }
  else if(which === "life3" || which === "life4"){ maxLives++; lives = Math.min(maxLives, lives + 1); playHealSE(); }   // 上限が増えて、そのぶん回復
  updateHUD();
  document.getElementById("xGot").textContent = it.got;
  // 選んだ枠からアイコンがポンと出る
  const box = xBox(which).getBoundingClientRect();
  const scr = document.querySelector(".screen").getBoundingClientRect();
  const pop = document.getElementById("xPop");
  pop.innerHTML = it.icon();
  pop.style.left = (box.left + box.width / 2 - scr.left) + "px";
  pop.style.top = (box.top + box.height / 2 - scr.top) + "px";
  pop.className = "xpop"; void pop.offsetWidth; pop.className = "xpop go";
  renderExchange();
  // 続けて交換できる（メダルが足りるあいだ）。もう何も交換できなければ閉じる
  setTimeout(() => {
    if(!exchangeOpen) return;
    if(!canExchange()){ closeExchange(); return; }
    exchangeChosen = false;
    if(!canBuy(XITEMS.find(t => t.id === xCursor))) xCursor = null;
    document.getElementById("xGot").textContent = "";
    renderExchange();
  }, 1300);
}
function closeExchange(){
  exchangeOpen = false;
  document.getElementById("xchg").classList.add("hidden");
  inputLockUntil = performance.now() + 400;   // リザルトにもどる。進むのはボタン（かSPACE）を押してから
}

function girlParts(){
  const x = Math.round(player.x), y = Math.round(player.y);
  if(onBike){
    if(player.flip > 0){
      const f = Math.min(3, Math.floor((CONFIG.flipTime - player.flip) / (CONFIG.flipTime / 4)));
      const spr = BIKE_ROT[f];
      return [[spr, x + 7 - Math.floor(spr[0].length/2), y + 4 - Math.floor(spr.length/2)]];
    }
    return [[bikeFrame(), x - 5, y - 6]];
  }
  if(player.flip > 0){
    const f = Math.min(3, Math.floor((CONFIG.flipTime - player.flip) / (CONFIG.flipTime / 4)));
    const spr = GIRL_ROT[f];
    return [[spr, x + 6 - Math.floor(spr[0].length/2), y + 8 - Math.floor(spr.length/2)]];
  }
  if(rolling > 0){
    const f = Math.floor((CONFIG.rollTime - rolling) / 4) % 4;
    const spr = GIRL_ROT[f];
    return [[spr, x + 6 - Math.floor(spr[0].length/2), groundY - spr.length]];
  }
  const legs = (!player.jumping && Math.floor(animTick / 6) % 2) ? GIRL_LEGS_B : GIRL_LEGS_A;
  return [[GIRL_TOP, x, y], [legs, x, y + 12]];
}

    ghosts.push({ parts: girlParts(), pal: onBike ? bikePal() : girlPal(), dx: 0, life: GHOST_LIFE });
  }
  for(let i = ghosts.length - 1; i >= 0; i--){
    const g = ghosts[i];
    g.dx -= 1.6;   // 後ろへ流れていく
    if(--g.life <= 0) ghosts.splice(i, 1);
  }
}
function drawGhosts(){
  ghosts.forEach(g => {
    if(g.bike) g.pal = bikePal();
    ctx.globalAlpha = 0.45 * g.life / GHOST_LIFE;
    g.parts.forEach(([spr, x, y]) => drawSprite(spr, Math.round(x + g.dx), y, g.pal));
  });
  ctx.globalAlpha = 1;
}

function drawPlayer(){
  if(state === "clear") return;
  const x = Math.round(player.x);
  const y = Math.round(player.y);

  if(state === "crash"){
    // 吹っ飛んでひっくり返る
    drawSprite(GIRL_LEGS_A, x, y, GIRL_PAL, true);
    drawSprite(GIRL_TOP, x, y + 3, GIRL_PAL, true);
    return;
  }

  if(onBike){
    // 自転車に乗っている
    if(blink > 0 && Math.floor(blink / 4) % 2) return;
    if(player.flip > 0 && umbrella > 0){ drawFlipWithUmbrella(bikePal()); return; }   // 自転車＋傘ごと回る
    if(player.flip > 0){
      // 空中クルッ：自転車ごと前回り1回転（中心は自転車の真ん中）
      const f = Math.min(3, Math.floor((CONFIG.flipTime - player.flip) / (CONFIG.flipTime / 4)));
      const spr = BIKE_ROT[f], w = spr[0].length, h = spr.length;
      drawSprite(spr, x + 7 - Math.floor(w/2), y + 4 - Math.floor(h/2), bikePal());
      return;
    }
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.fillRect(x - 1, groundY, player.jumping ? 14 : 20, 1);
    drawSprite(bikeFrame(), x - 5, y - 6, bikePal());
    return;
  }

  if(player.flip > 0 && umbrella > 0){ drawFlipWithUmbrella(girlPal()); return; }   // 傘ごと回る
  if(player.flip > 0){
    // 空中クルッ（前回り1回転）
    const f = Math.min(3, Math.floor((CONFIG.flipTime - player.flip) / (CONFIG.flipTime / 4)));
    const spr = GIRL_ROT[f];
    const w = spr[0].length, h = spr.length;
    drawSprite(spr, x + 6 - Math.floor(w/2), y + 8 - Math.floor(h/2), girlPal());
    return;
  }

  if(rolling > 0){
    // 体ごと転がる（90°ずつ回転）
    const f = Math.floor((CONFIG.rollTime - rolling) / 4) % 4;
    const spr = GIRL_ROT[f];
    const w = spr[0].length, h = spr.length;
    drawSprite(spr, x + 6 - Math.floor(w/2), groundY - h, girlPal());
    return;
  }

  // 水たまりを踏んだら点滅
  if(blink > 0 && Math.floor(blink / 4) % 2) return;

  ctx.fillStyle = "rgba(0,0,0,.18)";
  const sw = player.jumping ? 6 : 10;
  ctx.fillRect(x + 6 - sw/2, groundY, sw, 1);
  drawSprite(GIRL_TOP, x, y, girlPal());
  let legs = GIRL_LEGS_A;
  const running = state === "playing" || state === "goal";
  if(running && !player.jumping && Math.floor(animTick / 6) % 2) legs = GIRL_LEGS_B;
  drawSprite(legs, x, y + 12, girlPal());
}

// ===== スイカ =====
// 夏：後ろ（左）から転がってくる。来る前に左に矢印が「ピコン、ピコン」と2回点滅。
// ジャンプでよけられる。当たると上に乗って（自転車でも）しばらく進み、そのあいだはジャンプできない（バナナと同じく、自分では動けない）。
// 乗り終わるとスイカは割れて、半分ずつが道に残る
const MELON_W = 12, MELON_H = 12;
const MELON_PAL = { G:"#269c33", g:"#186923", R:"#de3733", r:"#b42626", K:"#181818", W:"#ececd2" };
const MELON_WARN_T = 48;   // 矢印の点滅（2回）
const MELON_V = 1.7;       // 画面の上で右へ進む速さ（女の子に追いつく）
const MELON_RIDE_T = 80;   // 乗っている時間（フレーム）
// 割れたあと：左右の半分（赤い中身と黒い種、下に緑の皮）
const MELON_HALF_L = [
  "..RRRR",
  ".RRKRR",
  "RRRRKR",
  "RKRRRR",
  "WWWWWW",
  "GGGGGG",
  ".gGGG.",
];
const MELON_HALF_R = MELON_HALF_L.map(r => [...r].reverse().join(""));
const WARN_ARROW = ["...Y....", "...YY...", "YYYYYY..", "YYYYYYY.", "YYYYYY..", "...YY...", "...Y...."];
// 丸ごと：まんまるに、ベースの緑と少し濃い緑のしま（roll で回る）
function drawMelonWhole(x0, y0, roll){
  const r = MELON_W / 2, c = Math.cos(.5 + roll), sn = Math.sin(.5 + roll);
  for(let y = 0; y < MELON_H; y++) for(let x = 0; x < MELON_W; x++){
    const dx = x - r + .5, dy = y - r + .5;
    if(dx * dx + dy * dy > r * r) continue;
    const u = dx * c + dy * sn;
    ctx.fillStyle = (((Math.floor(u + 20) % 4) + 4) % 4) < 2 ? MELON_PAL.g : MELON_PAL.G;
    ctx.fillRect(x0 + x, y0 + y, 1, 1);
  }
}
function playPikonSE(){
  if(!audioCtx) return;
  const t = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(1568, t); osc.frequency.setValueAtTime(2093, t + .05);
  gain.gain.setValueAtTime(0.06, t); gain.gain.setValueAtTime(0.0001, t + .1);
  osc.connect(gain); gain.connect(outNode());
  osc.start(t); osc.stop(t + .11);
}
const melonRideY = () => groundY - MELON_H - player.h;
function updateMelons(scroll){
  // 予告の矢印 → スイカ登場
  if(melonWarn > 0){
    if(melonWarn === MELON_WARN_T || melonWarn === MELON_WARN_T - 24) playPikonSE();
    if(--melonWarn === 0) melons.push({ x:-MELON_W - 2, roll:0, broken:false });
  }
  for(let i = melons.length - 1; i >= 0; i--){
    const m = melons[i];
    if(m.broken){ m.x -= scroll; if(m.x < -20) melons.splice(i, 1); continue; }
    m.x += MELON_V; m.roll += MELON_V / 6;
    const pb = playerBox(), feet = player.y + player.h;
    const touch = m.x + MELON_W - 2 > pb.x && m.x + 2 < pb.x + pb.w;
    if(touch && starT === 0 && feet > groundY - MELON_H + 3 && !melonRide){
      // 当たった：上に乗る
      melons.splice(i, 1);
      melonRide = { t:MELON_RIDE_T, roll:m.roll };
      player.vy = 0; player.jumping = false; player.flip = 0;
      dropUmbrella();
      playKnockSE();
      setSpeed();
      popAt("slowpop", "SLOW", "down", player.x + 6, player.y - 12);
      popAt("wapopL", "わっ", "", player.x - 9, melonRideY() + 4);   // ぐらっ（左）
      continue;
    }
    if(m.x > W + 20) melons.splice(i, 1);
  }
  // 乗っているあいだ：スイカの上で進む（ジャンプ不可）。終わったら割れる
  if(melonRide){
    player.y = melonRideY(); player.vy = 0;
    melonRide.roll += scroll / 6;
    // 焦りの汗：頭の上から、上へ向かって左右に飛ぶ
    if(melonRide.t % 4 === 0){
      const side = (melonRide.t / 4) % 2 ? -1 : 1;
      particles.push({ x:player.x + 6 + side * 5, y:player.y, vx:side * rand(.4, .8), vy:-rand(1.1, 1.6), life:18, c:"#5fb2ee", w:2, h:2 });
    }
    if(melonRide.t === MELON_RIDE_T - 22) popAt("wapopR", "わっ", "", player.x + 21, melonRideY() + 4);   // →ぐらっ（右）
    if(--melonRide.t <= 0){
      const m = { x:player.x + (onBike ? 2 : 0), broken:true };
      melons.push(m);
      breakMelon(m);
      melonRide = null;
      setSpeed();
      player.jumping = true;   // 地面へ落ちる
    }
  }
}
function drawMelon(m){
  const x = Math.round(m.x);
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(x + 1, groundY, MELON_W - 2, 1);
  if(!m.broken){ drawMelonWhole(x, groundY - MELON_H, m.roll); return; }
  drawSprite(MELON_HALF_L, x - 2, groundY - 7, MELON_PAL);
  drawSprite(MELON_HALF_R, x + 8, groundY - 7, MELON_PAL);
}
// 乗っているスイカ（女の子の足もと）と、予告の矢印
function drawMelonExtras(){
  if(melonRide){
    const x = Math.round(player.x + (onBike ? 2 : 0));
    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(x + 1, groundY, MELON_W - 2, 1);
    drawMelonWhole(x, groundY - MELON_H, melonRide.roll);
  }
  if(melonWarn > 0 && Math.floor((MELON_WARN_T - melonWarn) / 12) % 2 === 0) drawSprite(WARN_ARROW, 3, groundY - 10, { Y:"#f8d030" });
}
// 割れる：赤い汁と黒い種が飛び散る
function breakMelon(m){
  m.broken = true;
  const cx = m.x + MELON_W / 2, cy = groundY - MELON_H / 2;
  for(let k = 0; k < 14; k++) particles.push({ x:cx, y:cy, vx:rand(-1.6, 1.6), vy:-rand(.6, 2.2), life:26, c:k % 3 === 0 ? MELON_PAL.K : (k % 3 === 1 ? MELON_PAL.R : MELON_PAL.r) });
  shakeT = 6;
  playKnockSE();
}
function drawBanana(b){
  if(b.knock){ drawSprite(BANANA, Math.round(b.x), Math.round(groundY - 4 + b.ky), BANANA_PAL, true); return; }
  drawSprite(BANANA, b.x, groundY - 4, BANANA_PAL);
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.w || 1, p.h || 1);
  });
}

function drawConfetti(){
  confetti.forEach(c=>{
    ctx.fillStyle = c.c;
    if(Math.floor(c.t / 14) % 2) ctx.fillRect(Math.round(c.x), Math.round(c.y), 2, 1);
    else ctx.fillRect(Math.round(c.x), Math.round(c.y), 1, 2);
  });
}

function draw(){
  const gx = gateScreenX();
  drawSky();
  ctx.save();
  // 吹っ飛ばしたときに画面を少しゆらす
  let sx = 0, sy = 0;
  if(shakeT > 0){ sx = (shakeT % 2 ? 1 : -1); sy = (shakeT % 4 < 2 ? 1 : 0); if(!paused) shakeT--; }
  ctx.translate(sx, VIEW_OY + sy);
  drawClouds();
  drawHills();
  drawFarHouses();
  drawNearHouses();
  drawSchool(gx);
  drawSakura();
  drawElder();
  drawFront(gx);
  drawRoad();
  drawHydrangea();
  ctx.save();
  ctx.translate(0, LANE);   // ここから道の上（手前）のもの
  puddles.forEach(drawPuddle);
  bananas.forEach(drawBanana);
  melons.forEach(drawMelon);
  drawMelonExtras();
  drawGate(gx);
  drawTeacher(gx);
  cans.forEach(drawCan);
  cats.forEach(drawCat);
  crows.forEach(c => drawSprite(c.knock ? CROW_A : (Math.floor(c.age / 8) % 2 ? CROW_B : CROW_A), Math.round(c.x), Math.round(c.y), CROW_PAL, !!c.knock));   // はじかれたカラスはひっくり返る
  drawGhosts();
  drawPlayer();
  drawHeldUmbrella();
  drawFlyUmbs();
  drawParticles();
  ctx.restore();
  drawSunflowers();
  drawPetals();
  drawRain();
  drawSunRays();
  drawFireworks();
  drawConfetti();
  ctx.restore();
}

player = createPlayer();
createTown();

// 固定タイムステップ（60Hz）
const STEP = 1000/60;
let last = performance.now();
let acc = 0;
function loop(now){
  if(paused){
    // ポーズ中は時間を進めない（再開時にまとめて進まないよう、経過時間も捨てる）
    last = now; acc = 0;
    draw();
    requestAnimationFrame(loop);
    return;
  }
  acc += Math.min(100, now - last);
  last = now;
  while(acc >= STEP){
    update();
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
