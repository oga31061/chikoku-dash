*{box-sizing:border-box}
body{
  margin:0;
  background:#141820;
  font-family:"PixelJP",monospace;
  -webkit-font-smoothing:none;
  font-smooth:never;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  color:#f8f8f8;
}
.game-wrap{ position:relative; }
.header{
  padding:4px 8px;
  font-size:16px;
}
.screen{ position:relative; overflow:hidden; }
canvas{
  display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}
.heart{ color:#e03838; }
.lifelabel .heart + .heart{ margin-left:calc(var(--dot) * 2); }   /* ハートどうしの間をあける */
.stock{ display:inline-flex; gap:0; margin-left:calc(var(--dot) * 4); align-items:center; }
.can{ display:block; }
/* メダル（はやいな評価のごほうび） */
.medal{ display:block; }
.medaltxt{ white-space:nowrap; }
/* リザルト・記録：文字と同じ行に置き、メダルの下端を文字の下端（基準線の2ドット下）にそろえる */
.medaltxt .medal{ display:inline-block; vertical-align:-.25em; margin-right:.2em; }   /* 大きさはドット等倍（medalSVG が指定） */
.medaltxt.mini .medal{ height:.8em; width:.8em; vertical-align:0; margin-right:.15em; }
.medalstack{
  position:absolute; right:calc(var(--dot) * 5); bottom:calc(var(--dot) * 5);   /* 画面下の地面の帯：右にメダル×数 */
  display:flex; align-items:center; gap:calc(var(--dot) * 2); font-size:calc(var(--dot) * 8); color:#f8f8f8; white-space:nowrap;
  pointer-events:none; z-index:4;
}
.medalstack.new{ animation:medalin .5s steps(5, end); }
@keyframes medalin{ 0%{ transform:translateY(calc(var(--dot) * -6)); } 100%{ transform:none; } }
.medalpop{
  position:absolute; pointer-events:none; z-index:4;   /* クリア画面の文字より奥（文字にかぶらない） */
  transform:translate(-50%, -100%);
  animation:medalpop 2.2s steps(22, end) forwards;
}

@keyframes medalpop{
  0%  { transform:translate(-50%, -100%); opacity:1; }
  20% { transform:translate(-50%, calc(-100% - var(--dot) * 12)); opacity:1; }
  85% { transform:translate(-50%, calc(-100% - var(--dot) * 14)); opacity:1; }
  100%{ transform:translate(-50%, calc(-100% - var(--dot) * 14)); opacity:0; }
}
.medalpop .spark{ position:absolute; width:calc(var(--dot) * 5); height:calc(var(--dot) * 5); animation:spark .5s steps(1, end) infinite; }
@keyframes spark{ 0%{ opacity:1; } 50%{ opacity:0; } }
.screen.paused .medalpop, .screen.paused .medalpop .spark, .screen.paused .medalstack .new{ animation-play-state:paused !important; }
.cangap{ display:block; width:calc(var(--dot) * 3); }

/* 「−♥1」：マイナスは線で描いて高さを中央に、間隔は均等に */
.dmg{ display:inline-flex; align-items:center; gap:.3em; }
.dmg .minus{
  display:inline-block;
  width:.5em;
  height:.14em;
  background:#f8f8f8;
  box-shadow:2px 2px 0 #1c2030, -1px -1px 0 #1c2030, 1px -1px 0 #1c2030, -1px 1px 0 #1c2030;
}
.dmg .neg, .dmg .pos{ display:inline-flex; align-items:center; gap:.15em; }
.dmg .neg{ color:#ff5050; }
.dmg .neg .minus{ background:#ff5050; }
.dmg .pos{ color:#f8d030; }
.dmg .pos .plus::before, .dmg .pos .plus::after{ background:#f8d030; }
.dmg .plus{ position:relative; display:inline-block; width:.62em; height:.62em; }
.dmg .plus::before, .dmg .plus::after{
  content:""; position:absolute; background:#f8f8f8;
  box-shadow:2px 2px 0 #1c2030;
}
.dmg .plus::before{ left:0; top:.24em; width:.62em; height:.14em; }
.dmg .plus::after{ left:.24em; top:0; width:.14em; height:.62em; }
.heart.lost{ color:#5a5c64; }
.meter{
  position:absolute;
  top:50%;
  right:2%;
  transform:translateY(-50%);
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:.2em;
}
.meter .arrow{
  width:1em;
  height:1em;
  fill:#f8f8f8;
  filter:drop-shadow(2px 2px 0 #1c2030) drop-shadow(-1px -1px 0 #1c2030);
}
.daylabel{
  position:absolute;
  top:calc(var(--dot) * 4);
  right:3%;
  white-space:nowrap;
  text-align:right;
}
/* 画面下：ゲームの情報だけ（ライフ・残り時間・スピード） */
.lifelabel{
  position:absolute;
  top:calc(var(--dot) * 4);    /* 左上：ハートとエナドリ（その下にセリフウィンドウ） */
  left:calc(var(--dot) * 5);
  white-space:nowrap;
  display:flex;
  align-items:center;   /* ハートとエナドリの高さをそろえる */
}
.hud{
  position:absolute;
  top:calc(var(--dot) * 16);   /* 右上：日にちの下に今の時刻だけ */
  right:3%;
  white-space:nowrap;
  letter-spacing:.05em;
}
.hurry{ color:#ff6060; }
.meter .num, .num{ color:#f8d030; }
.outline{
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
}
.msgwin{
  position:absolute;
  top:calc(var(--dot) * 16);   /* ハートとエナドリの下 */
  left:calc(var(--dot) * 3);
  /* 一番長いセリフ（10文字）＋顔アイコンが収まる、ぎりぎりの幅 */
  width:calc(var(--dot) * 118);
  height:calc(var(--dot) * 30);
  box-sizing:border-box;
  display:flex;
  align-items:center;
  gap:calc(var(--dot) * 4);
  padding:0 calc(var(--dot) * 4);
  background:transparent;
  border:var(--dot) solid #f8f8f8;
  /* 枠にも1ドットの影 */
  box-shadow:var(--dot) var(--dot) 0 #1c2030, inset var(--dot) var(--dot) 0 #1c2030;
  color:#f8f8f8;
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
  white-space:nowrap;
}
.msgwin .msg{ text-align:left !important; }
/* 「きょうははやいな！」のとき、セリフウィンドウの下に */
.umbstars{ position:absolute; transform:translate(-50%, -100%); font-size:calc(var(--dot) * 8); color:#f8d030; white-space:nowrap; pointer-events:none; opacity:0; z-index:5; }
.umbstars.show{ animation:umbshow 1.1s steps(1, end) forwards; }
@keyframes umbshow{ 0%{ opacity:1; } 90%{ opacity:1; } 100%{ opacity:0; } }
.umbstars .lose{ animation:umblose .5s steps(1, end) forwards; }
@keyframes umblose{ 0%{ opacity:1; } 20%{ opacity:0; } 40%{ opacity:1; } 60%{ opacity:0; } 80%{ opacity:1; } 100%{ opacity:0; } }
.screen.paused .umbstars, .screen.paused .umbstars .lose{ animation-play-state:paused !important; }
.medalmsg{ position:absolute; top:calc(var(--dot) * 49); left:calc(var(--dot) * 4); font-size:calc(var(--dot) * 8); color:#f8d030; white-space:nowrap; z-index:4; }
.daybanner{
  position:absolute;
  top:42%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:calc(var(--dot) * 24);
  color:#f8f8f8;
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  text-shadow:calc(var(--dot) * 2) calc(var(--dot) * 2) 0 #1c2030, calc(var(--dot) * -2) 0 0 #1c2030, calc(var(--dot) * 2) 0 0 #1c2030, 0 calc(var(--dot) * -2) 0 #1c2030, 0 calc(var(--dot) * 2) 0 #1c2030;
}
.daybanner.show{ animation:daybanner 1.8s steps(1, end) forwards; }
@keyframes daybanner{
  0%   { opacity:1; }
  85%  { opacity:1; }
  100% { opacity:0; }
}
.screen.paused .daybanner{ animation-play-state:paused !important; }
.hurrypop{
  position:absolute;
  transform:translate(-50%, -100%);
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
}
.hurrypop.hop{ animation:hop 1s steps(10, end) forwards; }
@keyframes hop{
  0%   { opacity:1; transform:translate(-50%, -100%); }
  15%  { opacity:1; transform:translate(-50%, -190%); }
  30%  { opacity:1; transform:translate(-50%, -150%); }
  75%  { opacity:1; transform:translate(-50%, -170%); }
  100% { opacity:0; transform:translate(-50%, -190%); }
}
.msgwin .face{
  width:calc(var(--dot) * 20);
  height:calc(var(--dot) * 20);
  image-rendering:pixelated;
  flex:none;
  background:#d6e2ea;
  box-shadow:var(--dot) var(--dot) 0 #1c2030;
}
.msgwin .msg{ flex:1; min-width:0; text-align:center; overflow:hidden; }
.msgwin .msg.red{ color:#ff6060; }
.speedo{
  display:none !important;   /* スピード表示はなし */
  position:absolute;
  top:calc(var(--dot) * 24);
  right:3%;
  white-space:nowrap;
  letter-spacing:.08em;
}
.boostlabel{
  display:none !important;   /* ブーストはセリフウィンドウの顔で知らせる */
  position:absolute;
  top:calc(var(--dot) * 24);
  right:3%;
  color:#f8d030;
  white-space:nowrap;
  letter-spacing:.08em;
}
.popup{
  position:absolute;
  top:30%;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
}
.popup.show{ animation:pop 1.8s steps(1,end) forwards; }
@keyframes pop{
  0%   { opacity:1; transform:translate(-50%, 8px); }
  8%   { opacity:1; transform:translate(-50%, 0); }
  85%  { opacity:1; transform:translate(-50%, 0); }
  100% { opacity:0; transform:translate(-50%, 0); }
}
.headpop{
  position:absolute;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%, -100%);
}
.headpop.up{ color:#f8d030; }
.headpop.red{ color:#ff6060; }
.headpop.down{ color:#80c0ff; }
.headpop.talk{ animation:talk 2.4s steps(1,end) forwards; }
@keyframes talk{
  0%   { opacity:1; }
  88%  { opacity:1; }
  100% { opacity:0; }
}
.headpop.show{ animation:headpop 1s steps(6,end) forwards; }
@keyframes headpop{
  0%   { opacity:1; transform:translate(-50%, -100%); }
  80%  { opacity:1; transform:translate(-50%, -180%); }
  100% { opacity:0; transform:translate(-50%, -180%); }
}
.controls{
  position:absolute;
  bottom:calc(var(--dot) * 3);
  left:0; right:0;
  display:flex;
  justify-content:center;
  gap:calc(var(--dot) * 6);
  z-index:7;
}
.ctl{
  background:transparent !important;
  color:#f8f8f8 !important;
  border:var(--dot) solid #f8f8f8 !important;
  box-shadow:var(--dot) var(--dot) 0 #1c2030, inset var(--dot) var(--dot) 0 #1c2030 !important;
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
  font-size:calc(var(--dot) * 8) !important;
  padding:calc(var(--dot) * 2) calc(var(--dot) * 6) !important;
  animation:none !important;
  line-height:1.2;
}
.ctl.vol{
  width:calc(var(--dot) * 16);
  height:calc(var(--dot) * 16);
  padding:0 !important;
  display:flex;
  align-items:center;
  justify-content:center;
}
.ctl.vol svg{
  width:calc(var(--dot) * 12);
  height:calc(var(--dot) * 12);
  fill:#f8f8f8;
  filter:drop-shadow(var(--dot) var(--dot) 0 #1c2030);
}
.ctl:active{ transform:translate(var(--dot), var(--dot)); }
/* ポーズボタン：ゲーム画面の上の真ん中（ハート列と時計のすきま） */
.pausebtn{
  position:absolute; right:3%; top:calc(var(--dot) * 28);   /* 右上：時刻の下に右寄せ（週があるときは JS で1行下げる） */
  width:calc(var(--dot) * 12); height:calc(var(--dot) * 12);
  padding:0 !important; display:flex; align-items:center; justify-content:center; z-index:10;
}
.pausebtn.on{ background:#f8f8f8 !important; }
.cambtn{ top:calc(var(--dot) * 44); }
.cammenu{ z-index:11; }
.cambox{ display:flex; flex-direction:column; align-items:center; gap:calc(var(--dot) * 6); font-size:calc(var(--dot) * 8);
  border:var(--dot) solid #f8f8f8; box-shadow:var(--dot) var(--dot) 0 #1c2030; padding:calc(var(--dot) * 8) calc(var(--dot) * 12); }
.camrow{ display:flex; align-items:center; gap:calc(var(--dot) * 6); }
/* UI スイッチ：つまみはいつも白。オン＝つまみが右で、あいた左側も白／オフ＝つまみが左で、あいた右側は透明 */
.camsw{
  position:relative; width:calc(var(--dot) * 16) !important; height:calc(var(--dot) * 12) !important; padding:0 !important;
  background:transparent !important; border:var(--dot) solid #f8f8f8 !important; box-shadow:var(--dot) var(--dot) 0 #1c2030 !important;
  animation:none !important; cursor:pointer;
}
.camsw i{
  position:absolute; top:calc(var(--dot) * 1); left:calc(var(--dot) * 1);
  width:calc(var(--dot) * 4); height:calc(var(--dot) * 8); box-sizing:border-box;
  background:#f8f8f8;
}
.camsw::before{ content:""; position:absolute; inset:var(--dot); background:transparent; }   /* 枠の内側は1ドットあける */
.camsw.on::before{ background:#f8f8f8; }
.camsw.on i{ box-shadow:0 0 0 var(--dot) #1c2030; }   /* 白どうしでもつまみが見えるように、ふちだけ濃い色 */
.camsw.on i{ left:calc(var(--dot) * 9); }   /* メニューの下：スクショ（カメラ） */
.camflash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:20; }
.camflash.go{ animation:camflash .35s steps(4, end) forwards; }
@keyframes camflash{ 0%{ opacity:.85; } 100%{ opacity:0; } }
.pausebtn.on svg{ fill:#1c2030; filter:none; }
.pausebtn svg, .volopt svg{ width:calc(var(--dot) * 8); height:calc(var(--dot) * 8); fill:#f8f8f8; filter:drop-shadow(var(--dot) var(--dot) 0 #1c2030); display:block; }
.pausemenu{
  position:absolute; inset:0; background:rgba(16,18,28,.86);   /* 後ろのセリフ枠などが透けて見えにくい濃さ */
  display:flex; align-items:center; justify-content:center;
  color:#f8f8f8; z-index:8; padding-top:calc(var(--dot) * 10);
}
.pausemenu.hidden{ display:none; }
/* 交換画面 */
.xchg{
  position:absolute; inset:0; z-index:12; background:rgba(16,18,28,.72);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--dot) * 2);
  color:#f8f8f8; font-size:calc(var(--dot) * 8);
}
.xchg .xtext{ gap:calc(var(--dot) * 1); margin-bottom:calc(var(--dot) * 1); }
.xcost{ position:absolute; right:calc(var(--dot) * 2); bottom:calc(var(--dot) * 1); line-height:1; }   /* 必要なメダル（右下） */
.xgot{ position:absolute; left:0; right:0; bottom:calc(var(--dot) * 2); text-align:center; }
.xchg.hidden{ display:none; }
.xrow{ display:flex; align-items:center; gap:calc(var(--dot) * 6); }
.xbox{ position:relative; }
.xbox .hp{ position:absolute; top:calc(var(--dot) * 3); left:0; right:0; text-align:center; color:#f8f8f8; } .xbox .hp b{ color:#ff6a6a; font-weight:400; }
.xbox > svg{ margin-top:0; }
.xbox{
  width:calc(var(--dot) * 54); height:calc(var(--dot) * 46); flex-direction:column; gap:calc(var(--dot) * 2); color:#f8f8f8; font-size:calc(var(--dot) * 8) !important; line-height:1.3; text-shadow:var(--dot) var(--dot) 0 #1c2030; padding:0 !important;
  background:rgba(255,255,255,.08) !important; border:var(--dot) solid #a8b0bc !important;
  box-shadow:var(--dot) var(--dot) 0 #1c2030 !important; animation:none !important;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.xbox.sel{ border-color:#f8d030 !important; background:rgba(248,208,48,.18) !important; outline:var(--dot) solid #f8d030; }
.xbox.off{ opacity:.28; cursor:default; }
.xbox svg, .xpop svg{ display:block; }
.xtext{ display:flex; flex-direction:column; align-items:center; gap:calc(var(--dot) * 4); text-align:center; line-height:1.5; }
/* アイコン列の下：左寄せ←、右寄せ→（操作説明を兼ねる） */
.xarrows{ width:calc(var(--dot) * 174); display:flex; justify-content:space-between; margin-top:calc(var(--dot) * -2); }
/* ゲームオーバー時の「結果をシェア」：画面の左下すみ */
.sharebar{ position:absolute; left:calc(var(--dot) * 4); bottom:calc(var(--dot) * 4); z-index:7; display:flex; gap:calc(var(--dot) * 4); }
.sharebar.hidden{ display:none; }
.sharebar.right{ left:auto; right:calc(var(--dot) * 4); }   /* ゲームオーバー：右下に「タイトルへ」 */
.overlay.over #start{ display:none; }
.overlay.over .card{ transform:translateY(calc(var(--dot) * 8)) !important; }   /* ゲームオーバー：ボタンが下に移ったぶん文字を上げて、下のボタンとかぶらないように */
.screen.over .medalstack{ bottom:calc(var(--dot) * 22); }   /* 右下のボタンの上によける */
.sharebtn{
  background:transparent !important; color:#f8f8f8 !important;
  border:var(--dot) solid #f8f8f8 !important; padding:calc(var(--dot) * 2) calc(var(--dot) * 4) !important;
  box-shadow:var(--dot) var(--dot) 0 #1c2030, inset var(--dot) var(--dot) 0 #1c2030 !important;
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
  font-size:calc(var(--dot) * 8) !important; line-height:1.2; cursor:pointer; animation:none !important;
}
.sharebtn:active{ transform:translate(var(--dot), var(--dot)); }

.xgot{ min-height:calc(var(--dot) * 10); color:#f8d030; }
.xpop{ position:absolute; pointer-events:none; transform:translate(-50%, -50%); }
.xpop.go{ animation:xpop 1.2s steps(12, end) forwards; }
@keyframes xpop{
  0%  { transform:translate(-50%, -50%) scale(1); opacity:1; }
  40% { transform:translate(-50%, calc(-50% - var(--dot) * 30)) scale(1.3); opacity:1; }
  80% { transform:translate(-50%, calc(-50% - var(--dot) * 34)) scale(1.3); opacity:1; }
  100%{ transform:translate(-50%, calc(-50% - var(--dot) * 34)) scale(1.3); opacity:0; }
}
.pmbox{ display:flex; gap:calc(var(--dot) * 6); align-items:stretch; height:calc(var(--dot) * 96); }
.pmtabs{ display:flex; flex-direction:column; gap:calc(var(--dot) * 4); width:calc(var(--dot) * 56); }
.pmtab, .pmclose{ width:100%; padding:calc(var(--dot) * 3) 0 !important; }
.pmclose{ margin-top:auto; }   /* 項目の下（一番下）に「とじる」 */
.pmtab.on{ background:#f8f8f8 !important; color:#1c2030 !important; text-shadow:none !important; }
.pmbody{
  width:calc(var(--dot) * 150); border:var(--dot) solid #f8f8f8; box-shadow:var(--dot) var(--dot) 0 #1c2030;
  padding:calc(var(--dot) * 6); font-size:calc(var(--dot) * 8); box-sizing:border-box;
}
.pmpane{ display:none; height:100%; }
.pmpane.on{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--dot) * 6); }
.pmpane .reclist{ font-size:calc(var(--dot) * 8); line-height:1.6; margin:0; padding:0; list-style:none; text-align:left; }
.pmq{ margin:0; text-align:center; line-height:1.6; }
.pmsub{ color:#c8ccd8; }
.volopts{ display:flex; align-items:center; gap:calc(var(--dot) * 3); }
.volbar{ display:flex; align-items:flex-end; gap:var(--dot); height:calc(var(--dot) * 14); }
.volseg{
  width:calc(var(--dot) * 5); padding:0 !important; border:var(--dot) solid #f8f8f8 !important;
  background:transparent !important; box-shadow:var(--dot) var(--dot) 0 #1c2030 !important; animation:none !important;
}
.volseg.on{ background:#f8f8f8 !important; }
.volseg:nth-child(1){ height:calc(var(--dot) * 5); } .volseg:nth-child(2){ height:calc(var(--dot) * 6); }
.volseg:nth-child(3){ height:calc(var(--dot) * 7); } .volseg:nth-child(4){ height:calc(var(--dot) * 8); }
.volseg:nth-child(5){ height:calc(var(--dot) * 9); } .volseg:nth-child(6){ height:calc(var(--dot) * 10); }
.volseg:nth-child(7){ height:calc(var(--dot) * 11); } .volseg:nth-child(8){ height:calc(var(--dot) * 12); }
.volseg:nth-child(9){ height:calc(var(--dot) * 13); } .volseg:nth-child(10){ height:calc(var(--dot) * 14); }
.volopt{ width:calc(var(--dot) * 14); height:calc(var(--dot) * 14); padding:0 !important; display:flex; align-items:center; justify-content:center; }
.volopt.on{ background:#f8f8f8 !important; }
.volopt.on svg{ fill:#1c2030; filter:none; }
/* 遊び方：タイトルだけ */

/* 記録（ポーズ中）：半透明の黒の上に上位5件 */
.recpanel{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:calc(var(--dot) * 4);
  color:#f8f8f8;
  z-index:9;   /* ポーズメニューより手前 */
}
.recpanel .rectitle{ font-size:calc(var(--dot) * 16); }
.recpanel .reclist{ font-size:calc(var(--dot) * 8); line-height:1.6; margin:0; padding:0; list-style:none; text-align:left; }
.recpanel .rechint{ font-size:calc(var(--dot) * 8); color:#c8ccd8; }
.recpanel.hidden{ display:none; }
/* ポーズ中は画面内のアニメーションも止める */
.screen.paused .headpop, .screen.paused .hurrypop, .screen.paused .popup{ animation-play-state:paused !important; }
.help{
  text-align:center;
  margin-top:8px;
  color:#a8b0bc;
  font-size:15px;
}
.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
}
.overlay.clear{ background:transparent; }
/* タイトル画面：ウィンドウを使わず、背景の上に文字を直接のせる */
.overlay{ background:transparent !important; pointer-events:none; }
.overlay button{ pointer-events:auto; }
.overlay .card{ background:transparent; border:0; box-shadow:none; width:auto; }
/* 結果画面は左上のセリフウィンドウと重ならないよう少し下げる */
.overlay:not(.menu) .card{ transform:translateY(calc(var(--dot) * 24)); padding:0; }   /* 左上のセリフ枠とハート列の下、道の上あたりに */
.overlay:not(.menu) .card h1{ margin-bottom:calc(var(--dot) * 3) !important; }
.overlay .card p{ margin:calc(var(--dot) * 3) 0 calc(var(--dot) * 4) !important; }
.overlay .card p{
  color:#f8f8f8;
  font-size:calc(var(--dot) * 8) !important;
  line-height:1.6;
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
}
.overlay .card h1{
  font-size:calc(var(--dot) * 24) !important;
  color:#f8f8f8;
  margin:0 0 calc(var(--dot) * 10);
  text-shadow:calc(var(--dot) * 2) calc(var(--dot) * 2) 0 #1c2030, calc(var(--dot) * -2) 0 0 #1c2030, calc(var(--dot) * 2) 0 0 #1c2030, 0 calc(var(--dot) * -2) 0 #1c2030, 0 calc(var(--dot) * 2) 0 #1c2030;
}
.overlay button{
  background:transparent;
  box-shadow:none;
  color:#f8f8f8;
  font-size:calc(var(--dot) * 8) !important;
  text-shadow:var(--dot) var(--dot) 0 #1c2030, calc(var(--dot) * -1) 0 0 #1c2030, var(--dot) 0 0 #1c2030, 0 calc(var(--dot) * -1) 0 #1c2030, 0 var(--dot) 0 #1c2030;
  animation:blink 1.2s steps(1, end) infinite;
}
/* 週クリア：タイトルとボタンを大きく（上のUIに重なってもよい） */
.overlay.weekend .card{ transform:translateY(calc(var(--dot) * 10)) !important; }
.overlay.weekend .card h1{ font-size:calc(var(--dot) * var(--tsize, 40)) !important; white-space:nowrap; }
.overlay.weekend button{ font-size:calc(var(--dot) * 16) !important; }
@keyframes blink{ 0%{ opacity:1; } 60%{ opacity:0; } 100%{ opacity:0; } }
.card{
  width:min(480px,90vw);
  background:#1c2030;
  border:6px solid #f8f8f8;
  box-shadow:0 0 0 6px #1c2030;
  padding:28px;
  text-align:center;
}
.card h1{ margin:0 0 10px; font-size:36px; font-weight:400; }
.card p:empty{ display:none; }
.card p{ line-height:1.8; color:#d0d4dc; }
button{
  font-family:inherit;
  border:0;
  padding:12px 34px;
  font-size:20px;
  background:#f8d030;
  color:#1c2030;
  cursor:pointer;
  box-shadow:4px 4px 0 #806018;
}
button:disabled{ opacity:.4; cursor:default; }
button:active{ transform:translate(4px,4px); box-shadow:none; }

/* ゲーム画面内の文字：8ドット＝1文字 */
.hud, .daylabel, .lifelabel, .hurrypop, .meter, .speedo, .boostlabel, .headpop, .msgwin{ font-size:calc(var(--dot) * 8); line-height:1.2; }
.popup{ font-size:calc(var(--dot) * 16); line-height:1.2; }
.header{ font-size:var(--ui); display:flex; justify-content:space-between; align-items:center; line-height:1.2; gap:1em; }
.header{ overflow:hidden; }
.header .hint{ flex:1; min-width:0; text-align:left; color:#a8b0bc; font-size:.7em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

#bestLabel{ white-space:nowrap; }
.ctl.vol{
  width:calc(var(--dot) * 16);
  height:calc(var(--dot) * 16);
  padding:0 !important;
  display:flex;
  align-items:center;
  justify-content:center;
}
.ctl.vol svg{
  width:calc(var(--dot) * 12);
  height:calc(var(--dot) * 12);
  fill:#f8f8f8;
  filter:drop-shadow(var(--dot) var(--dot) 0 #1c2030);
}
.ctl:active{ transform:translate(var(--dot), var(--dot)); }
/* 記録（ポーズ中）：半透明の黒の上に上位5件 */
.recpanel{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:calc(var(--dot) * 4);
  color:#f8f8f8;
  z-index:9;   /* ポーズメニューより手前 */
}
.recpanel .rectitle{ font-size:calc(var(--dot) * 16); }
.recpanel .reclist{ font-size:calc(var(--dot) * 8); line-height:1.6; margin:0; padding:0; list-style:none; text-align:left; }
.recpanel .rechint{ font-size:calc(var(--dot) * 8); color:#c8ccd8; }
.recpanel.hidden{ display:none; }
/* ポーズ中は画面内のアニメーションも止める */
.screen.paused .headpop, .screen.paused .hurrypop, .screen.paused .popup{ animation-play-state:paused !important; }
.help{ font-size:var(--ui); }
.card p{ font-size:var(--ui); }
.card h1{ font-size:calc(var(--ui) * 2) !important; }
button{ font-size:var(--ui) !important; }
.hidden{display:none}
</style>
</head>

<body>

<div class="game-wrap" id="wrap">
  <div class="header"><span class="hint">Space/タップ ジャンプ</span><span id="bestLabel">Best: -</span></div>
  <div class="screen">
    <canvas id="game" width="264" height="144"></canvas>
    <!-- 画面下中央のポーズボタン（左右どちらの手でも押せる）。ほかの場所はどこをタップしてもジャンプ -->
    <button class="ctl icon pausebtn" id="btnPause" aria-label="メニュー"></button>
    <button class="ctl icon pausebtn cambtn" id="btnCam" aria-label="スクリーンショット"><svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path d="M2 1h4v1H2z M0 2h8v1H0z M0 3h2v1H0z M6 3h2v1H6z M0 4h1v1H0z M3 4h2v1H3z M7 4h1v1H7z M0 5h1v1H0z M3 5h2v1H3z M7 5h1v1H7z M0 6h2v1H0z M6 6h2v1H6z M0 7h8v1H0z" /></svg></button>
    <div class="camflash" id="camFlash"></div>
    <!-- カメラ：確認（ゲームはポーズ） -->
    <div class="pausemenu cammenu hidden" id="camMenu">
      <div class="cambox outline">
        <p class="pmq">スクリーンショットをとりますか？</p>
        <div class="camrow"><button class="ctl" id="camYes">はい</button><button class="ctl" id="camNo">いいえ</button></div>
        <div class="camrow">UI <button class="camsw" id="camUI" aria-label="UI"><i></i></button></div>
      </div>
    </div>
    <div class="daylabel outline hidden" id="dayLabel">1日目</div>
    <div class="lifelabel outline hidden" id="lifeLabel"></div>
    <div class="meter outline hidden" id="meter"><svg class="arrow" viewBox="0 0 9 9" shape-rendering="crispEdges"><path d="M0 3h4V0h1v1h1v1h1v1h1v1h1v1H8v1H7v1H6v1H5v1H4V6H0z"/></svg><span><span class="num" id="meterNum">400</span>m</span></div>
    <div class="hud outline hidden" id="hud"></div>
    <div class="popup outline" id="popup"></div>
    <div class="headpop outline" id="headpop"></div>
    <div class="headpop outline" id="teacherpop"></div>
    <div class="medalpop hidden" id="medalpop"></div>
    <div class="medalstack" id="medalStack"></div>
    <div class="headpop outline" id="dmgpop"></div>
    <div class="umbstars outline" id="umbStars"></div>
    <div class="umbstars outline" id="bikeStars"></div>
    <div class="headpop outline" id="usepop"></div>
    <div class="headpop outline" id="healpop"></div>
    <div class="headpop outline" id="slowpop"></div>
    <div class="headpop outline" id="wapopL"></div>
    <div class="headpop outline" id="wapopR"></div>
    <div class="headpop outline" id="elderpop"></div>
    <div class="boostlabel outline hidden" id="boostLabel">BOOST!</div>
    <div class="speedo outline hidden" id="speedo">SPEED ×1.00</div>
    <div class="hurrypop outline" id="hurry">いそげ！</div>
    <div class="daybanner" id="dayBanner"></div>
    <div class="medalmsg outline hidden" id="medalMsg">メダルをもらった！</div>

  drinkBonus:  1.00,   // エナドリ：一定時間 +1.00倍（スピード表示には足さない）

  lives:       2,      // ライフ（0でゲームオーバー。日・週をまたいで持ち越し、回復はエナドリで）
  tabbyFrom:   3,      // 茶トラが出はじめる日

};
// 日ごとの障害物の数：[1日目の数, 1日ごとの増加]（エリア分割でランダム配置）

// 週が変わるとスピードはリセットされる代わりに、障害物の総数が毎週およそ2つずつ増える
const DAY_COUNTS = {
  // コース 800m → 600m に合わせて、密度が変わらないよう 0.71倍（障害物を置ける区間の長さの比）
  cats:    [3.2, 0.53, 1.07],
  crows:   [1.07, 0.32, 0.36],
  melons:  [0.6, 0.25, 0.3],   // 夏だけ：転がってくるスイカ
  puddles: [1.07, 0.32, 0.36],
  bananas: [1.07, 0.27, 0.36],
};
function countFor(key){
  const [b, incDay, incWeek] = DAY_COUNTS[key];
  return Math.floor(b + incDay * (day - 1) + incWeek * (week - 1));
}
const COURSE = Math.round(CONFIG.courseMeters * CONFIG.sectionLen / 100);
const pxPerMeter = CONFIG.sectionLen / 100;
const RUN_CAT_EXTRA = 0.36;   // 走る猫の追加スピード
const TABBY_EXTRA = 0;        // 茶トラはその場でぴょんぴょん跳ねる（地面と一緒に流れてくる）
// 茶トラのジャンプ（ぴょんぴょん跳ね続ける）
const TABBY_HOP = { v0:3.1, g:0.09, air:69, rest:10 };   // 大きく高く跳ぶ（最高で約53ドット、女の子の頭よりずっと上）
function tabbyLift(t){
  const k = t % (TABBY_HOP.air + TABBY_HOP.rest);
  if(k >= TABBY_HOP.air) return 0;
  return Math.max(0, TABBY_HOP.v0 * k - TABBY_HOP.g / 2 * k * k);

// 拡大率を「デバイスピクセル単位の整数」にする（ドット幅が1つ1つズレないように）

fitScreen();


// =====================================================
//  8bit BGM & SE（Web Audio API）
// =====================================================
let audioCtx = null;
let bgmInterval = null;
let isBgmPlaying = false;

// 音階テーブル (Hz)
const N = {
  C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77,
  C6:1046.50, D6:1174.66, E6:1318.51,
  _:0
};

const bgmMelody = [
  // Aメロ：焦りつつ元気なフレーズ
  N.E5, N.G5, N.A5, N.G5,  N.E5, N.D5, N.C4, N.D4,
  N.E5, N.E5, N.D5, N.C4,  N.D5, N._,  N.G4, N._,
  N.E5, N.G5, N.A5, N.G5,  N.C5, N.D5, N.E5, N.D5,
  N.C5, N.A4, N.G4, N.A4,  N.C5, N._,  N._,  N._,
  // Bメロ：コード展開で躍動感
  N.A5, N.A5, N.G5, N.F5,  N.E5, N.F5, N.G5, N.E5,
  N.D5, N.D5, N.C5, N.D5,  N.E5, N.D5, N.C5, N.G4,
  N.A5, N.A5, N.G5, N.F5,  N.E5, N.G5, N.C6, N.B5,
  N.A5, N.G5, N.F5, N.D5,  N.C5, N._,  N._,  N._
];

const bgmBass = [
  N.C3, N._, N.C3, N._,  N.G3, N._, N.G3, N._,
  N.A3, N._, N.A3, N._,  N.F3, N._, N.F3, N._,
  N.C3, N._, N.C3, N._,  N.G3, N._, N.G3, N._,
  N.F3, N._, N.G3, N._,  N.C3, N._, N.C3, N._,
  N.F3, N._, N.F3, N._,  N.C3, N._, N.C3, N._,
  N.G3, N._, N.G3, N._,  N.A3, N._, N.A3, N._,
  N.F3, N._, N.F3, N._,  N.E3, N._, N.A3, N._,
  N.D3, N._, N.G3, N._,  N.C3, N._, N.C3, N._
];

// 音量：最大 → 無音 → 1 → 2 → 最大 の順に切り替え（全部の音がマスター音量を通る）
const VOL_STEPS = 10;   // 音量バーの目盛り（0＝無音〜10＝最大）
let volStep = VOL_STEPS;
const volGain = () => volStep / VOL_STEPS;
let masterGain = null;
function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = volGain();
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
}
function outNode(){ return masterGain || audioCtx.destination; }

function playNote(freq, type, duration, vol=0.08){
  if(!audioCtx || !freq) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(outNode());
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playNoise(duration, vol=0.03){
  if(!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  noise.connect(gain);
  gain.connect(outNode());
  noise.start();
}

let bgmStep = 0;
function startBGM(fromStart = true){
  initAudio();
  stopBGM();
  if(fromStart) bgmStep = 0;
  // 1ステップのミリ秒：通常 120、無敵中は速く
  isBgmPlaying = true;
  let acc = 120, prev = performance.now();
  bgmInterval = setInterval(() => {
    if(!isBgmPlaying) return;
    const now = performance.now();
    acc += Math.min(now - prev, 200); prev = now;
    const fast = starT > 0;
    const tempo = fast ? 75 : 120;
    if(acc < tempo) return;
    acc = Math.min(acc - tempo, tempo);
    const k = tempo / 120;
    const step = bgmStep;
    const mFreq = bgmMelody[step % bgmMelody.length];
    if(mFreq > 0) playNote(mFreq, "square", 0.11 * k, 0.06);      // メロディ（矩形波）
    const bFreq = bgmBass[step % bgmBass.length];
    if(bFreq > 0) playNote(bFreq, "triangle", 0.15 * k, 0.12);    // ベース（三角波）
    if(step % 2 === 0) playNoise(0.03, 0.02);                 // ハイハット
    if(step % 4 === 2) playNoise(0.08 * k, 0.05);             // スネア風
    bgmStep++;
  }, 10);
}

function stopBGM(){
  isBgmPlaying = false;
  if(bgmInterval){
    clearInterval(bgmInterval);
    bgmInterval = null;
  }
}

  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
  osc.connect(gain);
  gain.connect(outNode());
  osc.start();
  osc.stop(audioCtx.currentTime + 0.12);
}

function playClearMusic(){

    [N.C5, 0.00, 0.12, "square"],
    [N.E5, 0.12, 0.12, "square"],
    [N.G5, 0.24, 0.12, "square"],
    [N.C6, 0.36, 0.40, "square"],
    [N.G5, 0.76, 0.12, "square"],
    [N.C6, 0.88, 0.60, "square"],
    // ハーモニー（ベース音）
    [N.C4, 0.00, 0.48, "triangle"],
    [N.G3, 0.36, 0.35, "triangle"],
    [N.C4, 0.76, 0.70, "triangle"],
  ];

}

// ダメージ音（ファミコンっぽい「ビビッ」＋ノイズ）
function playDamageSE(){

  gain.connect(outNode());
  osc.start(t);
  osc.stop(t + steps.length * 0.03);

// ===== 季節（4週ごと：春→夏→秋→冬）=====
// 春：学校に近づく後半に桜並木と舞い散る花びら／夏：青い空と、手前の花壇にひまわり（秋・冬はまだ）
const BASE_PAL = Object.assign({}, PAL);
const SEASON_PAL = [
  {},                                                                    // 春：いつもの色
  { sky:"#7cc6f2", cloud:"#f2fafe", hill:"#8cc4e2", farHouse:"#86bcdc", tree:"#5fa274", verge:"#5c9a58", leaf:"#4a8046" },   // 夏：青い空
];
const seasonOf = w => Math.floor((w - 1) / 4) % 4;   // 0 春 / 1 夏 / 2 秋 / 3 冬
let season = 0;
function applySeason(w){
  season = seasonOf(w);
  Object.assign(PAL, BASE_PAL, SEASON_PAL[season] || {});
  // 春の第3週（アジサイ・梅雨）はくもり空
  if(season === 0 && (w - 1) % 4 === 2) Object.assign(PAL, { sky:"#c3cbd3", cloud:"#d6dbe0", hill:"#b2bcc5", farHouse:"#a9b5bf" });
}
// 並木：スタート時はキャラの少し後ろに1本（電柱と同じ速さで流れる）、学校の前に3本（学校と一緒に流れる）
// まず葉も花もない「幹と枝」を作り、季節ごとに上から 桜／緑の葉／紅葉／枯れ木 をのせる（いまは春・夏）
// 形：短く太い幹から枝が扇のように広がり、その上に横長のドーム状に花や葉がつく。枝先はかならずドームの内側
const SAKURA_FACTOR = .6;
const TREE_TRUNK = { trunk:"#7e6052", dark:"#5f463c" };   // ファミコン風：幹もベース色＋影色の2色
const FOLIAGE = [
  // 春：桜
  // ファミコン風に色数をしぼる：ベース色＋影色（春は＋αで白い花）
  { base:"#f2c2d0", shade:"#df9fb4", accent:"#fff3f7" },
  // 夏：緑の葉
  { base:"#6fac62", shade:"#4c8846" },
];
const TRUNK_TOP = 60, CROWN_CY = 37, CROWN_RX = 40, CROWN_RY = 25, TREE_OX = 52, TREE_H = 90;
let sakura = [], petals = [];   // sakura＝並木（名前は春から）
function seeded(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// 幹と枝（葉も花もない木）。形と比率はユーザーの下絵にならう：
// 長めの幹が少しくねって半分くらいの高さで分かれ、左は横へ張ってから上へ、真ん中は上へ、右は横へ張ってから上へ。枝はところどころ折れ曲がる
const TREE_LIMBS = [
  // [点の列（分かれ目からの相対）, 太さ(元→先), 奥の枝か]
  { pts:[[0,0],[-11,-7],[-24,-12],[-29,-19],[-31,-26]], w:[4,2], back:false },   // 左：横に張って上へ
  { pts:[[0,0],[-5,-14],[-11,-26],[-13,-38]],            w:[4,1], back:false },   // 左上：まっすぐ上へ
  { pts:[[0,0],[2,-13],[0,-26],[3,-36]],                 w:[3,1], back:true  },   // 真ん中（奥）
  { pts:[[0,0],[9,-5],[19,-7],[24,-18],[31,-28]],        w:[4,2], back:false },   // 右：横に張って上へ
  { pts:[[19,-7],[28,-12],[35,-18]],                     w:[3,1], back:true  },   // 右の外（奥）
];
const TREE_SPLIT = { x:1, y:60 };
function makeTree(anchor, fixedSeed){
  const seed = fixedSeed != null ? fixedSeed : Math.floor(Math.random() * 1e9), rnd = seeded(seed);
  const rr = (a, b) => a + rnd() * (b - a);
  const flip = rnd() < .5 ? -1 : 1;   // 左右反転で変化をつける（光は右上から固定）
  // 花・葉の塊：大小の丸を重ねた形（上は右寄りに盛り上がり、下は左右がふくらんで真ん中が少しあく）
  const lobes = [
    [4, 24, 16], [15, 18, 12], [-9, 27, 13], [-22, 39, 11], [-25, 50, 8], [23, 37, 12],
    [27, 49, 8], [1, 40, 13], [-12, 50, 8], [13, 50, 8], [-2, 14, 9],
  ].map(([x, y, r]) => ({ x:(x + rr(-2, 2)) * flip, y:y + rr(-2, 2), r:r + rr(-1.5, 1.5) }));
  // 枝先・小枝の先は塊の内側（少し内寄り）におさめる
  const covered = (x, y) => lobes.some(l => (x * flip - l.x * flip) ** 2 + (y - l.y) ** 2 <= (l.r - 2) ** 2);
  const segs = [];
  const J = () => rr(-2, 2);
  // 幹：根元から少しくねって分かれ目へ（太い→やや細い）
  const trunk = [[0, 87], [J() * .5 - 1, 77], [1 + J() * .5, 68], [TREE_SPLIT.x, TREE_SPLIT.y]];
  for(let i = 0; i < trunk.length - 1; i++) segs.push({ x0:trunk[i][0] * flip, y0:trunk[i][1], x1:trunk[i + 1][0] * flip, y1:trunk[i + 1][1], w:8 - i, back:false, trunk:true });
  TREE_LIMBS.forEach(L => {
    const pts = L.pts.map(([x, y], i) => i === 0 ? [x, y] : [x + J(), y + J()]);
    const last = pts[pts.length - 1], prev = pts[pts.length - 2];
    for(let k = 0; k < 10 && !covered((TREE_SPLIT.x + last[0]) * flip, TREE_SPLIT.y + last[1]); k++){ last[0] += (prev[0] - last[0]) * .2; last[1] += (prev[1] - last[1]) * .2; }
    const n = pts.length - 1;
    for(let i = 0; i < n; i++){
      const w = Math.max(1, Math.round(L.w[0] + (L.w[1] - L.w[0]) * i / Math.max(1, n - 1)));
      segs.push({ x0:(TREE_SPLIT.x + pts[i][0]) * flip, y0:TREE_SPLIT.y + pts[i][1], x1:(TREE_SPLIT.x + pts[i + 1][0]) * flip, y1:TREE_SPLIT.y + pts[i + 1][1], w, back:L.back });
    }
    // 小枝：途中の折れ目から短く
    for(let i = 1; i < n; i++) if(rnd() < .45){
      const [px, py] = pts[i], dir = px < 0 ? -1 : 1;
      const ex = px + dir * rr(3, 6), ey = py - rr(3, 6);
      if(!covered((TREE_SPLIT.x + ex) * flip, TREE_SPLIT.y + ey)) continue;
      segs.push({ x0:(TREE_SPLIT.x + px) * flip, y0:TREE_SPLIT.y + py, x1:(TREE_SPLIT.x + ex) * flip, y1:TREE_SPLIT.y + ey, w:1, back:L.back });
    }
  });
  const clumps = [];
  for(let i = 0; i < 40; i++){ const l = lobes[Math.floor(rnd() * lobes.length)]; clumps.push({ x:l.x + rr(-l.r, l.r) * .7, y:l.y + rr(-l.r, l.r) * .7 }); }
  const t = Object.assign({ seed, segs, lobes, clumps }, anchor);
  t.cv = renderTree(t, treeFoliage());
  return t;
}
// 幹と枝の上に、季節の花や葉をのせて1枚の絵にする（毎フレームは貼るだけ）。FOLIAGE がない季節は枯れ木
function renderTree(t, sea){
  const rnd = seeded(t.seed + 7), rr = (a, b) => a + rnd() * (b - a), ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const cv = document.createElement("canvas"); cv.width = TREE_OX * 2; cv.height = TREE_H;
  const g = cv.getContext("2d"), X0 = TREE_OX, B = TREE_TRUNK, P = FOLIAGE[sea];
  const line = (x0, y0, x1, y1, w, col) => {
    g.fillStyle = col;
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
    for(let i = 0; i <= n; i++){
      const px = Math.round(X0 + x0 + (x1 - x0) * i / n), py = Math.round(y0 + (y1 - y0) * i / n);
      g.fillRect(px - Math.floor((w - 1) / 2), py - (w >= 3 ? 1 : 0), w, w >= 3 ? 2 : 1);   // 太い枝は縦にも厚く
    }
  };
  // 幹と枝は表面の模様なし。手前の枝はベース色、奥の枝は影色
  const backBranches = () => t.segs.forEach(sg => { if(sg.back) line(sg.x0, sg.y0, sg.x1, sg.y1, sg.w, B.dark); });
  const frontTree = () => {
    t.segs.forEach(sg => { if(!sg.back) line(sg.x0, sg.y0, sg.x1, sg.y1, sg.w, B.trunk); });
    g.fillStyle = B.trunk; g.fillRect(X0 - 4, 83, 9, 5);   // 根元の広がり
  };
  backBranches(); frontTree();
  if(!P) return cv;   // 枯れ木
  // 塊：2×2 ドット単位。ふちは少しだけ欠けたりはみ出したりして、でこぼこに
  const inLobes = (x, y) => t.lobes.some(l => (x - l.x) ** 2 + (y - l.y) ** 2 <= l.r * l.r);
  const cells = [];
  for(let y = 0; y < 66; y += 2) for(let x = -TREE_OX; x < TREE_OX; x += 2){
    const cx = x + 1, cy = y + 1;
    let on = inLobes(cx, cy);
    const edge = on !== inLobes(cx + 3, cy) || on !== inLobes(cx - 3, cy) || on !== inLobes(cx, cy + 3) || on !== inLobes(cx, cy - 3);
    if(edge && rnd() < .18) on = !on;
    if(on) cells.push({ x, y });
  }
  // ぽつんと離れたマスは消す（ふちが砂っぽくならないように）
  const raw = new Set(cells.map(c => c.x + "," + c.y));
  const nb = c => [[2,0],[-2,0],[0,2],[0,-2]].filter(([dx, dy]) => raw.has((c.x + dx) + "," + (c.y + dy))).length;
  for(let i = cells.length - 1; i >= 0; i--) if(nb(cells[i]) < 2) cells.splice(i, 1);
  const has = new Set(cells.map(c => c.x + "," + c.y));
  // 光は右上から：左下ほど影色。境目は影のマスをまぜる
  cells.forEach(c => {
    const k = -(c.x - 6) / 34 * .6 + (c.y - 32) / 24 * .8 + rr(-.3, .3);
    const under = !has.has(c.x + "," + (c.y + 2));
    g.fillStyle = (k > .05 || under) ? P.shade : P.base;
    g.fillRect(X0 + c.x, c.y, 2, 2);
  });
  if(P.accent){   // 春だけ：＋α の白い花（ぽつぽつ）と、下に散る花びら
    g.fillStyle = P.accent;
    cells.forEach(c => { if(rnd() < .05 && has.has((c.x - 2) + "," + c.y) && has.has((c.x + 2) + "," + c.y) && has.has(c.x + "," + (c.y - 2))) g.fillRect(X0 + c.x, c.y, 2, 2); });
    for(let i = 0; i < 5; i++) g.fillRect(X0 + ri(-16, 16) * 2, ri(31, 38) * 2, 2, 2);
  }
  return cv;
}
// 春の第3週：塀の手前に花壇が点在して、アジサイが咲く（地面と同じ速さで流れる）。形は固定
const HYD_LEAF = { base:"#5f9a56", shade:"#467a40" };
const HYD_PURPLE = { base:"#a891dc", shade:"#8670bc" };   // 紫（ほとんどこれ）
const HYD_WHITE  = { base:"#f4f2f8", shade:"#cfcadc" };   // 少しだけ白
let hydrangea = [];
// 手まりを2段に互い違いに（後ろの段が高い）。色は紫で、白はどの花壇も同じ位置（後ろの段の2つ目と、前の段のいちばん右）
function hydHeads(w, ri){
  const heads = [], back = [], front = [];
  for(let hx = 6;  hx <= w - 6; hx += 9) back.push({ dx:hx + ri(-1, 1), dy:0, r:5, c:HYD_PURPLE });
  for(let hx = 10; hx <= w - 9; hx += 9) front.push({ dx:hx + ri(-1, 1), dy:6, r:4, c:HYD_PURPLE });
  if(back.length > 1) back[1].c = HYD_WHITE;
  if(front.length) front[front.length - 1].c = HYD_WHITE;
  return heads.concat(back, front);
}
// 塀の前の花壇：位置と大きさはいつも同じ（固定）。咲く花は季節で変える
//   春の第3週＝アジサイ／それ以外＝手前の花壇と同じ小さな花（夏・秋・冬の花はまだ）
let backBedFlower = "small";
let rainZones = [];
let fenceSuns = [];   // 夏：塀の前、花壇のセットとセットのあいだに咲くひまわり（塀の上での位置、固定）   // アジサイの2つセットのまわりだけ雨（塀の上での位置。花壇より広め）
const isHydWeek = () => season === 0 && weekInSeason(week) === 2;
const FENCE_FACTOR = .6;   // 塀（layers.front）の流れる速さ
// ===== 夏：右上から差しこむ強い日差し（太陽そのものは描かない） =====
// 画面の右上の外にある一点から、左下へ広がる光の帯。1行ずつ塗るので、ふちはドットの段々になる
const SUN_RAYS = [[17.5, 20.5], [31, 34.5], [45, 47.5], [60, 64]];   // 一筋ずつ細め   // 帯の角度（度：水平から下向き）
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];   // 網掛け（4×4 のディザ）
// 画面の右上4分の1におさめる：下は画面の真ん中の高さ、左は画面の真ん中まで。そこへ向かって網掛けで消える
function drawSunRays(){
  if(season !== 1) return;
  const ox = W + 24, oy = -VIEW_OY - 34, D = Math.PI / 180;
  const top = -VIEW_OY, bottom = H / 2 - VIEW_OY, left = W / 2;
  const fadeY0 = top + (bottom - top) * .35, fadeX0 = left + (W - left) * .55;
  ctx.fillStyle = "#fff6c8";
  ctx.globalAlpha = .3 * (.85 + .15 * Math.sin(animTick * .03));
  for(let y = top; y < bottom; y++){
    const dy = y - oy;
    const fy = y < fadeY0 ? 0 : (y - fadeY0) / (bottom - fadeY0);
    const row = ((y % 4) + 4) % 4 * 4;
    SUN_RAYS.forEach(([a1, a2]) => {
      const x1 = Math.round(ox - dy / Math.tan(a1 * D)), x2 = Math.round(ox - dy / Math.tan(a2 * D));
      const xa = Math.max(left, Math.min(x1, x2)), xb = Math.min(W, Math.max(x1, x2));
      for(let x = xa; x < xb; x++){
        const fx = x >= fadeX0 ? 0 : (fadeX0 - x) / (fadeX0 - left);
        const level = Math.round(16 * (1 - Math.min(1, Math.max(fx, fy))));   // 残す割合（0〜16）
        if(BAYER4[row + (x & 3)] < level) ctx.fillRect(x, y, 1, 1);
      }
    });
  }
  ctx.globalAlpha = 1;
}
// ===== アジサイのまわりの雨 =====
const RAIN_COL = "#9cb4cc";
const rainX0 = z => Math.round(z.x0 - worldOffset * FENCE_FACTOR);
function inRainNow(){
  const px = player.x + 6;
  return rainZones.some(z => { const a = rainX0(z); return px >= a && px <= a + (z.x1 - z.x0); });
}
function updateRain(){
  // 雨粒：ゾーンごとに、上から降って地面で小さくはねる
  rainZones.forEach(z => {
    const w = z.x1 - z.x0;
    if(!z.drops.length) for(let i = 0; i < Math.round(w / 1.4); i++) z.drops.push({ x:Math.random() * w, y:rand(-VIEW_OY - 10, 120), v:rand(2.6, 3.4), end:rand(96, 126), sp:0 });
    z.drops.forEach(d => {
      if(d.sp > 0){ if(--d.sp === 0){ d.y = rand(-VIEW_OY - 8, -VIEW_OY); d.x = Math.random() * w; d.end = rand(96, 126); } return; }
      d.y += d.v;
      if(d.y >= d.end) d.sp = 6;   // しぶき
    });
  });
  // 濡れているか（傘があれば濡れない）
  const w = isActive() && umbrella <= 0 && inRainNow();
  if(w !== wet){
    wet = w; setSpeed();
    if(wet) popAt("slowpop", "SLOW", "down", player.x + 6, player.y - 12);   // 雨に濡れはじめたら「SLOW」
    if(wet && npcLineT === 0 && girlLineT === 0) girlSay("つめたいっ！", 90);   // ほかのセリフが出ているときはそちらを優先
  }
  if(wet && Math.random() < .25) particles.push({ x:player.x + rand(2, 10), y:player.y - 1, vx:rand(-.4, .4), vy:rand(-.6, -.2), life:10, c:RAIN_COL });   // 頭でしずくがはねる
}
function drawRain(){
  rainZones.forEach(z => {
    const a = rainX0(z), w = z.x1 - z.x0;
    if(a > W + 8 || a + w < -8) return;
    // 雨粒（1×3 の線）と、地面のしぶき
    ctx.fillStyle = RAIN_COL;
    z.drops.forEach(d => {
      const x = Math.round(a + d.x);
      if(d.sp > 0){ const y = Math.round(d.end); ctx.fillRect(x - 1, y - 1, 1, 1); ctx.fillRect(x + 1, y - 1, 1, 1); }
      else ctx.fillRect(x, Math.round(d.y), 1, 4);
    });
  });
}
// アジサイの花壇の真ん中に、小さなカエル（ときどきぴょんと跳ねる）
const FROG = ["K.K", "GGG", "G.G"];   // 横3×たて3：目（K）が上に飛び出した小さなカエル
const FROG_PAL = { G:"#8fd04a", K:"#1c2414" };   // 葉より明るい黄緑で目立つように
function drawFrog(cx, seed){
  // ぴょーん：軽くふわっと、アジサイの高さまで（約0.7秒で18ドット）
  const t = (animTick + seed * 37) % 170;
  const hop = t < 44 ? Math.round(Math.sin(t / 44 * Math.PI) * 18) : 0;
  const rows = hop > 0 ? FROG.slice(0, 2) : FROG;   // 跳んでいるあいだは足をたたむ
  drawSprite(rows, Math.round(cx) - 1, 95 - hop, FROG_PAL);   // 花壇の前（足もとの地面）に座る
}
function buildHydrangea(){
  hydrangea = [];
  backBedFlower = isHydWeek() ? "hyd" : "small";
  rainZones = []; fenceSuns = [];
  let prevEnd = null;
  const rnd = seeded(31415), ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const small = w => { const fl = []; for(let fx = 2; fx < w - 3; fx += ri(4, 7)) fl.push({ dx:fx, dy:ri(0, 1), c:ri(0, 2) }); return fl; };
  // 塀と同じ速さで流れる：x は「塀の上での位置」。ゴールで止まる位置（門が x=150）より手前まで
  // 2つ並んだ花壇のセット → 大きくあけて → また2つのセット
  for(let x = 150; x < (COURSE - 150) * FENCE_FACTOR - 110; ){
    let bx = x;
    if(isHydWeek()) rainZones.push({ x0:x - 64, x1:0, drops:[] });
    for(let k = 0; k < 2; k++){
      const w = ri(38, 50);
      hydrangea.push({ x:bx, w, heads:hydHeads(w, ri), small:small(w) });
      bx += w + 12;
    }
    if(isHydWeek()) rainZones[rainZones.length - 1].x1 = bx - 12 + 64;
    // 夏：ひとつ前のセットとのあいだの真ん中に、ひまわりを5本
    if(season === 1 && prevEnd != null){
      const mid = (prevEnd + x) / 2, hs = [24, 26, 18, 29, 21];   // 低い順の番号で左から 3,4,1,5,2
      hs.forEach((h, k) => fenceSuns.push({ x:mid + (k - 2) * 9, h, i:k }));
    }
    prevEnd = bx - 12;
    x = bx + ri(300, 380);
  }
  // 確定で置く花壇：校門の前に1つ、学校の敷地内に2つ（門と一緒に流れる）。3つとも同じ間隔（門柱をはさむ）
  [-46, 10, 66].forEach(off => hydrangea.push({ off, w:42, heads:hydHeads(42, ri), small:small(42) }));
}
function drawHydrangea(){
  fenceSuns.forEach(sf => {   // 塀と同じ速さで流れる
    const x = Math.round(sf.x - worldOffset * FENCE_FACTOR);

function fillPeriod(period, makeItem, gapMin, gapMax){
  const items = [];
  let x = irand(0, gapMax);
  while(true){
    const it = makeItem();
    if(x + it.w > period - gapMin) break;
    it.x = x;
    items.push(it);
    x += it.w + irand(gapMin, gapMax);
  }
  return items;
}

// ===== コース配置 =====
// コースを「頭数分のエリア」に分け、各エリアに1つだけ置く。エリア内の位置はランダム。
// s = その物が画面右端に現れるときのスクロール量
function buildCourse(){
  // 正門前の約40mは何も出さない（ゴール演出中に障害物が残らないように）
  const start = 150, end = COURSE - W - 260;
  // エリアに1つずつ、エリア内の位置は完全ランダム（種類をまたいだ調整はしない）
  // 後半ほど密に：密度がコース頭→終わりで 1 → CONFIG.lateDensity 倍に直線的に上がるようにエリアを切る
  // （後半はスピードも上がっているので、同じ間隔だと時間あたりの密度が薄く感じる）
  const rd = CONFIG.lateDensity, tot = 1 + (rd - 1) / 2;
  const edge = q => {   // 累積密度が q（0〜1）になる位置（0〜1）
    if(rd === 1) return q;
    const a = (rd - 1) / 2;   // a x² + x = q*tot を解く
    return (-1 + Math.sqrt(1 + 4 * a * q * tot)) / (2 * a);
  };
  const scatter = (n, make)=>{
    const out = [], N = Math.max(1, n);
    for(let i=0;i<n;i++){
      const a = edge(i / N), b = edge((i + 1) / N);
      out.push(Object.assign({ s: start + (a + Math.random() * (b - a)) * (end - start) }, make()));
    }
    return out;
  };

  // エナドリ：固定の一定間隔（高さはランダム）
  const cans = [];
  // 1日目（やり直し直後）は遅さがつらいので、すぐにエナドリを置く
  for(let s = start + CONFIG.canInterval / 2; s < end; s += CONFIG.canInterval){
    cans.push({ s, y: irand(56, 68) });
  }
  const n = dayIdx(week, day) + 1;   // 通しで何日目か（茶トラは第1週3日目から）
  const tabbyRate = n < CONFIG.tabbyFrom ? 0 : Math.min(CONFIG.tabbyMax, CONFIG.tabbyPerDay * (n - CONFIG.tabbyFrom + 1));
  const makeCat = ()=>{
    const r = Math.random();
    const kind = r < tabbyRate ? "tabby" : (r < tabbyRate + .2 ? "sleep" : "run");
    return { kind, sleeping: kind === "sleep",
      type: kind === "tabby" ? "tabby" : (kind === "sleep" ? "white" : "black") };   // 白猫＝寝てる、黒猫＝走る
  };
  const cats = scatter(countFor("cats"), makeCat);
  // 序盤の緊張感：最初の約150m（2エリア）に猫を1匹ずつ追加
  const OPEN = 960, openL = OPEN / 2;
  for(let i=0;i<2;i++) cats.push(Object.assign({ s: start + 120 + i*openL + Math.random()*(openL - 60) }, makeCat()));
  cats.sort((a, b) => a.s - b.s);
  const bananas = scatter(countFor("bananas"), ()=>({}));
  const crows = scatter(countFor("crows"), ()=>({ phase: Math.random() * Math.PI * 2 }));
  const puddles = season === 1 ? [] :   // 夏（日差しが強い）は水たまりなし
    scatter(Math.round(countFor("puddles") * (isHydWeek() ? CONFIG.rainPuddles : 1)), ()=>({ w:irand(16, 24) }));   // アジサイの週は水たまり多め
  const melons = season === 1 ? scatter(countFor("melons"), ()=>({})) : [];   // 夏だけ
  return { cats, cans, puddles, bananas, crows, melons };
}

let records = [];        // { idx, medals, speed, at }（ページを開いている間）
let runRecorded = false;
function addRecord(idx, speed){
  if(runRecorded) return;
  runRecorded = true;
  const d = new Date();
  records.push({ idx, medals, speed, at: `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}` });
  records.sort((a, b) => b.idx - a.idx || b.medals - a.medals || b.speed - a.speed);
  records = records.slice(0, 5);
  noteBest(idx);
}
// ベスト：日数が長い回。日数が同じならメダルが多い回
let bestMedals = 0;
function noteBest(idx){
  if(idx > bestIdx || (idx === bestIdx && medals > bestMedals)){ bestIdx = idx; bestMedals = medals; }
  updateBest();
}
const bestText = () => idxLabel(bestIdx) + (bestMedals > 0 ? "　" + medalText(bestMedals) : "");

async function takeScreenshot(){
  // 撮影メニューを開いたまま、ポーズ中のその瞬間を撮影する。

  if(!blob) return;
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const name = `chikoku-dash_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.png`;
  const file = new File([blob], name, { type:"image/png" });
  if(isTouchDevice() && navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file] }); return; }catch(e){ if(e && e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function speakerSVG(level){
  // 12×12ドット
  let r = "M1 4h2v4H1z M3 4h1v4H3z M4 3h1v6H4z M5 2h1v8H5z M6 1h1v10H6z";
  if(level === 0){
    r += " M8 4h1v1H8z M11 4h1v1h-1z M9 5h1v1H9z M10 5h1v1h-1z M9 6h2v1H9z M9 7h1v1H9z M10 7h1v1h-1z M8 8h1v1H8z M11 8h1v1h-1z";
  } else {
    if(level >= 1) r += " M8 5h1v2H8z";
    if(level >= 2) r += " M9 3h1v1H9z M10 4h1v4h-1z M9 8h1v1H9z";
    if(level >= 3) r += " M10 1h1v1h-1z M11 2h1v8h-1z M10 10h1v1h-1z";
  }
  return `<svg viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="${r}"/></svg>`;
}
// 音量タブ：［ミュートのアイコン］［■■■■■□□□□□］［最大のアイコン］。目盛りかアイコンを押して決める
function renderVolOpts(){
  const el = document.getElementById("volOpts");
  let bar = "";
  for(let k = 1; k <= VOL_STEPS; k++) bar += `<button class="volseg${k <= volStep ? " on" : ""}" data-step="${k}" aria-label="音量${k}"></button>`;
  el.innerHTML = `<button class="ctl volopt${volStep === 0 ? " on" : ""}" data-step="0" aria-label="ミュート">${speakerSVG(0)}</button>`
    + `<div class="volbar">${bar}</div>`
    + `<button class="ctl volopt${volStep === VOL_STEPS ? " on" : ""}" data-step="${VOL_STEPS}" aria-label="最大">${speakerSVG(3)}</button>`;
  el.querySelectorAll("button").forEach(b => {
    b.addEventListener("mousedown", e => e.preventDefault());
    b.addEventListener("click", () => setVolume(+b.dataset.step));
  });
}
function setVolume(step){
  volStep = step;
  if(masterGain) masterGain.gain.value = volGain();

}

function pressJump(isRepeat){
  if(recordOpen){ if(!isRepeat) closeRecords(); return; }   // 記録表示中はまず閉じる（ジャンプはしない）
  if(menuOpen || camOpen) return;   // ポーズ中は何もしない（開け閉めはポーズボタン・Esc・P）
  if(state === "playing" || state === "goal") jump();
  else if(!isRepeat) proceed();   // 押しっぱなしの連打では進まない
}
window.addEventListener("keydown", e=>{
  if(exchangeOpen){
    e.preventDefault();
    if(e.code === "ArrowLeft" || e.code === "KeyA") moveExchange(-1);
    else if(e.code === "ArrowRight" || e.code === "KeyD") moveExchange(1);
    else if(e.code === "ArrowUp" || e.code === "KeyW") moveExchangeRow(-1);
    else if(e.code === "ArrowDown" || e.code === "KeyS") moveExchangeRow(1);
    else if(e.code === "Space" && !e.repeat && xCursor) chooseExchange(xCursor);
    return;
  }
  if(camOpen){ e.preventDefault(); if(e.code === "Escape") closeCam(); return; }
  if(e.code === "Space"){
    e.preventDefault();
    pressJump(e.repeat);
  } else if(e.code === "Escape" || e.code === "KeyP"){
    togglePause();
  }
});

function jump(){
  if(rolling > 0 || melonRide) return;   // バナナで転がり中・スイカに乗っている間はジャンプできない
  if(player.jumping){
    // 空中でもう一度：その場でクルッと1回転しながら少しだけ空中に止まる（1ジャンプ1回）
    if(!player.flipped && (state === "playing" || state === "goal")){
      player.flipped = true;
      player.flip = CONFIG.flipTime;
      player.vy = 0;
      playFlipSE();
    }
    return;
  }
  playJumpSE();
  player.vy = player.jumpPower;
  player.jumping = true;
  updateHUD();
  for(let i=0;i<4;i++){
    particles.push({ x:player.x+4, y:groundY-1, vx:-rand(0,.5), vy:-rand(0,.5), life:18, c:"#a8a296" });
  }
}

function faceURL(rows, pal){
  const c = document.createElement("canvas");
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext("2d");
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if(pal[ch]){ g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
  }));
  return c.toDataURL();
}
// ブースト中の女の子の顔：20×20ドットで、オレンジの顔＋十字に光る目＋上に「BOOST」
const MINI_FONT = {   // 3×5 の小さい文字
  B:["110","101","110","101","110"], O:["010","101","101","101","010"],
  S:["011","100","010","001","110"], T:["111","010","010","010","010"],
};
function boostFaceURL(frame){
  const c = document.createElement("canvas");
  c.width = 20; c.height = 20;
  const g = c.getContext("2d");
  const pal = GIRL_PAL_BOOST;
  FACE_GIRL.forEach((row, y) => [...row].forEach((ch, x) => {
    let col = pal[ch];
    if(y === 4 && (x === 2 || x === 7)) col = pal.S;   // 目はあとで十字の光にする
    if(col){ g.fillStyle = col; g.fillRect(x * 2, y * 2, 2, 2); }
  }));
  // 目：十字に光る（2コマで大きさが変わってキラキラ）
  const arm = frame ? 3 : 2;
  [[4, 8], [14, 8]].forEach(([ex, ey]) => {
    g.fillStyle = frame ? "#ffffff" : "#fff4a0";
    g.fillRect(ex - arm, ey, 2 + arm * 2, 2);
    g.fillRect(ex, ey - arm, 2, 2 + arm * 2);
    g.fillStyle = "#ffffff";
    g.fillRect(ex, ey, 2, 2);
  });
  // 上側に「BOOST」（影つき）
  [..."BOOST"].forEach((ch, i) => {
    MINI_FONT[ch].forEach((r, yy) => [...r].forEach((b, xx) => {
      if(b !== "1") return;
      const x = i * 4 + xx, y = 1 + yy;
      g.fillStyle = "#5a1808"; g.fillRect(x + 1, y + 1, 1, 1);
    }));
  });
  [..."BOOST"].forEach((ch, i) => {
    MINI_FONT[ch].forEach((r, yy) => [...r].forEach((b, xx) => {
      if(b === "1"){ g.fillStyle = "#f8d030"; g.fillRect(i * 4 + xx, 1 + yy, 1, 1); }
    }));
  });
  return c.toDataURL();
}

const MEDAL_S = [
  ".RTR.",
  ".RTR.",
  ".RTR.",
  "..S..",
  ".YYY.",
  "YWYYY",
  "YYYYD",
  "YYYDD",

const MEDAL_L = [   // 10個ごとの大メダル（一回り大きい）
  "..RTR..",
  "..RTR..",
  "..RTR..",
  "..RTR..",
  "...S...",

];
// R 紐の赤 / T 紐の白い線 / S 銀の金具 / Y,W,D メダルの縁（明・ハイライト・影） / E,G 大メダルの中心（控えめなへこみ）
const MEDAL_PAL = { R:"#e03030", T:"#ffffff", S:"#d0d0dc", Y:"#f8d030", W:"#fff0a8", D:"#d09828", E:"#d8a828", G:"#ecc030", O:"#1c2030" };
function medalSVG(big, cls = "medal"){
  const core = Array.isArray(big) ? big : (big ? MEDAL_L : MEDAL_S), h = core.length + 2, w = core[0].length + 2;
  const at = (x, y) => y >= 0 && y < core.length && x >= 0 && x < core[0].length && core[y][x] !== ".";
  let r = "";
  for(let y = -1; y <= core.length; y++) for(let x = -1; x <= core[0].length; x++){
    let c = null;
    if(at(x, y)) c = MEDAL_PAL[core[y][x]];
    else if(at(x-1, y) || at(x+1, y) || at(x, y-1) || at(x, y+1)) c = MEDAL_PAL.O;
    if(c) r += `<rect x="${x+1}" y="${y+1}" width="1" height="1" fill="${c}"/>`;
  }
  const size = cls === "medal" ? ` style="width:calc(var(--dot) * ${w});height:calc(var(--dot) * ${h})"` : "";
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}"${size} shape-rendering="crispEdges">${r}</svg>`;
}

// 当たり判定は見た目より内側（かんたん目）
// 女の子の当たり判定。自転車のときは自転車の大きさ
function playerBox(p = player){
  if(onBike) return { x:p.x-3, y:p.y-4, w:19, h:p.h+3 };
  return { x:p.x+3, y:p.y+2, w:6, h:p.h-2 };
}
function hitPlayer(p, c){
  const a = playerBox(p);
  const b = { x:c.x+2, y:c.y+2, w:c.w-4, h:c.h-2 };
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function gateScreenX(){ return Math.round(COURSE - worldOffset); }
function doorLeft(){ return gateScreenX() + 9 - Math.round(22 * doorT); }

function spawnFromPlan(){
  const X = W + 10;
  while(planIdx.cats < plan.cats.length && worldOffset >= plan.cats[planIdx.cats].s){
    const c = plan.cats[planIdx.cats];
    const extra = c.sleeping ? 0 : (c.kind === "tabby" ? TABBY_EXTRA : RUN_CAT_EXTRA);
    // 唯一の制約：猫どうしが物理的によけられないほど詰まる時だけ少し待つ
    const arr = (X - player.x) / (speed + extra);
    if(cats.some(k => Math.abs((k.x - player.x) / (speed + (k.isStationary ? 0 : k.extra)) - arr) < 60)) break;
    planIdx.cats++;
    const h = c.sleeping ? 7 : 9;
    cats.push({ x:X, y:groundY - h, w:14, h, type:c.type, kind:c.kind, isStationary:c.sleeping, extra, age:0,
      hopT: irand(0, TABBY_HOP.air + TABBY_HOP.rest - 1) });
  }
  while(planIdx.cans < plan.cans.length && worldOffset >= plan.cans[planIdx.cans].s){
    const c = plan.cans[planIdx.cans++];
    cans.push({ x:X, y:c.y, age:0 });
  }
  while(planIdx.crows < plan.crows.length && worldOffset >= plan.crows[planIdx.crows].s){
    const c = plan.crows[planIdx.crows++];
    crows.push({ x:X, y:CROW_FLY.center, phase:c.phase, age:0 });
  }
  // スイカは後ろ（左）から来る：まず左に矢印を2回点滅させてから
  if(plan.melons && planIdx.melons < plan.melons.length && worldOffset >= plan.melons[planIdx.melons].s && melonWarn === 0 && !melons.some(m => !m.broken) && !melonRide){
    planIdx.melons++;
    melonWarn = MELON_WARN_T;
  }
  while(planIdx.bananas < plan.bananas.length && worldOffset >= plan.bananas[planIdx.bananas].s){
    planIdx.bananas++;
    bananas.push({ x:X, hit:false });
  }
  while(planIdx.puddles < plan.puddles.length && worldOffset >= plan.puddles[planIdx.puddles].s){
    const p = plan.puddles[planIdx.puddles++];
    puddles.push({ x:X, w:p.w, hit:false });
  }
}

function update(){
  const active = state === "playing" || state === "goal";

  if(active){
    animTick++;
    // 朝のひとこと
    if(animTick === 1) girlSay("ねぼうした！", 80);
    if(animTick === 80) girlSay("ちこくしちゃう！", 90);
    updateMessages();
    // おじいさんとのあいさつ
    if(elder){
      // おじいさんは奥の庭にいて流れがゆっくりなので、速く走っていても読める
      // おじいさんが先に声をかけ、女の子が「おはよー！」と返す
      if(elderTalk === 0 && animTick >= ELDER_QUIET_TICK && elder.x - player.x < 80 && elder.x > player.x - 4){
        elderTalk = 1;
        npcSay("elder", "きょうもねぼうかい？", 100);
      } else if(elderTalk >= 1 && elderTalk < 100){
        elderTalk++;
      } else if(elderTalk === 100){
        elderTalk = 1000;
        girlSay("おはよー！", 90);
      }
    }
    // 先生に近づいたら
    if(!teacherSaid && !gateClosing && gateScreenX() < W + 12 && player.x + 12 >= gateScreenX() - 16 - 24){
      teacherSaid = true;
      // 今の時刻（7:30 からの経過分）でセリフを変える
      const min = Math.floor((CONFIG.timeLimit * 60 - timeLeft) / 60 / CONFIG.secPerMinute);
      const line = min >= 15 ? "ギリギリだぞ！" : (min >= 10 ? "おはよう" : "きょうははやいな！");
      npcSay("teacher", line, 1e9);   // ゴール後もずっと残す（次の日の始まりで消える）
      if(min < 10 && lives > 0) awardMedal();   // 「きょうははやいな！」でメダル
    }
    if(!passedGate && !gateClosing){
      timeLeft--;
      if(timeLeft <= 0) timeUp();
      if(state === "gameover") return;
    }
  }
  if(gateClosing && doorT < 1) doorT = Math.min(1, doorT + 1/12);   // すぐさま閉まる
  if(blink > 0) blink--;
  if(invulT > 0) invulT--;

  if(state === "playing"){
    // エナドリ効果（空中で切れそうなら着地まで維持）
    if(boostLeft > 0){
      boostLeft--;
      if(boostLeft === 0 && player.jumping) boostLeft = 1;
    }
    if(starT > 0){
      starT--;
      if(starT === 0 && player.jumping) starT = 1;   // 空中では切らさない
      if(starT === 0) updateHUD();
      if(animTick % 3 === 0){
        particles.push({ x:player.x + rand(0, 12), y:player.y + rand(0, 15), vx:-rand(.3, 1.2), vy:-rand(0, .5), life:16, c:["#ffffff","#f8d030","#ff9030"][irand(0,2)] });
      }
    }
    if(rolling > 0){
      rolling--;
      if(rolling === 0 && lives <= 0){ lifeGameOver("banana"); return; }
    }
    // ノーミスで走り続けると永続倍率がじわじわ上がる
    else mul += CONFIG.autoUp * speed / CONFIG.sectionLen;
    setSpeed();
    worldOffset += speed;
    if(worldOffset >= COURSE - CONFIG.gateStopX){
      worldOffset = COURSE - CONFIG.gateStopX;
      state = "goal";
    }
    const sec = Math.floor(worldOffset / CONFIG.sectionLen);
    if(sec > sectionShown && sec < CONFIG.sections){
      sectionShown = sec;
      const left = Math.round((COURSE - sec * CONFIG.sectionLen) / pxPerMeter);
    }
    spawnFromPlan();
  }

  const scroll = state === "playing" ? speed : 0;

  // おじいさんは地面と一緒に流れる（セリフも一緒に動く）
  if(elder){
    elder.x -= scroll * ELDER_FACTOR;   // 奥にいるぶんゆっくり流れる
    // セリフはおじいさんの頭上に固定
    if(elder.x < -16){
      elder = null;
      document.getElementById("elderpop").className = "headpop outline";
    }
  }

  // プレイヤー
  if(active){
    if(player.flip > 0){
      player.flip--;          // 空中クルッ中はその高さで静止
      player.vy = 0;
    } else {
      player.vy += .115;
      player.y += player.vy;
    }
    if(player.y >= groundY - player.h){
      player.y = groundY - player.h;
      player.vy = 0;
      player.jumping = false;
      player.flipped = false;
      player.flip = 0;
    }
  }
  if(state === "goal"){
    // バナナで転がっている途中に正門前まで来た場合も、転がり終わりで判定する（最後のライフならゲームオーバー）
    if(rolling > 0){
      rolling--;
      if(rolling === 0 && lives <= 0){ lifeGameOver("banana"); return; }
    }
    if(lives > 0){   // やられた状態では進まない（ゴールさせない）
      player.x += Math.max(1.2, speed);
      if(!gateClosing && !passedGate && player.x + 6 > gateScreenX() + 3) passedGate = true;
      if(player.x > W + 4) gameClear();
    }
  }
  // 閉まった門扉に激突
  if(active && gateClosing && !passedGate){
    const gx = gateScreenX();
    if(gx < W + 12 && player.x + 9 >= doorLeft()) crash();
  }
  if(state === "crash") updateCrash();

  // 水たまり
  for(let i=puddles.length-1;i>=0;i--){
    const p = puddles[i];
    p.x -= scroll;
    if(p.gone){ puddles.splice(i, 1); continue; }
    if(active && !p.hit && spinUmbHit({ x:p.x, y:groundY, w:p.w, h:4 })){ knockPuddle(p); puddles.splice(i, 1); continue; }
    if(active && !p.hit && !player.jumping && starT === 0 && playerBox().x + playerBox().w > p.x + 2 && playerBox().x < p.x + p.w - 2){
      stepPuddle(p);
      if(state === "gameover") return;
    }
    if(p.x + p.w < -4) puddles.splice(i,1);
  }

  // バナナの皮
  for(let i=bananas.length-1;i>=0;i--){
    const b = bananas[i];
    if(b.knock){   // 傘で吹っ飛ばされた皮
      b.x += b.kvx; b.ky += b.kvy; b.kvy += 0.12;
      if(b.x > W + 20 || b.ky > 60) bananas.splice(i, 1);
      continue;
    }
    b.x -= scroll;
    if(active && !b.hit && spinUmbHit({ x:b.x, y:groundY - 4, w:7, h:4 })){ knockBanana(b); continue; }
    if(active && !b.hit && !player.jumping && rolling === 0 && starT === 0 && playerBox().x + playerBox().w > b.x + 1 && playerBox().x < b.x + 6){
      slipBanana(b);
    }
    if(b.x < -10) bananas.splice(i,1);
  }

  // エナドリ
  for(let i=cans.length-1;i>=0;i--){
    const can = cans[i];
    can.x -= scroll;
    can.age++;
    const bob = Math.floor(can.age / 16) % 2;
    const px = onBike ? player.x - 4 : player.x + 1, py = onBike ? player.y - 6 : player.y;
    const pw = onBike ? 20 : 10, ph = onBike ? 21 : 15;   // 自転車のときは自転車の大きさで拾う
    if(active && px < can.x + 7 && px + pw > can.x && py < can.y + bob + 9 && py + ph > can.y + bob){
      drinkCan(can);
      cans.splice(i,1);
      continue;
    }
    if(can.x < -12) cans.splice(i,1);
  }

  // スイカ（夏）：後ろから転がってきて、当たると女の子（自転車ごと）が上に乗って進む。乗っているあいだはジャンプできない
  if(active) updateMelons(scroll);

  // カラス（波型に飛んでくる）
  if(active){
    for(let i=crows.length-1;i>=0;i--){
      const c = crows[i];
      c.age++;
      if(c.knock){
        // 傘ではじかれたカラス：勢いよく吹っ飛ぶ
        c.x += c.kvx; c.y += c.kvy; c.kvy += 0.12;
        if(c.x > W + 30 || c.y < -VIEW_OY - LANE - 30 || c.y > H) crows.splice(i, 1);
        continue;
      }
      c.x -= scroll + CROW_FLY.extra;
      c.y = Math.round(CROW_FLY.center + Math.sin(c.phase + c.age * Math.PI * 2 / CROW_FLY.period) * CROW_FLY.amp);
      const a = playerBox();
      const b = { x:c.x+1, y:c.y+3, w:10, h:3 };
      const ov = (p, q) => p.x < q.x+q.w && p.x+p.w > q.x && p.y < q.y+q.h && p.y+p.h > q.y;
      // 傘を持っていれば、傘（宙返り中は回っている体全体）でもカラスを受けて吹っ飛ばす
      let umbHit = false;
      if(umbrella > 0 && rolling === 0){
        if(player.flip > 0) umbHit = ov(flipBox(), b);   // 傘の当たり判定は、宙返り（自分でアクションしたとき）だけ。歩いているだけでは何もはじかない
      }
      if(!c.hit && (invulT === 0 || player.flip > 0) && starT === 0 && umbHit){
        c.hit = true;
        umbrellaBlock();
        knockCrow(c);
      } else if(!c.hit && invulT === 0 && starT === 0 && ov(a, b)){   // 転がり中でも当たる
        c.hit = true;
        if(hitBy("crow", "カァー！じゃまだ！")) return;
      }
      if(c.x < -16) crows.splice(i,1);
    }
  }

  // 猫
  if(active){
    for(let i=cats.length-1;i>=0;i--){
      const cat = cats[i];
      cat.age++;
      if(cat.knock){   // 傘で吹っ飛ばされた猫
        cat.x += cat.kvx; cat.y += cat.kvy; cat.kvy += 0.12;
        if(cat.x > W + 30 || cat.y > H) cats.splice(i, 1);
        continue;
      }
      cat.x -= cat.isStationary ? scroll : scroll + cat.extra;
      if(cat.kind === "tabby"){
        cat.hopT++;
        cat.y = groundY - cat.h - Math.round(tabbyLift(cat.hopT));
      }
      if(!cat.hit && spinUmbHit({ x:cat.x+2, y:cat.y+2, w:cat.w-4, h:cat.h-2 })){ knockCat(cat); continue; }
      if(!cat.hit && invulT === 0 && starT === 0 && hitPlayer(player, cat)){   // 転がり中でも当たる
        cat.hit = true;
        const who = cat.kind === "tabby" ? "tabby" : cat.type;
        const line = who === "tabby" ? "どこみてんの！" : who === "white" ? "ふまないでよ！" : "……いたいんだけど";
        if(hitBy(who, line)) return;
      }
      if(cat.x < -20) cats.splice(i,1);
    }
  }

  updateParticles();
  updatePetals(scroll);
  updateRain();
  updateGhosts();
  updateFlyUmbs();
  // クリアのリザルトを2秒見せてから、交換できるなら交換画面（リザルト中1回だけ）
  if(state === "clear" && !exchangeDone && !menuOpen && ++resultT === 120 && canExchange()) openExchange();
  updateConfetti();
  updateFireworks();
  updateHealPop();
  if(active) updateHUD();
  renderHurry();
}

function drinkCan(can){
  boostLeft = CONFIG.drinkTime; drinks++;
  if(starT === 0){
    drinkStock = Math.min(CONFIG.maxDrinks, drinkStock + 1);
    tryHeal();
    if(lives >= maxLives && drinkStock >= CONFIG.starDrinks){
      // ライフ満タンで10本：無敵タイム（キラキラ点滅しながらトップスピード）
      drinkStock = 0;
      starT = CONFIG.starTime;
    }
    updateHUD();
  }
  setSpeed();
  for(let i=0;i<10;i++){
    particles.push({ x:can.x+3, y:can.y+4, vx:(Math.random()-.5)*1.6, vy:-rand(0,1.4), life:26, c:i%2 ? "#f8d030" : "#ffffff" });
  }
}

// ===== 傘 =====
const UMB_CANOPY = [   // 赤い傘（横21ドット）。ドットの曲線：外側は下から2段ずつ縦→1段ずつ→上で横に開く。ふちの線は使わず、上のふちと骨をハイライトで
  "..........M..........",
  ".......WPPPPPP.......",
  ".....WWPWPPPWPPP.....",
  "....WPPWPPPPPWPPP....",
  "...WPPWPPPPPPPWPPP...",
  "..PPPPWPPPPPPPWPPPP..",
  "..PPPWPPPPPPPPPWPPP..",
  ".PPPPWPPPPPPPPPWPPPP.",
  ".PPPPWPPPPPPPPPWPPPP.",
  ".P...P....P....P...P.",
];
const UMB_PAL = { P:"#e03030", p:"#9c1c1c", W:"#f26a6a", M:"#d0d0dc", H:"#5a3a28" };
const UMB_SHAFT = "#c8c8d4";   // 棒は銀色、手で持つところ（取っ手）は茶色
// 傘を持っている位置（キャンバス座標）：キャノピーの左上と、持ち手の下端
function umbrellaPos(){
  const x = Math.round(player.x), y = Math.round(player.y);
  if(onBike) return { cx:x - 3, cy:y - 18, hx:x + 7, hy:y + 1 };
  return { cx:x - 2, cy:y - 12, hx:x + 8, hy:y + 7 };
}
// 宙返り用：女の子（または自転車）と傘をひとつの絵にまとめて、90°ずつ回したもの
// 傘の色は女の子・自転車の色記号とぶつからないよう U,V,Z,Y,X に置きかえる
const UMB_FLIP_PAL = { U:"#e03030", V:"#f26a6a", Z:"#d0d0dc", Y:"#c8c8d4", X:"#5a3a28" };
// 無敵タイム中は傘も女の子と同じようにキラキラ点滅（女の子の点滅と同じタイミング）
const UMB_STAR = [
  { P:"#ffffff", p:"#ffe070", W:"#ffffff", M:"#fff4c0", H:"#f8d030", S:"#fff4c0" },
  { P:"#ffd060", p:"#ff9030", W:"#fff0a0", M:"#ffe8a0", H:"#c06020", S:"#ffe8a0" },
];
const umbStarOn = () => starT > 0 && (state === "playing" || state === "goal");
function umbPal(){ return umbStarOn() ? Object.assign({}, UMB_PAL, UMB_STAR[Math.floor(animTick / 3) % 2]) : UMB_PAL; }
function umbFlipPal(){
  if(!umbStarOn()) return UMB_FLIP_PAL;
  const q = UMB_STAR[Math.floor(animTick / 3) % 2];
  return { U:q.P, V:q.W, Z:q.M, Y:q.S, X:q.H };
}
const _flipCache = {};
function flipComposite(withBike){
  const key = withBike ? "b" : "g";
  if(_flipCache[key]) return _flipCache[key];
  const base = withBike ? { rows:BIKE_FRAMES[0], ox:-5, oy:-6 } : { rows:GIRL_FULL, ox:0, oy:0 };
  const u = withBike ? { cx:-3, cy:-18, hx:7, hy:1 } : { cx:-2, cy:-12, hx:8, hy:7 };
  const pivot = withBike ? { x:7, y:4 } : { x:6, y:8 };
  const cw = UMB_CANOPY[0].length, ch = UMB_CANOPY.length;
  const minX = Math.min(base.ox, u.cx), maxX = Math.max(base.ox + base.rows[0].length - 1, u.cx + cw - 1);
  const minY = Math.min(base.oy, u.cy), maxY = Math.max(base.oy + base.rows.length - 1, u.hy);
  const W2 = maxX - minX + 1, H2 = maxY - minY + 1;
  const g = []; for(let y=0;y<H2;y++) g.push(new Array(W2).fill("."));
  const put = (x, y, c) => { if(c !== ".") g[y - minY][x - minX] = c; };
  base.rows.forEach((r, y) => [...r].forEach((c, x) => put(base.ox + x, base.oy + y, c)));
  for(let y = u.cy + ch - 1; y <= u.hy; y++) put(u.hx, y, y >= u.hy - 2 ? "X" : "Y");
  const map = { P:"U", W:"V", M:"Z" };
  UMB_CANOPY.forEach((r, y) => [...r].forEach((c, x) => { if(c !== ".") put(u.cx + x, u.cy + y, map[c] || c); }));
  let rows = g.map(r => r.join("")), p = { x:pivot.x - minX, y:pivot.y - minY };
  const out = [];
  for(let k=0;k<4;k++){
    out.push({ rows, dx:pivot.x - p.x, dy:pivot.y - p.y });
    const h = rows.length;
    rows = rotate90(rows);
    p = { x:h - 1 - p.y, y:p.x };   // 時計回りに90°回したときの回転の中心
  }
  return (_flipCache[key] = out);
}
function flipFrameIndex(){ return Math.min(3, Math.floor((CONFIG.flipTime - player.flip) / (CONFIG.flipTime / 4))); }
// 宙返り中（傘あり）のカラス用の当たり判定：回っている絵全体
function flipBox(){
  const fr = flipComposite(onBike)[flipFrameIndex()];
  return { x:Math.round(player.x) + fr.dx + 1, y:Math.round(player.y) + fr.dy + 1, w:fr.rows[0].length - 2, h:fr.rows.length - 2 };
}
function drawFlipWithUmbrella(pal){
  const fr = flipComposite(onBike)[flipFrameIndex()];
  drawSprite(fr.rows, Math.round(player.x) + fr.dx, Math.round(player.y) + fr.dy, Object.assign({}, pal, umbFlipPal()));
}
function drawUmbrellaAt(cx, cy, hx, hy, pal = UMB_PAL){
  const top = cy + UMB_CANOPY.length;
  ctx.fillStyle = pal.S || UMB_SHAFT;           // 棒（銀）
  ctx.fillRect(hx, top - 1, 1, Math.max(0, hy - 2 - (top - 1)));
  ctx.fillStyle = pal.H;                        // 取っ手（茶）
  ctx.fillRect(hx, hy - 2, 1, 3);
  drawSprite(UMB_CANOPY, cx, cy, pal);
}
function drawHeldUmbrella(){
  if(umbrella <= 0 || rolling > 0 || player.flip > 0 || state === "crash" || state === "clear") return;   // 宙返り中は女の子と一緒に回して描く
  if(blink > 0 && Math.floor(blink / 4) % 2) return;
  const u = umbrellaPos();
  drawUmbrellaAt(u.cx, u.cy, u.hx, u.hy, umbPal());   // 持っている傘（無敵中は光る）
}
// 耐久を★で表示（減った★だけチカチカして消える）
function showUmbStars(before, after){
  const el = document.getElementById("umbStars");

  el.className = "umbstars outline"; void el.offsetWidth; el.className = "umbstars outline show";
}
// カラスを傘で防ぐ。防いだら true
function umbrellaBlock(){
  if(umbrella <= 0) return false;
  const before = umbrella;
  umbrella--;
  invulT = 30;
  showUmbStars(before, umbrella);
  if(umbrella === 0){
    // 耐久がなくなった：その場で壊れて消える
    const u = umbrellaPos();
    for(let i=0;i<18;i++) particles.push({ x:u.cx + rand(0, 21), y:u.cy + rand(0, 9), vx:rand(-1.2, 1.2), vy:-rand(.2, 1.4), life:30, c:[UMB_PAL.P, UMB_PAL.p, UMB_PAL.W][i % 3] });
    girlSay("傘がこわれた！", 90);
  }
  return true;
}
// 宙返り中に傘で吹き飛ばせるか（回っている絵全体が当たり判定）
const boxOv = (p, q) => p.x < q.x+q.w && p.x+p.w > q.x && p.y < q.y+q.h && p.y+p.h > q.y;
function spinUmbHit(box){ return umbrella > 0 && rolling === 0 && player.flip > 0 && starT === 0 && boxOv(flipBox(), box); }
// 吹っ飛ばしたときの演出（光・破片・ゆれ・音）
function knockFX(cx, cy, debris){
  for(let k=0;k<12;k++){
    const ang = k / 12 * Math.PI * 2;

  }
  for(let k=0;k<10;k++) particles.push({ x:cx, y:cy, vx:rand(-1.4, 2.2), vy:-rand(.2, 1.8), life:28, c:debris[k % debris.length] });

}
function knockCat(cat){

}
// カラスを吹っ飛ばす：勢いよく飛ばして、パッと光る＋画面が少しゆれる＋「カーッ！」
let shakeT = 0;

// 地上の障害物に当たった：傘を手放して、上にスーッと飛んでいく
function dropUmbrella(){
  if(umbrella <= 0) return;
  const u = umbrellaPos();
  flyUmbs.push({ cx:u.cx, cy:u.cy, hx:u.hx, hy:u.hy, age:0 });

function updateFlyUmbs(){
  for(let i = flyUmbs.length - 1; i >= 0; i--){

    f.cy -= dy; f.hy -= dy; f.cx += dx; f.hx += dx;

// 自転車がダメージを1回肩代わりして壊れる。肩代わりしたら true

// バナナ：バナナ自体ではライフは減らない。スピードが落ちて転がる（転がっている間にほかの物に当たるとダメージ）。
// 自転車のときは転ばず、スピードが落ちるだけ（自転車も壊れない）
function slipBanana(b){

  }
}

function stepPuddle(p){
  p.hit = true;
  if(bikeAbsorb()) return;       // 自転車が肩代わり（傘は無傷）
  dropUmbrella();                // 自転車がなければダメージ＋傘を失う
  runT = 0; hurryArmed = true;   // 水たまりで足を取られたのもアクション扱い
  mul -= CONFIG.puddleDown; setSpeed();
  blink = 60;
  lives--;
  tryHeal(true);
  updateHUD();
  playDamageSE();
  showDamagePop();

}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){

    if(--p.life <= 0) particles.splice(i,1);
  }
}

const CONFETTI_COLORS = ["#f8d030", "#e03030", "#3070e0", "#30c070", "#f870b0", "#ffffff"];
function updateConfetti(){
  if(confettiSpawn > 0){
    confettiSpawn--;
    const n = confettiSpawn > 120 ? 3 : 1;
    for(let i=0;i<n;i++){
      confetti.push({
        x: rand(0, W), y: -2 - VIEW_OY,
        vy: rand(.25, .6), phase: rand(0, 6), amp: rand(.2, .5),
        c: CONFETTI_COLORS[irand(0, CONFETTI_COLORS.length-1)], t:0
      });
    }
  }
  for(let i=confetti.length-1;i>=0;i--){
    const c = confetti[i];
    c.t++;
    c.y += c.vy;
    c.x += Math.sin(c.phase + c.t * .06) * c.amp;
    if(c.y > H + 2) confetti.splice(i,1);
  }
}

// ===== 花火（週クリア） =====
function launchFirework(){
  // 狙った高さ（画面の上半分）でちょうど頂点になる初速で打ち上げる
  const ty = rand(-VIEW_OY + 12, 44), y0 = H + 2;
  fireworks.push({ kind:"rocket", x:rand(30, W - 30), y:y0, vy:-Math.sqrt(2 * .035 * (y0 - ty)),
    c:CONFETTI_COLORS[irand(0, CONFETTI_COLORS.length-2)], t:0 });
  playLaunchSE();
}
function burstFirework(r){
  const n = irand(44, 56), sp = rand(1.5, 1.9);
  const c2 = Math.random() < .5 ? "#ffffff" : r.c;
  for(let i=0;i<n;i++){
    const a = i / n * Math.PI * 2 + rand(-.08, .08), v = sp * rand(.85, 1.05);
    fireworks.push({ kind:"spark", x:r.x, y:r.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      c: i % 3 ? r.c : c2, life:irand(55, 75), t:0 });
  }
  playBurstSE();
}
function updateFireworks(){
  if(fwSpawn > 0){
    fwSpawn--;
    if(--fwNext <= 0){
      launchFirework();
      if(Math.random() < .3) launchFirework();   // たまに2発同時
      fwNext = irand(24, 48);
    }
  }
  for(let i=fireworks.length-1;i>=0;i--){
    const f = fireworks[i];
    f.t++;
    if(f.kind === "rocket"){
      f.y += f.vy; f.vy += .035;
      if(f.t % 2 === 0) fireworks.push({ kind:"spark", x:f.x + rand(-.5, .5), y:f.y + 2, vx:0, vy:.2, c:"#f8d030", life:10, t:0 });
      if(f.vy >= 0){ burstFirework(f); fireworks.splice(i, 1); }
    } else {
      f.x += f.vx; f.y += f.vy; f.vx *= .965; f.vy = f.vy * .965 + .012;
      if(--f.life <= 0) fireworks.splice(i, 1);
    }
  }
}
function drawFireworks(){
  fireworks.forEach(f=>{
    if(f.kind === "spark" && f.life < 18 && f.t % 4 < 2) return;   // 消える前にチカチカ
    ctx.fillStyle = f.c;
    // 火花は 2×2、尾を引く光は 1×1、玉は 2×3
    const big = f.kind === "rocket" || f.vx !== 0;
    ctx.fillRect(Math.round(f.x), Math.round(f.y), big ? 2 : 1, f.kind === "rocket" ? 3 : (big ? 2 : 1));
  });
}

// いま画面に出ているゲーム画面をそのまま画像にする（ボタン類だけ除く）
async function captureScreen(withUI = true){
  try{ await document.fonts.ready; }catch(e){}
  const scr = document.querySelector(".screen");
  const sr = scr.getBoundingClientRect(), cr = canvas.getBoundingClientRect();
  if(!cr.width) return null;
  const k = (W * 4) / cr.width;   // ゲーム 1ドット＝4px
  const c = document.createElement("canvas");
  c.width = Math.round(sr.width * k); c.height = Math.round(sr.height * k);
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  const X = v => (v - sr.left) * k, Y = v => (v - sr.top) * k;
  const SKIP = "button, .sharebar, .pausemenu, .xchg, .camflash";
  const uiOff = !withUI;
  const loadImg = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  const shadows = s => { const out = []; if(!s || s === "none") return out;
    const re = /(rgba?\([^)]*\)|#[0-9a-f]+)\s+(-?[\d.]+)px\s+(-?[\d.]+)px/gi; let m;
    while((m = re.exec(s))) out.push([m[1], +m[2], +m[3]]); return out; };
  async function walk(el, alpha){
    if(el.nodeType === 3){
      const t = el.textContent; if(!t.trim()) return;
      const cs = getComputedStyle(el.parentElement);
      g.font = `${cs.fontStyle} ${cs.fontWeight} ${parseFloat(cs.fontSize) * k}px ${cs.fontFamily}`;
      g.textBaseline = "alphabetic"; g.textAlign = "left";
      const asc = g.measureText("あ").fontBoundingBoxAscent || parseFloat(cs.fontSize) * k * .8;
      const sh = shadows(cs.textShadow), r = document.createRange();
      let i = 0;
      for(const ch of t){
        const n = ch.length;
        if(ch.trim()){
          r.setStart(el, i); r.setEnd(el, i + n);
          const b = r.getBoundingClientRect();
          if(b.width){
            const x = X(b.left), y = Y(b.top) + asc;
            g.globalAlpha = alpha;
            sh.forEach(([col, dx, dy]) => { g.fillStyle = col; g.fillText(ch, x + dx * k, y + dy * k); });
            g.fillStyle = cs.color; g.fillText(ch, x, y);
          }
        }
        i += n;
      }
      return;
    }
    if(el.nodeType !== 1 || el.matches(SKIP)) return;
    const cs = getComputedStyle(el);
    if(cs.display === "none" || cs.visibility === "hidden") return;
    alpha *= parseFloat(cs.opacity); if(alpha <= 0) return;
    const b = el.getBoundingClientRect();
    g.globalAlpha = alpha;
    if(el.tagName === "CANVAS"){ g.drawImage(el, X(b.left), Y(b.top), b.width * k, b.height * k); return; }
    if(uiOff && el !== scr) return;   // UI オフ：ゲームの絵（canvas）だけ
    if(el !== scr && cs.boxShadow && cs.boxShadow !== "none") shadows(cs.boxShadow.replace(/[^,()]*inset[^,]*/g, "")).forEach(([col, dx, dy]) => {
      // CSS と同じく、影は要素の外側だけに描く
      const bx = X(b.left), by = Y(b.top), w = b.width * k, h = b.height * k;
      g.save(); g.beginPath(); g.rect(0, 0, c.width, c.height); g.rect(bx, by, w, h); g.clip("evenodd");
      g.fillStyle = col; g.fillRect(bx + dx * k, by + dy * k, w, h); g.restore();
    });
    if(el !== scr && cs.backgroundColor && !/rgba\(.*,\s*0\)$/.test(cs.backgroundColor) && cs.backgroundColor !== "transparent"){
      g.fillStyle = cs.backgroundColor; g.fillRect(X(b.left), Y(b.top), b.width * k, b.height * k);
    }
    const bw = parseFloat(cs.borderTopWidth);
    if(bw > 0 && cs.borderTopStyle !== "none"){
      g.strokeStyle = cs.borderTopColor; g.lineWidth = bw * k;
      g.strokeRect(X(b.left) + bw * k / 2, Y(b.top) + bw * k / 2, (b.width - bw) * k, (b.height - bw) * k);
    }
    if(el.tagName === "IMG"){ if(el.complete && el.naturalWidth) g.drawImage(el, X(b.left), Y(b.top), b.width * k, b.height * k); return; }
    if(el.tagName.toLowerCase() === "svg"){
      const s = el.cloneNode(true);
      s.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      s.setAttribute("width", b.width); s.setAttribute("height", b.height);
      if(!s.getAttribute("fill")) s.setAttribute("fill", cs.fill && cs.fill !== "none" ? cs.fill : cs.color);
      const im = await loadImg("data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(s)));
      if(im){ g.globalAlpha = alpha; g.drawImage(im, X(b.left), Y(b.top), b.width * k, b.height * k); }
      return;
    }
    for(const ch of el.childNodes) await walk(ch, alpha);
  }
  g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
  await walk(scr, 1);
  return await new Promise(res => c.toBlob(res, "image/png"));
}
